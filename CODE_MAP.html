<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CODE MAP · GGUF Chat</title>
<style>
:root{
  --bg:#0f1420; --panel:#161d2c; --panel2:#1c2536; --line:#28324a;
  --fg:#e8edf7; --mut:#93a0b8; --acc:#5b9cff; --acc2:#37d399;
  --code:#0b101b;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.45 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
a{color:var(--acc)}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#111726,#0f1420);
  border-bottom:1px solid var(--line);padding:10px 14px}
h1{font-size:16px;margin:0 0 2px}
.sub{color:var(--mut);font-size:12px;margin:0 0 8px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search]{flex:1;min-width:180px;background:var(--panel2);border:1px solid var(--line);
  color:var(--fg);border-radius:8px;padding:7px 10px;outline:none}
input[type=search]:focus{border-color:var(--acc)}
button{background:var(--panel2);border:1px solid var(--line);color:var(--fg);
  border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px}
button:hover{border-color:var(--acc);color:#fff}
.langs button.on{background:var(--acc);border-color:var(--acc);color:#04101f;font-weight:700}
.cnt{color:var(--mut);font-size:12px;margin-left:auto}
main{padding:12px}
table{width:100%;table-layout:fixed;border-collapse:collapse}
col.c1{width:30%} col.c2{width:22%} col.c3{width:48%}
thead th{position:sticky;top:0;background:#0f1420;color:var(--mut);text-align:left;
  font-size:11px;letter-spacing:.03em;text-transform:uppercase;padding:6px 8px;
  border-bottom:1px solid var(--line);z-index:10}
tr.grp td{background:var(--panel);border-top:2px solid var(--line);border-bottom:1px solid var(--line);
  padding:7px 10px;cursor:pointer;font-weight:600}
tr.grp .gcount{color:var(--mut);font-weight:400;font-size:12px}
tr.grp .car{display:inline-block;width:1.1em;color:var(--acc)}
tr.row td{vertical-align:top;padding:7px 8px;border-bottom:1px solid var(--line);
  border-right:1px solid rgba(255,255,255,.03)}
tr.row{cursor:pointer}
tr.row:hover td{background:#141c2b}
tr.row.open td{background:#131b2a}
.badge{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--acc2);border:1px solid #245a45;background:#10241c;border-radius:5px;
  padding:0 5px;margin-right:6px;vertical-align:1px}
.name{font-family:ui-monospace,Consolas,"Cascadia Mono",monospace;font-size:13px;color:#fff;
  word-break:break-word}
.owner{color:var(--mut);font-size:11px;margin-top:2px}
.owner b{color:#a9b6cf;font-weight:600}
.chip{display:inline-block;font-size:10.5px;border:1px solid var(--line);background:var(--panel2);
  color:#c7d2e6;border-radius:999px;padding:1px 7px;margin:0 4px 4px 0;white-space:nowrap}
.loc{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--acc)}
.sumtxt{color:#c9d4e8;font-size:12.5px;margin-top:3px}
.clamp{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clamp.wrap{white-space:normal;word-break:break-word}
.car{float:right;color:var(--mut)}
.code{margin-top:8px;background:var(--code);border:1px solid var(--line);border-radius:8px;
  padding:8px 6px;max-height:60vh;overflow:auto;font-family:ui-monospace,Consolas,"Cascadia Mono",monospace;
  font-size:12px;line-height:1.5;tab-size:4}
.cl{display:flex;white-space:pre}
.ln{flex:0 0 3.6em;text-align:right;padding-right:.7em;color:#5b6880;user-select:none}
.lc{flex:1 1 auto;white-space:pre-wrap;word-break:break-word;color:#d7e0f2}
.hide{display:none}
tr.row .codecell{display:none}
tr.row.open .codecell{display:block}
tr.row.open .sumcell{display:none}
mark{background:#3a2f00;color:#ffe08a;border-radius:3px}
footer{color:var(--mut);font-size:11px;padding:14px;text-align:center}
@media (max-width:900px){table{min-width:760px} main{overflow-x:auto}}
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <div class="bar">
    <input id="search" type="search" autocomplete="off">
    <span class="langs" id="langs"></span>
    <button id="expandAll"></button>
    <button id="collapseAll"></button>
    <span class="cnt" id="cnt"></span>
  </div>
</header>
<main>
  <table>
    <colgroup><col class="c1"><col class="c2"><col class="c3"></colgroup>
    <thead><tr><th id="h1"></th><th id="h2"></th><th id="h3"></th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</main>
<footer id="foot"></footer>
<script>
const DB = {"rows": [{"file": "app/src/main/java/com/devhorizon/online/ggufchat/MainActivity.kt", "cat": "UI · Entry", "order": 10, "start": 33, "end": 33, "kind": "class", "name": "MainActivity", "owner": "", "sig": "class MainActivity : ComponentActivity() {", "tech": [], "sum": {"ru": "Точка входа приложения (edge-to-edge + Compose).", "en": "App entry point (edge-to-edge + Compose).", "de": "App-Einstiegspunkt (Edge-to-Edge + Compose)."}, "code": "class MainActivity : ComponentActivity() {"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/MainActivity.kt", "cat": "UI · Entry", "order": 10, "start": 34, "end": 43, "kind": "fun", "name": "onCreate", "owner": "MainActivity", "sig": "override fun onCreate(savedInstanceState: Bundle?) {", "tech": ["compose"], "sum": {"ru": "UI-компонент Compose", "en": "Compose UI component", "de": "Compose-UI-Komponente"}, "code": "    override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n        enableEdgeToEdge()\n        setContent {\n            AppNavigation()\n        }\n    }\n}\n\n@Composable"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/MainActivity.kt", "cat": "UI · Entry", "order": 10, "start": 44, "end": 73, "kind": "fun", "name": "AppNavigation", "owner": "", "sig": "fun AppNavigation() {", "tech": ["compose", "flow"], "sum": {"ru": "Создаёт ViewModel, тему, локализатор и NavHost.", "en": "Creates the ViewModel, theme, localizer and NavHost.", "de": "Erzeugt ViewModel, Theme, Lokalisierer und NavHost."}, "code": "fun AppNavigation() {\n    val viewModel: ChatViewModel = viewModel()\n    val navController = rememberNavController()\n    val drawerState = rememberDrawerState(DrawerValue.Closed)\n    val scope = rememberCoroutineScope()\n\n    val lang by viewModel.appLanguage.collectAsState()\n    val appTheme by viewModel.appTheme.collectAsState()\n    val l = { key: String -> Localization.getString(key, lang) }\n\n    val theme = when (appTheme) {\n        \"dark\" -> AppTheme.DARK\n        \"green\" -> AppTheme.GREEN\n        \"orange\" -> AppTheme.ORANGE\n        \"light_blue\" -> AppTheme.LIGHT_BLUE\n        \"yellow\" -> AppTheme.YELLOW\n        else -> AppTheme.LIGHT\n    }\n\n    GGUFChatTemplateTheme(appTheme = theme) {\n        Surface(\n            modifier = Modifier.fillMaxSize(),\n            color = MaterialTheme.colorScheme.background\n        ) {\n            AppContent(viewModel, navController, drawerState, scope, l)\n        }\n    }\n}\n\n@Composable"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/MainActivity.kt", "cat": "UI · Entry", "order": 10, "start": 74, "end": 136, "kind": "fun", "name": "AppContent", "owner": "", "sig": "private fun AppContent(", "tech": ["compose", "coroutines", "flow"], "sum": {"ru": "Drawer + NavHost с маршрутами chat/models/settings.", "en": "Drawer + NavHost with chat/models/settings routes.", "de": "Drawer + NavHost mit den Routen chat/models/settings."}, "code": "private fun AppContent(\n    viewModel: ChatViewModel,\n    navController: androidx.navigation.NavHostController,\n    drawerState: androidx.compose.material3.DrawerState,\n    scope: kotlinx.coroutines.CoroutineScope,\n    l: (String) -> String\n) {\n    val sessions by viewModel.chatRepository.sessions.collectAsState()\n\n    ModalNavigationDrawer(\n        drawerState = drawerState,\n        drawerContent = {\n            ModalDrawerSheet {\n                DrawerContent(\n                    sessions = sessions,\n                    currentSessionId = viewModel.chatRepository.currentSessionId.collectAsState().value,\n                    l = l,\n                    onNewChat = {\n                        viewModel.createNewSession()\n                        scope.launch { drawerState.close() }\n                    },\n                    onSelectSession = { id ->\n                        viewModel.selectSession(id)\n                        scope.launch { drawerState.close() }\n                    },\n                    onDeleteSession = { id ->\n                        viewModel.deleteSession(id)\n                    },\n                    onOpenModels = {\n                        scope.launch { drawerState.close() }\n                        navController.navigate(\"models\")\n                    },\n                    onOpenSettings = {\n                        scope.launch { drawerState.close() }\n                        navController.navigate(\"settings\")\n                    }\n                )\n            }\n        }\n    ) {\n        NavHost(navController = navController, startDestination = \"chat\") {\n            composable(\"chat\") {\n                ChatScreen(\n                    viewModel = viewModel,\n                    onOpenDrawer = { scope.launch { drawerState.open() } },\n                    onOpenSettings = { navController.navigate(\"settings\") }\n                )\n            }\n            composable(\"models\") {\n                ModelPickerScreen(\n                    viewModel = viewModel,\n                    onBack = { navController.popBackStack() }\n                )\n            }\n            composable(\"settings\") {\n                SettingsScreen(\n                    viewModel = viewModel,\n                    onBack = { navController.popBackStack() }\n                )\n            }\n        }\n    }\n}"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/viewmodel/ChatViewModel.kt", "cat": "ViewModel", "order": 20, "start": 29, "end": 86, "kind": "class", "name": "ChatViewModel", "owner": "", "sig": "class ChatViewModel(application: Application) : AndroidViewModel(application) {", "tech": ["flow", "viewmodel"], "sum": {"ru": "Единый узел состояния UI: генерация, модели, документы, голос, настройки.", "en": "Single UI state hub: generation, models, documents, voice, settings.", "de": "Zentrale UI-Zustandsquelle: Generierung, Modelle, Dokumente, Sprache, Einstellungen."}, "code": "class ChatViewModel(application: Application) : AndroidViewModel(application) {\n    private val TAG = \"ChatViewModel\"\n\n    val llmEngine = LlmEngine(application)\n    val chatRepository = ChatRepository(application)\n    val suggestionEngine = SuggestionEngine(llmEngine)\n    val sttManager = SttManager(application)\n    val ttsManager = TtsManager(application)\n\n    // Chat state\n    private val _inputText = MutableStateFlow(\"\")\n    val inputText: StateFlow<String> = _inputText.asStateFlow()\n\n    // Image attached to the next message (local file path), if any\n    private val _pendingImage = MutableStateFlow<String?>(null)\n    val pendingImage: StateFlow<String?> = _pendingImage.asStateFlow()\n\n    // True while the vision encoder is processing an image (slow, cancellable)\n    private val _isPreparingVision = MutableStateFlow(false)\n    val isPreparingVision: StateFlow<Boolean> = _isPreparingVision.asStateFlow()\n\n    private val _isGenerating = MutableStateFlow(false)\n    val isGenerating: StateFlow<Boolean> = _isGenerating.asStateFlow()\n\n    private val _streamingText = MutableStateFlow(\"\")\n    val streamingText: StateFlow<String> = _streamingText.asStateFlow()\n\n    private val _suggestions = MutableStateFlow<List<String>>(emptyList())\n    val suggestions: StateFlow<List<String>> = _suggestions.asStateFlow()\n\n    // The suggestion currently being typed by the model (live streaming preview)\n    private val _pendingSuggestion = MutableStateFlow<String?>(null)\n    val pendingSuggestion: StateFlow<String?> = _pendingSuggestion.asStateFlow()\n\n    private val _isGeneratingSuggestions = MutableStateFlow(false)\n    val isGeneratingSuggestions: StateFlow<Boolean> = _isGeneratingSuggestions.asStateFlow()\n\n    private val _statusText = MutableStateFlow(\"\")\n    val statusText: StateFlow<String> = _statusText.asStateFlow()\n\n    private val _appLanguage = MutableStateFlow(\"en\")\n    val appLanguage: StateFlow<String> = _appLanguage.asStateFlow()\n\n    private val _appTheme = MutableStateFlow(\"light\")\n    val appTheme: StateFlow<String> = _appTheme.asStateFlow()\n\n    // Documents attached to the current session (\"chat with docs\")\n    private val _documents = MutableStateFlow<List<SessionDocument>>(emptyList())\n    val documents: StateFlow<List<SessionDocument>> = _documents.asStateFlow()\n\n    // Model search (Hugging Face)\n    private val _isSearching = MutableStateFlow(false)\n    val isSearching: StateFlow<Boolean> = _isSearching.asStateFlow()\n\n    // Last import/download error, shown on the model screen (the search dialog\n    // closes immediately, so a failed download was previously silent).\n    private val _downloadError = MutableStateFlow<String?>(null)\n    val downloadError: StateFlow<String?> = _downloadError.asStateFlow()"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/viewmodel/ChatViewModel.kt", "cat": "ViewModel", "order": 20, "start": 87, "end": 104, "kind": "fun", "name": "clearDownloadError", "owner": "ChatViewModel", "sig": "fun clearDownloadError() { _downloadError.value = null }", "tech": ["flow"], "sum": {"ru": "реактивное состояние (StateFlow)", "en": "reactive state (StateFlow)", "de": "reaktiver Zustand (StateFlow)"}, "code": "    fun clearDownloadError() { _downloadError.value = null }\n\n    private val _searchResults = MutableStateFlow<List<com.devhorizon.online.ggufchat.data.llm.GgufSearchResult>>(emptyList())\n    val searchResults: StateFlow<List<com.devhorizon.online.ggufchat.data.llm.GgufSearchResult>> = _searchResults.asStateFlow()\n\n    private val _searchError = MutableStateFlow<String?>(null)\n    val searchError: StateFlow<String?> = _searchError.asStateFlow()\n\n    // System RAM monitor (bytes), refreshed periodically for the header bar.\n    private val _ramTotal = MutableStateFlow(0L)\n    val ramTotal: StateFlow<Long> = _ramTotal.asStateFlow()\n    private val _ramUsed = MutableStateFlow(0L)\n    val ramUsed: StateFlow<Long> = _ramUsed.asStateFlow()\n    private val _ramFree = MutableStateFlow(0L)\n    val ramFree: StateFlow<Long> = _ramFree.asStateFlow()\n\n    private var generationJob: Job? = null\n    private var stopRequested = false"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/viewmodel/ChatViewModel.kt", "cat": "ViewModel", "order": 20, "start": 106, "end": 109, "kind": "fun", "name": "l", "owner": "ChatViewModel", "sig": "private fun l(key: String): String =", "tech": [], "sum": {"ru": "локализация (en/ru/de)", "en": "localization (en/ru/de)", "de": "Lokalisierung (en/ru/de)"}, "code": "    private fun l(key: String): String =\n        com.devhorizon.online.ggufchat.ui.theme.Localization.getString(key, llmEngine.settings.value.appLanguage)\n\n    /** Heuristic: a projector file and a model file share at least two name tokens. */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/viewmodel/ChatViewModel.kt", "cat": "ViewModel", "order": 20, "start": 110, "end": 118, "kind": "fun", "name": "projectorMatchesModel", "owner": "ChatViewModel", "sig": "private fun projectorMatchesModel(projectorName: String, modelName: String): Boolean {", "tech": ["regex"], "sum": {"ru": "обработка текста", "en": "text processing", "de": "Textverarbeitung"}, "code": "    private fun projectorMatchesModel(projectorName: String, modelName: String): Boolean {\n        fun tokens(s: String) = s.lowercase()\n            .split(Regex(\"[^a-z0-9]+\"))\n            .filter { it.length >= 3 }\n            .toSet()\n        return tokens(projectorName).intersect(tokens(modelName)).size >= 2\n    }\n\n    /** Index of the last sentence/clause delimiter in [sb], or -1 if none. */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/viewmodel/ChatViewModel.kt", "cat": "ViewModel", "order": 20, "start": 119, "end": 144, "kind": "fun", "name": "lastTtsDelimiter", "owner": "ChatViewModel", "sig": "private fun lastTtsDelimiter(sb: CharSequence): Int {        for (i in sb.length - 1 downTo 0) {", "tech": ["coroutines", "viewmodel"], "sum": {"ru": "асинхронные корутины; локализация (en/ru/de)", "en": "async coroutines; localization (en/ru/de)", "de": "asynchrone Coroutinen; Lokalisierung (en/ru/de)"}, "code": "    private fun lastTtsDelimiter(sb: CharSequence): Int {        for (i in sb.length - 1 downTo 0) {\n            when (sb[i]) {\n                '.', '!', '?', ';', ':', ',', '…', '\\n',\n                '。', '！', '？', '，', '；', '：' -> return i\n            }\n        }\n        return -1\n    }\n\n    init {\n        _appLanguage.value = llmEngine.settings.value.appLanguage\n        _appTheme.value = llmEngine.settings.value.appTheme\n        ttsManager.initialize()\n        ttsManager.setLanguage(llmEngine.settings.value.ttsLanguage)\n        ttsManager.setRate(llmEngine.settings.value.ttsRate)\n        refreshDocuments()\n        refreshMemory()\n        viewModelScope.launch {\n            while (true) {\n                refreshMemory()\n                delay(2000)\n            }\n        }\n    }\n\n    // ==================== Model ===================="}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/viewmodel/ChatViewModel.kt", "cat": "ViewModel", "order": 20, "start": 146, "end": 159, "kind": "fun", "name": "importModel", "owner": "ChatViewModel", "sig": "fun importModel(uri: Uri, displayName: String? = null) {", "tech": ["coroutines", "viewmodel"], "sum": {"ru": "Копирует GGUF из Uri в files/models с прогрессом.", "en": "Copies a GGUF from a Uri into files/models with progress.", "de": "Kopiert ein GGUF aus einem Uri nach files/models mit Fortschritt."}, "code": "    fun importModel(uri: Uri, displayName: String? = null) {\n        viewModelScope.launch {\n            _statusText.value = l(\"importing_model\")\n            _downloadError.value = null\n            val result = llmEngine.importModel(uri, displayName)\n            if (result.isSuccess) {\n                _statusText.value = \"${l(\"model_imported\")}: ${result.getOrNull()?.name}\"\n            } else {\n                val msg = \"${l(\"import_failed\")}: ${result.exceptionOrNull()?.message}\"\n                _statusText.value = msg\n                _downloadError.value = msg\n            }\n        }\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/viewmodel/ChatViewModel.kt", "cat": "ViewModel", "order": 20, "start": 161, "end": 200, "kind": "fun", "name": "downloadModelFromUrl", "owner": "ChatViewModel", "sig": "fun downloadModelFromUrl(url: String, displayName: String? = null) {", "tech": ["coroutines", "viewmodel", "mtmd"], "sum": {"ru": "Скачивает модель с проверкой размера и целостности.", "en": "Downloads a model with size/integrity checks.", "de": "Lädt ein Modell mit Größen-/Integritätsprüfung."}, "code": "    fun downloadModelFromUrl(url: String, displayName: String? = null) {\n        // A projector (mmproj) URL is routed to projector handling: attach it to the\n        // loaded model, else to the vision model whose name matches, else to the first\n        // vision model. With no vision model yet, just store the file in models/.\n        val rawName = displayName ?: url.substringAfterLast('/').substringBefore('?')\n        if (rawName.contains(\"mmproj\", ignoreCase = true)) {\n            _downloadError.value = null\n            val vision = llmEngine.models.value.filter {\n                com.devhorizon.online.ggufchat.data.llm.ModelCompatibility.isVisionArch(it.architecture)\n            }\n            val target = vision.firstOrNull { llmEngine.isLoadedPath(it.path) }\n                ?: vision.firstOrNull { projectorMatchesModel(rawName, it.name) }\n                ?: vision.firstOrNull()\n            if (target == null) {\n                viewModelScope.launch {\n                    _statusText.value = l(\"downloading_model\")\n                    val r = llmEngine.downloadMmprojFromUrl(url, displayName)\n                    _statusText.value = if (r.isSuccess) l(\"projector_imported\")\n                    else \"${l(\"download_failed\")}: ${r.exceptionOrNull()?.message}\"\n                }\n                return\n            }\n            downloadMmprojForModel(target, url, displayName)\n            return\n        }\n        viewModelScope.launch {\n            _statusText.value = l(\"downloading_model\")\n            _downloadError.value = null\n            val result = llmEngine.downloadModelFromUrl(url, displayName)\n            if (result.isSuccess) {\n                _statusText.value = \"${l(\"model_downloaded\")}: ${result.getOrNull()?.name}\"\n            } else {\n                val msg = result.exceptionOrNull()?.message ?: l(\"error_msg\")\n                val text = if (msg == l(\"cancelled\")) l(\"download_cancelled\")\n                else \"${l(\"download_failed\")}: $msg\"\n                _statusText.value = text\n                _downloadError.value = text\n            }\n        }\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/viewmodel/ChatViewModel.kt", "cat": "ViewModel", "order": 20, "start": 202, "end": 204, "kind": "fun", "name": "cancelModelDownload", "owner": "ChatViewModel", "sig": "fun cancelModelDownload() {", "tech": ["coroutines", "viewmodel"], "sum": {"ru": "асинхронные корутины", "en": "async coroutines", "de": "asynchrone Coroutinen"}, "code": "    fun cancelModelDownload() {\n        viewModelScope.launch { llmEngine.cancelDownload() }\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/viewmodel/ChatViewModel.kt", "cat": "ViewModel", "order": 20, "start": 206, "end": 226, "kind": "fun", "name": "searchModels", "owner": "ChatViewModel", "sig": "fun searchModels(query: String, maxFileSizeMB: Long, includeProjectors: Boolean = false) {", "tech": ["coroutines", "viewmodel"], "sum": {"ru": "Ищет .gguf на Hugging Face (IO-диспетчер).", "en": "Searches .gguf on Hugging Face (IO dispatcher).", "de": "Sucht .gguf auf Hugging Face (IO-Dispatcher)."}, "code": "    fun searchModels(query: String, maxFileSizeMB: Long, includeProjectors: Boolean = false) {\n        viewModelScope.launch {\n            _isSearching.value = true\n            _searchError.value = null\n            _searchResults.value = emptyList()\n            val results = kotlinx.coroutines.withContext(kotlinx.coroutines.Dispatchers.IO) {\n                try {\n                    com.devhorizon.online.ggufchat.data.llm.HuggingFaceClient\n                        .searchGgufModels(query, maxFileSizeMB * 1024L * 1024L, includeProjectors = includeProjectors)\n                } catch (e: Exception) {\n                    Log.e(TAG, \"Model search failed\", e)\n                    emptyList()\n                }\n            }\n            _searchResults.value = results\n            _isSearching.value = false\n            if (results.isEmpty()) {\n                _searchError.value = \"no_results\"\n            }\n        }\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/viewmodel/ChatViewModel.kt", "cat": "ViewModel", "order": 20, "start": 228, "end": 238, "kind": "fun", "name": "loadModel", "owner": "ChatViewModel", "sig": "fun loadModel(modelInfo: ModelInfo) {", "tech": ["coroutines", "viewmodel", "mtmd"], "sum": {"ru": "Загружает модель, RAM-гейт и vision-проектор.", "en": "Loads the model, RAM gate and vision projector.", "de": "Lädt Modell, RAM-Gate und Vision-Projektor."}, "code": "    fun loadModel(modelInfo: ModelInfo) {\n        viewModelScope.launch {\n            _statusText.value = l(\"loading_model\")\n            val success = llmEngine.loadModel(modelInfo, modelInfo.mmprojPath)\n            _statusText.value = if (success) \"${l(\"model_loaded_msg\")}: ${modelInfo.name}\" else l(\"load_model_failed\")\n        }\n    }\n\n    // ==================== Image input ====================\n\n    /** Copies the picked image into app storage so it survives and is readable later. */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/viewmodel/ChatViewModel.kt", "cat": "ViewModel", "order": 20, "start": 239, "end": 258, "kind": "fun", "name": "attachImage", "owner": "ChatViewModel", "sig": "fun attachImage(uri: Uri) {", "tech": ["coroutines", "viewmodel", "saf", "fileio"], "sum": {"ru": "доступ к файлам (ContentResolver/SAF); файловый ввод-вывод; асинхронные корутины", "en": "file access (ContentResolver/SAF); file I/O; async coroutines", "de": "Dateizugriff (ContentResolver/SAF); Datei-E/A; asynchrone Coroutinen"}, "code": "    fun attachImage(uri: Uri) {\n        viewModelScope.launch {\n            try {\n                val path = kotlinx.coroutines.withContext(kotlinx.coroutines.Dispatchers.IO) {\n                    val app = getApplication<Application>()\n                    val dir = java.io.File(app.filesDir, \"images\").apply { mkdirs() }\n                    val out = java.io.File(dir, \"img_${UUID.randomUUID()}.jpg\")\n                    app.contentResolver.openInputStream(uri)?.use { input ->\n                        out.outputStream().use { input.copyTo(it) }\n                    }\n                    out.absolutePath\n                }\n                _pendingImage.value = path\n                _statusText.value = l(\"image_attached\")\n            } catch (e: Exception) {\n                Log.e(TAG, \"Failed to attach image\", e)\n                _statusText.value = l(\"image_error\")\n            }\n        }\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/viewmodel/ChatViewModel.kt", "cat": "ViewModel", "order": 20, "start": 260, "end": 262, "kind": "fun", "name": "clearPendingImage", "owner": "ChatViewModel", "sig": "fun clearPendingImage() {", "tech": [], "sum": {"ru": "Функция clearPendingImage", "en": "Function clearPendingImage", "de": "Funktion clearPendingImage"}, "code": "    fun clearPendingImage() {\n        _pendingImage.value = null\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/viewmodel/ChatViewModel.kt", "cat": "ViewModel", "order": 20, "start": 264, "end": 270, "kind": "fun", "name": "unloadModel", "owner": "ChatViewModel", "sig": "fun unloadModel() {", "tech": [], "sum": {"ru": "Функция unloadModel", "en": "Function unloadModel", "de": "Funktion unloadModel"}, "code": "    fun unloadModel() {\n        llmEngine.unloadModel()\n        _suggestions.value = emptyList()\n        _statusText.value = l(\"model_unloaded\")\n    }\n\n    // ==================== RAM ===================="}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/viewmodel/ChatViewModel.kt", "cat": "ViewModel", "order": 20, "start": 272, "end": 288, "kind": "fun", "name": "refreshMemory", "owner": "ChatViewModel", "sig": "fun refreshMemory() {", "tech": [], "sum": {"ru": "Читает общий/доступный объём RAM.", "en": "Reads total/available RAM.", "de": "Liest gesamten/verfügbaren RAM."}, "code": "    fun refreshMemory() {\n        try {\n            val am = getApplication<Application>()\n                .getSystemService(Application.ACTIVITY_SERVICE) as android.app.ActivityManager\n            val mi = android.app.ActivityManager.MemoryInfo()\n            am.getMemoryInfo(mi)\n            _ramTotal.value = mi.totalMem\n            _ramFree.value = mi.availMem\n            _ramUsed.value = (mi.totalMem - mi.availMem).coerceAtLeast(0L)\n        } catch (_: Exception) { /* keep the last values */ }\n    }\n\n    /**\n     * Free RAM: unload the model (which also frees its projector and KV cache),\n     * drop transient image state, run GC and return free native arena memory to\n     * the OS. One tap = \"unload everything\".\n     */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/viewmodel/ChatViewModel.kt", "cat": "ViewModel", "order": 20, "start": 289, "end": 314, "kind": "fun", "name": "freeRam", "owner": "ChatViewModel", "sig": "fun freeRam() {", "tech": ["jni"], "sum": {"ru": "Выгружает всё из RAM и возвращает память ОС.", "en": "Unloads everything and returns memory to the OS.", "de": "Entlädt alles und gibt Speicher an das OS zurück."}, "code": "    fun freeRam() {\n        val am = getApplication<Application>()\n            .getSystemService(Application.ACTIVITY_SERVICE) as android.app.ActivityManager\n        val before = android.app.ActivityManager.MemoryInfo()\n            .also { am.getMemoryInfo(it) }.availMem\n\n        llmEngine.unloadModel()\n        _pendingImage.value = null\n        _suggestions.value = emptyList()\n        _streamingText.value = \"\"\n        try { System.gc() } catch (_: Throwable) {}\n        try {\n            com.devhorizon.online.ggufchat.data.llm.LocalLlmNative.nativeFreeMemory()\n        } catch (_: Throwable) {}\n\n        val after = android.app.ActivityManager.MemoryInfo()\n            .also { am.getMemoryInfo(it) }.availMem\n        refreshMemory()\n        val freed = (after - before).coerceAtLeast(0L)\n        val freedText = if (freed >= 1_073_741_824L) {\n            \"%.1f GB\".format(freed / 1_073_741_824.0)\n        } else {\n            \"%.0f MB\".format(freed / 1_048_576.0)\n        }\n        _statusText.value = \"${l(\"ram_freed\")}: $freedText\"\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/viewmodel/ChatViewModel.kt", "cat": "ViewModel", "order": 20, "start": 316, "end": 320, "kind": "fun", "name": "deleteModel", "owner": "ChatViewModel", "sig": "fun deleteModel(modelInfo: ModelInfo) {", "tech": [], "sum": {"ru": "Функция deleteModel", "en": "Function deleteModel", "de": "Funktion deleteModel"}, "code": "    fun deleteModel(modelInfo: ModelInfo) {\n        llmEngine.deleteModel(modelInfo)\n    }\n\n    // ==================== Chat ===================="}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/viewmodel/ChatViewModel.kt", "cat": "ViewModel", "order": 20, "start": 322, "end": 324, "kind": "fun", "name": "setInputText", "owner": "ChatViewModel", "sig": "fun setInputText(text: String) {", "tech": [], "sum": {"ru": "Функция setInputText", "en": "Function setInputText", "de": "Funktion setInputText"}, "code": "    fun setInputText(text: String) {\n        _inputText.value = text\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/viewmodel/ChatViewModel.kt", "cat": "ViewModel", "order": 20, "start": 326, "end": 331, "kind": "fun", "name": "createNewSession", "owner": "ChatViewModel", "sig": "fun createNewSession() {", "tech": [], "sum": {"ru": "Функция createNewSession", "en": "Function createNewSession", "de": "Funktion createNewSession"}, "code": "    fun createNewSession() {\n        chatRepository.createSession()\n        _suggestions.value = emptyList()\n        suggestionEngine.clearHistory()\n        refreshDocuments()\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/viewmodel/ChatViewModel.kt", "cat": "ViewModel", "order": 20, "start": 333, "end": 338, "kind": "fun", "name": "selectSession", "owner": "ChatViewModel", "sig": "fun selectSession(id: String) {", "tech": [], "sum": {"ru": "Функция selectSession", "en": "Function selectSession", "de": "Funktion selectSession"}, "code": "    fun selectSession(id: String) {\n        chatRepository.selectSession(id)\n        _suggestions.value = emptyList()\n        suggestionEngine.clearHistory()\n        refreshDocuments()\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/viewmodel/ChatViewModel.kt", "cat": "ViewModel", "order": 20, "start": 340, "end": 345, "kind": "fun", "name": "deleteSession", "owner": "ChatViewModel", "sig": "fun deleteSession(id: String) {", "tech": [], "sum": {"ru": "Функция deleteSession", "en": "Function deleteSession", "de": "Funktion deleteSession"}, "code": "    fun deleteSession(id: String) {\n        chatRepository.deleteSession(id)\n        refreshDocuments()\n    }\n\n    // ==================== Documents (\"chat with docs\") ===================="}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/viewmodel/ChatViewModel.kt", "cat": "ViewModel", "order": 20, "start": 347, "end": 354, "kind": "fun", "name": "refreshDocuments", "owner": "ChatViewModel", "sig": "private fun refreshDocuments() {", "tech": [], "sum": {"ru": "Функция refreshDocuments", "en": "Function refreshDocuments", "de": "Funktion refreshDocuments"}, "code": "    private fun refreshDocuments() {\n        _documents.value = chatRepository.getCurrentSession()?.documents ?: emptyList()\n    }\n\n    /**\n     * Reads a picked file, trims it to the remaining context budget and attaches\n     * it to the current session. Its text is sent as context on every generation.\n     */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/viewmodel/ChatViewModel.kt", "cat": "ViewModel", "order": 20, "start": 355, "end": 398, "kind": "fun", "name": "addDocument", "owner": "ChatViewModel", "sig": "fun addDocument(uri: Uri) {", "tech": ["coroutines", "viewmodel"], "sum": {"ru": "асинхронные корутины; генерация идентификаторов", "en": "async coroutines; ID generation", "de": "asynchrone Coroutinen; ID-Erzeugung"}, "code": "    fun addDocument(uri: Uri) {\n        viewModelScope.launch {\n            val session = chatRepository.getCurrentSession() ?: chatRepository.createSession()\n            _statusText.value = l(\"reading_document\")\n            try {\n                val raw = kotlinx.coroutines.withContext(kotlinx.coroutines.Dispatchers.IO) {\n                    DocumentReader.read(getApplication<Application>(), uri)\n                }\n                val budget = DocumentReader.budgetTokens(llmEngine.effectiveContextLength)\n                val used = session.documents.sumOf { DocumentReader.estimateTokens(it.text) }\n                val remaining = budget - used\n                if (remaining <= 10) {\n                    _statusText.value = l(\"docs_budget_full\")\n                    return@launch\n                }\n                val (text, truncated) = DocumentReader.truncate(raw.text, remaining)\n                if (text.isBlank()) {\n                    _statusText.value = l(\"doc_read_error\")\n                    return@launch\n                }\n                val doc = SessionDocument(\n                    id = UUID.randomUUID().toString(),\n                    name = raw.name,\n                    ext = raw.ext,\n                    sizeBytes = raw.sizeBytes,\n                    text = text,\n                    truncated = truncated\n                )\n                chatRepository.addDocument(session.id, doc)\n                refreshDocuments()\n                _statusText.value = l(\"document_added\") +\n                    if (truncated) \" · ${l(\"doc_truncated\")}\" else \"\"\n                // Immediately offer suggestions based on the new document context.\n                if (llmEngine.settings.value.autoSuggest && llmEngine.isLoaded && !_isGenerating.value) {\n                    generateSuggestions()\n                }\n            } catch (e: DocumentException) {\n                _statusText.value = l(e.messageKey)\n            } catch (e: Exception) {\n                Log.e(TAG, \"Failed to read document\", e)\n                _statusText.value = l(\"doc_read_error\")\n            }\n        }\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/viewmodel/ChatViewModel.kt", "cat": "ViewModel", "order": 20, "start": 400, "end": 406, "kind": "fun", "name": "removeDocument", "owner": "ChatViewModel", "sig": "fun removeDocument(id: String) {", "tech": ["coroutines", "viewmodel"], "sum": {"ru": "асинхронные корутины", "en": "async coroutines", "de": "asynchrone Coroutinen"}, "code": "    fun removeDocument(id: String) {\n        val sessionId = chatRepository.getCurrentSession()?.id ?: return\n        viewModelScope.launch {\n            chatRepository.removeDocument(sessionId, id)\n            refreshDocuments()\n        }\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/viewmodel/ChatViewModel.kt", "cat": "ViewModel", "order": 20, "start": 408, "end": 409, "kind": "fun", "name": "documentBudgetTokens", "owner": "ChatViewModel", "sig": "fun documentBudgetTokens(): Int =", "tech": [], "sum": {"ru": "Функция documentBudgetTokens", "en": "Function documentBudgetTokens", "de": "Funktion documentBudgetTokens"}, "code": "    fun documentBudgetTokens(): Int =\n        DocumentReader.budgetTokens(llmEngine.effectiveContextLength)"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/viewmodel/ChatViewModel.kt", "cat": "ViewModel", "order": 20, "start": 411, "end": 428, "kind": "fun", "name": "buildDocsBlock", "owner": "ChatViewModel", "sig": "private fun buildDocsBlock(docs: List<SessionDocument>): String? {", "tech": [], "sum": {"ru": "Функция buildDocsBlock", "en": "Function buildDocsBlock", "de": "Funktion buildDocsBlock"}, "code": "    private fun buildDocsBlock(docs: List<SessionDocument>): String? {\n        if (docs.isEmpty()) return null\n        val sb = StringBuilder()\n        sb.append(\"You have access to the following document(s). Use their content as context \")\n        sb.append(\"to answer the user's questions. If the answer is not in the documents, say so.\\n\")\n        for (d in docs) {\n            sb.append(\"\\n[Document: \").append(d.name).append(\"]\\n\")\n            sb.append(d.text)\n            sb.append(\"\\n[/Document]\\n\")\n        }\n        return sb.toString()\n    }\n\n    /**\n     * Shorter document excerpt used only for the suggestion prompt, bounded by\n     * the \"suggestionDocTokens\" setting. Returns null when docs are disabled or\n     * empty (so suggestions fall back to the assistant response alone).\n     */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/viewmodel/ChatViewModel.kt", "cat": "ViewModel", "order": 20, "start": 429, "end": 441, "kind": "fun", "name": "buildSuggestionDocsBlock", "owner": "ChatViewModel", "sig": "private fun buildSuggestionDocsBlock(docs: List<SessionDocument>): String? {", "tech": [], "sum": {"ru": "Функция buildSuggestionDocsBlock", "en": "Function buildSuggestionDocsBlock", "de": "Funktion buildSuggestionDocsBlock"}, "code": "    private fun buildSuggestionDocsBlock(docs: List<SessionDocument>): String? {\n        if (docs.isEmpty()) return null\n        val budget = llmEngine.settings.value.suggestionDocTokens\n        if (budget <= 0) return null\n        val sb = StringBuilder()\n        for (d in docs) {\n            sb.append(\"\\n[Document: \").append(d.name).append(\"]\\n\")\n            sb.append(d.text)\n            sb.append(\"\\n[/Document]\\n\")\n        }\n        val (text, _) = DocumentReader.truncate(sb.toString(), budget)\n        return text.ifBlank { null }\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/viewmodel/ChatViewModel.kt", "cat": "ViewModel", "order": 20, "start": 443, "end": 443, "kind": "fun", "name": "getCurrentSession", "owner": "ChatViewModel", "sig": "fun getCurrentSession(): ChatSession? = chatRepository.getCurrentSession()", "tech": [], "sum": {"ru": "Функция getCurrentSession", "en": "Function getCurrentSession", "de": "Funktion getCurrentSession"}, "code": "    fun getCurrentSession(): ChatSession? = chatRepository.getCurrentSession()"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/viewmodel/ChatViewModel.kt", "cat": "ViewModel", "order": 20, "start": 445, "end": 570, "kind": "fun", "name": "sendMessage", "owner": "ChatViewModel", "sig": "fun sendMessage() {", "tech": ["coroutines", "viewmodel", "mtmd"], "sum": {"ru": "Главный поток: vision/текст, генерация, сохранение, TTS.", "en": "Main flow: vision/text, generation, saving, TTS.", "de": "Hauptablauf: Vision/Text, Generierung, Speichern, TTS."}, "code": "    fun sendMessage() {\n        val text = _inputText.value.trim()\n        if (text.isEmpty() || _isGenerating.value) return\n        if (!llmEngine.isLoaded) {\n            _statusText.value = l(\"please_load_model\")\n            return\n        }\n\n        val session = chatRepository.getCurrentSession() ?: chatRepository.createSession()\n        val sessionId = session.id\n        val imagePath = _pendingImage.value\n        val useVision = imagePath != null && llmEngine.hasVision\n        if (imagePath != null && !useVision) {\n            _statusText.value = l(\"vision_unavailable\")\n        }\n\n        // Add user message\n        val userMessage = ChatMessage(role = \"user\", content = text, imagePath = imagePath)\n        viewModelScope.launch {\n            chatRepository.addMessage(sessionId, userMessage)\n        }\n\n        _inputText.value = \"\"\n        _pendingImage.value = null\n        _isGenerating.value = true\n        _streamingText.value = \"\"\n        _suggestions.value = emptyList()\n        stopRequested = false\n\n        generationJob = viewModelScope.launch {\n            try {\n                val messages = session.messages + userMessage\n                val fullResponse = StringBuilder()\n                var firstToken = false\n                var streamedTokens = 0\n                val genStart = System.currentTimeMillis()\n                // Streaming TTS: speak each clause as soon as a punctuation mark arrives.\n                val ttsOn = llmEngine.settings.value.ttsEnabled\n                val ttsBuffer = StringBuilder()\n                var ttsStarted = false\n                val enqueueTts: (String, Boolean) -> Unit = { chunk, flush ->\n                    if (chunk.isNotBlank()) {\n                        viewModelScope.launch { ttsManager.speakChunk(chunk, flush) }\n                    }\n                }\n                val onTok: (String) -> Unit = { token ->\n                    if (!firstToken) {\n                        firstToken = true\n                        _isPreparingVision.value = false\n                    }\n                    fullResponse.append(token)\n                    streamedTokens++\n                    _streamingText.value = fullResponse.toString()\n                    if (ttsOn && !stopRequested) {\n                        ttsBuffer.append(token)\n                        val cut = lastTtsDelimiter(ttsBuffer)\n                        if (cut >= 0) {\n                            val chunk = ttsBuffer.substring(0, cut + 1)\n                            ttsBuffer.delete(0, cut + 1)\n                            if (chunk.isNotBlank()) {\n                                enqueueTts(chunk, !ttsStarted)\n                                ttsStarted = true\n                            }\n                        }\n                    }\n                }\n\n                val response = if (useVision) {\n                    _isPreparingVision.value = true\n                    llmEngine.generateVision(\n                        messages,\n                        imagePath!!,\n                        docsBlock = buildDocsBlock(session.documents),\n                        onToken = onTok\n                    )\n                } else {\n                    llmEngine.generate(\n                        messages,\n                        onToken = onTok,\n                        docsBlock = buildDocsBlock(session.documents)\n                    )\n                }\n\n                val stopped = stopRequested\n                stopRequested = false\n\n                // Save assistant message (also the partial one after Stop)\n                if (response.isNotEmpty()) {\n                    chatRepository.addMessage(\n                        sessionId,\n                        ChatMessage(\n                            role = \"assistant\",\n                            content = response,\n                            generationMs = (System.currentTimeMillis() - genStart).coerceAtLeast(0L),\n                            tokenCount = streamedTokens\n                        )\n                    )\n                }\n\n                _streamingText.value = \"\"\n                _isGenerating.value = false\n\n                if (!stopped) {\n                    // Auto-suggest\n                    if (llmEngine.settings.value.autoSuggest && response.isNotEmpty()) {\n                        generateSuggestions()\n                    }\n\n                    // TTS: speak whatever is left after the last delimiter.\n                    if (ttsOn && ttsBuffer.isNotBlank()) {\n                        enqueueTts(ttsBuffer.toString(), !ttsStarted)\n                        ttsStarted = true\n                    }\n                }\n            } catch (e: Exception) {\n                Log.e(TAG, \"Generation failed\", e)\n                _statusText.value = \"${l(\"error_msg\")}: ${e.message}\"\n                _isGenerating.value = false\n                _streamingText.value = \"\"\n            } finally {\n                _isPreparingVision.value = false\n            }\n        }\n    }\n\n    // ==================== Projector (mmproj) management ===================="}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/viewmodel/ChatViewModel.kt", "cat": "ViewModel", "order": 20, "start": 572, "end": 585, "kind": "fun", "name": "attachMmprojToModel", "owner": "ChatViewModel", "sig": "fun attachMmprojToModel(model: ModelInfo, uri: Uri) {", "tech": ["coroutines", "viewmodel"], "sum": {"ru": "асинхронные корутины", "en": "async coroutines", "de": "asynchrone Coroutinen"}, "code": "    fun attachMmprojToModel(model: ModelInfo, uri: Uri) {\n        viewModelScope.launch {\n            _statusText.value = l(\"projector_importing\")\n            llmEngine.importMmproj(uri)\n                .onSuccess { path ->\n                    llmEngine.setModelMmproj(model.path, path)\n                    if (llmEngine.isLoadedPath(model.path)) llmEngine.loadMmproj(path)\n                    _statusText.value = l(\"projector_attached\")\n                }\n                .onFailure { e ->\n                    _statusText.value = \"${l(\"error_msg\")}: ${e.message}\"\n                }\n        }\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/viewmodel/ChatViewModel.kt", "cat": "ViewModel", "order": 20, "start": 587, "end": 599, "kind": "fun", "name": "downloadMmprojForModel", "owner": "ChatViewModel", "sig": "fun downloadMmprojForModel(model: ModelInfo, url: String, name: String?) {", "tech": ["coroutines", "viewmodel"], "sum": {"ru": "асинхронные корутины", "en": "async coroutines", "de": "asynchrone Coroutinen"}, "code": "    fun downloadMmprojForModel(model: ModelInfo, url: String, name: String?) {\n        viewModelScope.launch {\n            llmEngine.downloadMmprojFromUrl(url, name)\n                .onSuccess { path ->\n                    llmEngine.setModelMmproj(model.path, path)\n                    if (llmEngine.isLoadedPath(model.path)) llmEngine.loadMmproj(path)\n                    _statusText.value = l(\"projector_attached\")\n                }\n                .onFailure { e ->\n                    _statusText.value = \"${l(\"error_msg\")}: ${e.message}\"\n                }\n        }\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/viewmodel/ChatViewModel.kt", "cat": "ViewModel", "order": 20, "start": 601, "end": 604, "kind": "fun", "name": "removeMmprojFromModel", "owner": "ChatViewModel", "sig": "fun removeMmprojFromModel(model: ModelInfo) {", "tech": [], "sum": {"ru": "Функция removeMmprojFromModel", "en": "Function removeMmprojFromModel", "de": "Funktion removeMmprojFromModel"}, "code": "    fun removeMmprojFromModel(model: ModelInfo) {\n        llmEngine.setModelMmproj(model.path, null)\n        _statusText.value = l(\"projector_removed\")\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/viewmodel/ChatViewModel.kt", "cat": "ViewModel", "order": 20, "start": 606, "end": 615, "kind": "fun", "name": "stopGeneration", "owner": "ChatViewModel", "sig": "fun stopGeneration() {", "tech": [], "sum": {"ru": "Останавливает текущую генерацию.", "en": "Stops the current generation.", "de": "Stoppt die aktuelle Generierung."}, "code": "    fun stopGeneration() {\n        stopRequested = true\n        // nativeCancel no longer blocks: generation does not hold the JNI mutex,\n        // so this returns immediately even when called from the UI thread.\n        llmEngine.cancelGeneration()\n        _isGenerating.value = false\n        _streamingText.value = \"\"\n    }\n\n    // ==================== Suggestions ===================="}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/viewmodel/ChatViewModel.kt", "cat": "ViewModel", "order": 20, "start": 617, "end": 652, "kind": "fun", "name": "generateSuggestions", "owner": "ChatViewModel", "sig": "fun generateSuggestions(onlyNew: Boolean = false) {", "tech": ["coroutines", "viewmodel"], "sum": {"ru": "JSON-подсказки с фильтром языка.", "en": "JSON suggestions with a language filter.", "de": "JSON-Vorschläge mit Sprachfilter."}, "code": "    fun generateSuggestions(onlyNew: Boolean = false) {\n        if (!llmEngine.isLoaded || _isGeneratingSuggestions.value || _isGenerating.value) return\n        val session = chatRepository.getCurrentSession() ?: return\n        val hasAssistant = session.messages.any { it.role == \"assistant\" }\n        val docsBlock = buildSuggestionDocsBlock(session.documents)\n        if (!hasAssistant && docsBlock.isNullOrBlank()) return\n\n        _isGeneratingSuggestions.value = true\n        _pendingSuggestion.value = null\n        viewModelScope.launch {\n            try {\n                val count = llmEngine.settings.value.suggestionCount\n                val newSuggestions = suggestionEngine.generate(\n                    messages = session.messages,\n                    count = count,\n                    onlyNew = onlyNew,\n                    docsBlock = docsBlock,\n                    onPartial = { partial, pending ->\n                        if (partial.isNotEmpty()) _suggestions.value = partial\n                        _pendingSuggestion.value = pending\n                    }\n                )\n                if (newSuggestions.isNotEmpty()) {\n                    suggestionEngine.markShown(newSuggestions)\n                    _suggestions.value = newSuggestions\n                } else if (!onlyNew) {\n                    _suggestions.value = emptyList()\n                }\n            } catch (e: Exception) {\n                Log.e(TAG, \"Failed to generate suggestions\", e)\n            } finally {\n                _pendingSuggestion.value = null\n                _isGeneratingSuggestions.value = false\n            }\n        }\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/viewmodel/ChatViewModel.kt", "cat": "ViewModel", "order": 20, "start": 654, "end": 659, "kind": "fun", "name": "onSuggestionClicked", "owner": "ChatViewModel", "sig": "fun onSuggestionClicked(suggestion: String) {", "tech": [], "sum": {"ru": "Функция onSuggestionClicked", "en": "Function onSuggestionClicked", "de": "Funktion onSuggestionClicked"}, "code": "    fun onSuggestionClicked(suggestion: String) {\n        _inputText.value = suggestion\n        _suggestions.value = emptyList()\n    }\n\n    // ==================== Voice ===================="}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/viewmodel/ChatViewModel.kt", "cat": "ViewModel", "order": 20, "start": 661, "end": 666, "kind": "fun", "name": "startVoiceInput", "owner": "ChatViewModel", "sig": "fun startVoiceInput() {", "tech": [], "sum": {"ru": "Функция startVoiceInput", "en": "Function startVoiceInput", "de": "Funktion startVoiceInput"}, "code": "    fun startVoiceInput() {\n        val lang = llmEngine.settings.value.sttLanguage\n        sttManager.startListening(lang) { result ->\n            _inputText.value = result\n        }\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/viewmodel/ChatViewModel.kt", "cat": "ViewModel", "order": 20, "start": 668, "end": 672, "kind": "fun", "name": "stopVoiceInput", "owner": "ChatViewModel", "sig": "fun stopVoiceInput() {", "tech": [], "sum": {"ru": "Функция stopVoiceInput", "en": "Function stopVoiceInput", "de": "Funktion stopVoiceInput"}, "code": "    fun stopVoiceInput() {\n        sttManager.stopListening()\n    }\n\n    // ==================== TTS ===================="}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/viewmodel/ChatViewModel.kt", "cat": "ViewModel", "order": 20, "start": 674, "end": 676, "kind": "fun", "name": "speakText", "owner": "ChatViewModel", "sig": "fun speakText(text: String) {", "tech": [], "sum": {"ru": "Функция speakText", "en": "Function speakText", "de": "Funktion speakText"}, "code": "    fun speakText(text: String) {\n        ttsManager.speak(text)\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/viewmodel/ChatViewModel.kt", "cat": "ViewModel", "order": 20, "start": 678, "end": 682, "kind": "fun", "name": "stopSpeaking", "owner": "ChatViewModel", "sig": "fun stopSpeaking() {", "tech": [], "sum": {"ru": "Функция stopSpeaking", "en": "Function stopSpeaking", "de": "Funktion stopSpeaking"}, "code": "    fun stopSpeaking() {\n        ttsManager.stop()\n    }\n\n    // ==================== Settings ===================="}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/viewmodel/ChatViewModel.kt", "cat": "ViewModel", "order": 20, "start": 684, "end": 690, "kind": "fun", "name": "updateSettings", "owner": "ChatViewModel", "sig": "fun updateSettings(newSettings: LlmSettings) {", "tech": [], "sum": {"ru": "локализация (en/ru/de)", "en": "localization (en/ru/de)", "de": "Lokalisierung (en/ru/de)"}, "code": "    fun updateSettings(newSettings: LlmSettings) {\n        llmEngine.saveSettings(newSettings)\n        _appLanguage.value = newSettings.appLanguage\n        _appTheme.value = newSettings.appTheme\n        ttsManager.setLanguage(newSettings.ttsLanguage)\n        ttsManager.setRate(newSettings.ttsRate)\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/viewmodel/ChatViewModel.kt", "cat": "ViewModel", "order": 20, "start": 692, "end": 697, "kind": "fun", "name": "setAppLanguage", "owner": "ChatViewModel", "sig": "fun setAppLanguage(lang: String) {", "tech": [], "sum": {"ru": "Функция setAppLanguage", "en": "Function setAppLanguage", "de": "Funktion setAppLanguage"}, "code": "    fun setAppLanguage(lang: String) {\n        val current = llmEngine.settings.value\n        updateSettings(current.copy(appLanguage = lang))\n    }\n\n    // ==================== Cleanup ===================="}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/viewmodel/ChatViewModel.kt", "cat": "ViewModel", "order": 20, "start": 699, "end": 705, "kind": "fun", "name": "onCleared", "owner": "ChatViewModel", "sig": "override fun onCleared() {", "tech": [], "sum": {"ru": "Функция onCleared", "en": "Function onCleared", "de": "Funktion onCleared"}, "code": "    override fun onCleared() {\n        super.onCleared()\n        sttManager.destroy()\n        ttsManager.shutdown()\n        llmEngine.unloadModel()\n    }\n}"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/screens/ChatScreen.kt", "cat": "UI · Chat", "order": 30, "start": 117, "end": 122, "kind": "fun", "name": "fmtRam", "owner": "", "sig": "private fun fmtRam(bytes: Long): String =", "tech": ["compose"], "sum": {"ru": "UI-компонент Compose", "en": "Compose UI component", "de": "Compose-UI-Komponente"}, "code": "private fun fmtRam(bytes: Long): String =\n    if (bytes >= 1_073_741_824L) \"%.1f GB\".format(bytes / 1_073_741_824.0)\n    else \"%.0f MB\".format(bytes / 1_048_576.0)\n\n@OptIn(ExperimentalMaterial3Api::class, ExperimentalLayoutApi::class)\n@Composable"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/screens/ChatScreen.kt", "cat": "UI · Chat", "order": 30, "start": 123, "end": 839, "kind": "fun", "name": "ChatScreen", "owner": "", "sig": "fun ChatScreen(", "tech": ["compose", "flow", "mtmd", "saf", "bitmap", "fileio"], "sum": {"ru": "Экран чата: RAM-заголовок, список сообщений, ввод, чипы-подсказки.", "en": "Chat screen: RAM header, message list, input, suggestion chips.", "de": "Chat-Bildschirm: RAM-Kopfzeile, Nachrichtenliste, Eingabe, Vorschlags-Chips."}, "code": "fun ChatScreen(\n    viewModel: ChatViewModel,\n    onOpenDrawer: () -> Unit,\n    onOpenSettings: () -> Unit\n) {\n    val lang by viewModel.appLanguage.collectAsState()\n    val l = { key: String -> Localization.getString(key, lang) }\n\n    val modelState by viewModel.llmEngine.state.collectAsState()\n    val mmprojReady by viewModel.llmEngine.mmprojLoaded.collectAsState()\n    val mmprojName by viewModel.llmEngine.mmprojName.collectAsState()\n    val ctxSize by viewModel.llmEngine.contextSize.collectAsState()\n    val isPreparingVision by viewModel.isPreparingVision.collectAsState()\n    val modelName by viewModel.llmEngine.modelName.collectAsState()\n    val progress by viewModel.llmEngine.progress.collectAsState()\n    val progressMessage by viewModel.llmEngine.progressMessage.collectAsState()\n    val ramTotal by viewModel.ramTotal.collectAsState()\n    val ramUsed by viewModel.ramUsed.collectAsState()\n    val ramFree by viewModel.ramFree.collectAsState()\n\n    val inputText by viewModel.inputText.collectAsState()\n    val isGenerating by viewModel.isGenerating.collectAsState()\n    val streamingText by viewModel.streamingText.collectAsState()\n    val suggestions by viewModel.suggestions.collectAsState()\n    val pendingSuggestion by viewModel.pendingSuggestion.collectAsState()\n    val isGeneratingSuggestions by viewModel.isGeneratingSuggestions.collectAsState()\n    val statusText by viewModel.statusText.collectAsState()\n    val snackbarHostState = remember { SnackbarHostState() }\n    LaunchedEffect(statusText) {\n        if (statusText.isNotBlank()) snackbarHostState.showSnackbar(statusText)\n    }\n    val settings by viewModel.llmEngine.settings.collectAsState()\n    val inputAtTop = settings.inputPosition == \"top\"\n    val suggestionsWrap = settings.suggestionsLayout != \"single_row\"\n\n    val isListening by viewModel.sttManager.isListening.collectAsState()\n    val partialResult by viewModel.sttManager.partialResult.collectAsState()\n\n    val documents by viewModel.documents.collectAsState()\n    var showDocsSheet by remember { mutableStateOf(false) }\n    var showAttachMenu by remember { mutableStateOf(false) }\n    val docPicker = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->\n        if (uri != null) viewModel.addDocument(uri)\n    }\n\n    // ---- Image input (gallery + camera) ----\n    val pendingImage by viewModel.pendingImage.collectAsState()\n    val appContext = LocalContext.current\n    val imagePicker = rememberLauncherForActivityResult(ActivityResultContracts.GetContent()) { uri ->\n        if (uri != null) viewModel.attachImage(uri)\n    }\n    var cameraUri by remember { mutableStateOf<android.net.Uri?>(null) }\n    val cameraLauncher = rememberLauncherForActivityResult(ActivityResultContracts.TakePicture()) { success ->\n        val uri = cameraUri\n        if (success && uri != null) viewModel.attachImage(uri)\n    }\n    fun takePhoto() {\n        try {\n            val dir = File(appContext.cacheDir, \"images\").apply { mkdirs() }\n            val file = File(dir, \"cam_${System.currentTimeMillis()}.jpg\")\n            val uri = FileProvider.getUriForFile(appContext, \"${appContext.packageName}.fileprovider\", file)\n            cameraUri = uri\n            cameraLauncher.launch(uri)\n        } catch (e: Exception) {\n            Log.e(\"ChatScreen\", \"takePhoto failed\", e)\n        }\n    }\n\n    val keyboardController = LocalSoftwareKeyboardController.current\n    val focusManager = LocalFocusManager.current\n    // Send and dismiss the keyboard so the reply is not hidden behind it.\n    fun sendCurrent() {\n        viewModel.sendMessage()\n        keyboardController?.hide()\n        focusManager.clearFocus()\n    }\n\n    // Reactive session source: selecting/creating a chat must rebuild the list.\n    val sessions by viewModel.chatRepository.sessions.collectAsState()\n    val currentSessionId by viewModel.chatRepository.currentSessionId.collectAsState()\n    val session = sessions.find { it.id == currentSessionId }\n    val messages = session?.messages ?: emptyList()\n\n    val listState = rememberLazyListState()\n\n    // Auto-scroll rules:\n    //  * while the answer is streaming        -> keep the END of the growing bubble in view;\n    //  * after the suggestion chips are ready -> jump to the START of that answer;\n    //  * afterwards the user scrolls freely   (no further auto-scroll).\n    var wasStreaming by remember { mutableStateOf(false) }\n    var awaitSuggestions by remember { mutableStateOf(false) }\n    LaunchedEffect(streamingText, messages.size) {\n        val streaming = streamingText.isNotEmpty()\n        when {\n            streaming -> {\n                // The streaming bubble is the last item (index == messages.size). Snap it\n                // into view, then align its bottom with the viewport bottom so the newest\n                // tokens stay visible even when the answer is taller than the screen.\n                val index = messages.size\n                listState.scrollToItem(index)\n                val info = listState.layoutInfo.visibleItemsInfo.firstOrNull { it.index == index }\n                if (info != null) {\n                    val overflow = (info.offset + info.size) - listState.layoutInfo.viewportEndOffset\n                    if (overflow > 0) listState.scrollToItem(index, overflow)\n                }\n            }\n            wasStreaming && messages.isNotEmpty() -> {\n                // The answer finished. Do NOT jump to its start yet: wait until the\n                // suggestion chips are generated so the layout is stable first.\n                awaitSuggestions = true\n            }\n            messages.isNotEmpty() -> {\n                // A new message (e.g. the user's) was appended while idle.\n                listState.scrollToItem(messages.size - 1)\n            }\n        }\n        wasStreaming = streaming\n    }\n\n    // Once the suggestions are generated (or generation is skipped), show the\n    // answer from its beginning; after that the user scrolls freely.\n    LaunchedEffect(isGeneratingSuggestions, awaitSuggestions) {\n        if (awaitSuggestions && !isGeneratingSuggestions) {\n            if (messages.isNotEmpty()) listState.animateScrollToItem(messages.size - 1)\n            awaitSuggestions = false\n        }\n    }\n\n    // Opening a session: start at the latest message.\n    LaunchedEffect(currentSessionId) {\n        if (messages.isNotEmpty()) listState.scrollToItem(messages.size - 1)\n    }\n\n    // Suggestion chips — shared by both layouts\n    val chipContent: @Composable () -> Unit = {\n        // Refresh with dedup: asks the model for suggestions not shown yet\n        AssistChip(\n            onClick = { viewModel.generateSuggestions(onlyNew = true) },\n            label = { Text(l(\"new_suggestions\"), maxLines = 1) },\n            leadingIcon = {\n                Icon(\n                    Icons.Default.Refresh,\n                    contentDescription = l(\"refresh\"),\n                    modifier = Modifier.size(16.dp)\n                )\n            }\n        )\n        suggestions.forEach { suggestion ->\n            AssistChip(\n                onClick = { viewModel.onSuggestionClicked(suggestion) },\n                modifier = Modifier.widthIn(max = 320.dp),\n                label = {\n                    Text(\n                        suggestion,\n                        maxLines = 2,\n                        overflow = androidx.compose.ui.text.style.TextOverflow.Ellipsis\n                    )\n                }\n            )\n        }\n        // Live \"being typed\" suggestion, so generation streams like a reply\n        pendingSuggestion?.takeIf { it.isNotBlank() }?.let { pending ->\n            AssistChip(\n                onClick = {},\n                enabled = false,\n                modifier = Modifier.widthIn(max = 320.dp),\n                label = {\n                    Text(\n                        \"$pending…\",\n                        maxLines = 2,\n                        overflow = androidx.compose.ui.text.style.TextOverflow.Ellipsis,\n                        color = MaterialTheme.colorScheme.onSurfaceVariant\n                    )\n                }\n            )\n        }\n        if (isGeneratingSuggestions) {\n            CircularProgressIndicator(\n                modifier = Modifier.size(16.dp),\n                strokeWidth = 2.dp\n            )\n        }\n    }\n\n    // Suggestions block; \"wrap\" flows to new lines, \"single_row\" scrolls.\n    // Chips appear as they stream in; a spinner is shown only before the first one.\n    val hasSuggestionContent = suggestions.isNotEmpty() || !pendingSuggestion.isNullOrBlank()\n    val suggestionsArea: @Composable () -> Unit = {\n        AnimatedVisibility(\n            visible = hasSuggestionContent || isGeneratingSuggestions,\n            enter = fadeIn(),\n            exit = fadeOut()\n        ) {\n            Column(\n                modifier = Modifier\n                    .fillMaxWidth()\n                    .padding(horizontal = 12.dp, vertical = 4.dp)\n            ) {\n                if (!hasSuggestionContent && isGeneratingSuggestions) {\n                    Row(verticalAlignment = Alignment.CenterVertically) {\n                        CircularProgressIndicator(modifier = Modifier.size(16.dp), strokeWidth = 2.dp)\n                        Spacer(modifier = Modifier.width(8.dp))\n                        Text(\n                            text = l(\"generating_suggestions\"),\n                            style = MaterialTheme.typography.bodySmall,\n                            color = MaterialTheme.colorScheme.onSurfaceVariant\n                        )\n                    }\n                } else if (suggestionsWrap) {\n                    FlowRow(\n                        modifier = Modifier.fillMaxWidth(),\n                        horizontalArrangement = Arrangement.spacedBy(8.dp),\n                        verticalArrangement = Arrangement.spacedBy(4.dp)\n                    ) {\n                        chipContent()\n                    }\n                } else {\n                    Row(\n                        modifier = Modifier\n                            .fillMaxWidth()\n                            .horizontalScroll(rememberScrollState()),\n                        horizontalArrangement = Arrangement.spacedBy(8.dp),\n                        verticalAlignment = Alignment.CenterVertically\n                    ) {\n                        chipContent()\n                    }\n                }\n            }\n        }\n    }\n\n    // Input row (text field, voice, send/stop)\n    val inputArea: @Composable () -> Unit = {\n        Surface(\n            tonalElevation = 3.dp,\n            modifier = Modifier.fillMaxWidth()\n        ) {\n            Column(modifier = Modifier.padding(8.dp)) {\n                // Pending image preview\n                if (!pendingImage.isNullOrBlank()) {\n                    Box(\n                        modifier = Modifier\n                            .padding(horizontal = 4.dp, vertical = 4.dp)\n                    ) {\n                        val bmp = remember(pendingImage) { BitmapFactory.decodeFile(pendingImage) }\n                        if (bmp != null) {\n                            Image(\n                                bitmap = bmp.asImageBitmap(),\n                                contentDescription = l(\"attach_image\"),\n                                contentScale = ContentScale.Crop,\n                                modifier = Modifier\n                                    .size(72.dp)\n                                    .clip(RoundedCornerShape(8.dp))\n                            )\n                        }\n                        IconButton(\n                            onClick = { viewModel.clearPendingImage() },\n                            modifier = Modifier\n                                .align(Alignment.TopEnd)\n                                .size(24.dp)\n                                .clip(CircleShape)\n                                .background(MaterialTheme.colorScheme.error)\n                        ) {\n                            Icon(\n                                Icons.Default.Close,\n                                contentDescription = l(\"remove_image\"),\n                                tint = Color.White,\n                                modifier = Modifier.size(14.dp)\n                            )\n                        }\n                    }\n                }\n\n                // Attached documents (tap a chip to open the documents panel)\n                if (documents.isNotEmpty()) {\n                    Row(\n                        modifier = Modifier\n                            .fillMaxWidth()\n                            .horizontalScroll(rememberScrollState())\n                            .padding(horizontal = 4.dp, vertical = 2.dp),\n                        horizontalArrangement = Arrangement.spacedBy(6.dp),\n                        verticalAlignment = Alignment.CenterVertically\n                    ) {\n                        documents.forEach { doc ->\n                            AssistChip(\n                                onClick = { showDocsSheet = true },\n                                label = {\n                                    Text(\n                                        \"📄 ${doc.name}\",\n                                        maxLines = 1,\n                                        overflow = TextOverflow.Ellipsis\n                                    )\n                                }\n                            )\n                        }\n                    }\n                }\n\n                if (isListening && partialResult.isNotEmpty()) {\n                    Text(\n                        text = partialResult,\n                        style = MaterialTheme.typography.bodyMedium,\n                        color = MaterialTheme.colorScheme.primary,\n                        modifier = Modifier.padding(horizontal = 8.dp, vertical = 4.dp)\n                    )\n                }\n\n                Row(\n                    modifier = Modifier.fillMaxWidth(),\n                    verticalAlignment = Alignment.CenterVertically\n                ) {\n                    Box {\n                        IconButton(\n                            onClick = { showAttachMenu = true },\n                            modifier = Modifier.size(48.dp)\n                        ) {\n                            Icon(\n                                Icons.Default.Add,\n                                contentDescription = l(\"attach\"),\n                                tint = MaterialTheme.colorScheme.onSurfaceVariant\n                            )\n                        }\n                        DropdownMenu(\n                            expanded = showAttachMenu,\n                            onDismissRequest = { showAttachMenu = false }\n                        ) {\n                            DropdownMenuItem(\n                                text = { Text(l(\"documents\")) },\n                                leadingIcon = {\n                                    Icon(Icons.Default.AttachFile, contentDescription = null)\n                                },\n                                onClick = {\n                                    showAttachMenu = false\n                                    showDocsSheet = true\n                                }\n                            )\n                            DropdownMenuItem(\n      else viewModel.startVoiceInput()\n                        },\n                        modifier = Modifier\n                            .size(48.dp)\n                            .clip(CircleShape)\n                            .background(\n                                if (isListening) MaterialTheme.colorScheme.error\n                                else MaterialTheme.colorScheme.surfaceVariant\n                            )\n                    ) {\n                        Icon(\n                            Icons.Default.Mic,\n                            contentDescription = l(\"voice_input\"),\n                            tint = if (isListening) Color.White\n                            else MaterialTheme.colorScheme.onSurfaceVariant\n                        )\n                    }\n\n                    Spacer(modifier = Modifier.width(4.dp))\n\n                    if (isGenerating) {\n                        IconButton(\n                            onClick = { viewModel.stopGeneration() },\n                            modifier = Modifier\n                                .size(48.dp)\n                                .clip(CircleShape)\n                                .background(MaterialTheme.colorScheme.error)\n                        ) {\n                            Icon(\n                                Icons.Default.Stop,\n                                contentDescription = l(\"stop\"),\n                                tint = Color.White\n                            )\n                        }\n                    } else {\n                        IconButton(\n                            onClick = { sendCurrent() },\n                            enabled = inputText.isNotBlank() && modelState == ModelState.LOADED,\n                            modifier = Modifier\n                                .size(48.dp)\n                                .clip(CircleShape)\n                                .background(\n                                    if (inputText.isNotBlank() && modelState == ModelState.LOADED)\n                                        MaterialTheme.colorScheme.primary\n                                    else MaterialTheme.colorScheme.surfaceVariant\n                                )\n                        ) {\n                            Icon(\n                                Icons.Default.Send,\n                                contentDescription = l(\"send\"),\n                                tint = if (inputText.isNotBlank() && modelState == ModelState.LOADED)\n                                    MaterialTheme.colorScheme.onPrimary\n                                else MaterialTheme.colorScheme.onSurfaceVariant\n                            )\n                        }\n                    }\n                }\n            }\n        }\n    }\n\n    Scaffold(\n        snackbarHost = { SnackbarHost(snackbarHostState) },\n        topBar = {\n            Column(modifier = Modifier.statusBarsPadding()) {\n                // RAM monitor + \"free everything\" action, above the model name.\n                Surface(color = MaterialTheme.colorScheme.surfaceVariant) {\n                    Row(\n                        modifier = Modifier\n                            .fillMaxWidth()\n                            .padding(start = 12.dp, end = 4.dp, top = 2.dp, bottom = 2.dp),\n                        verticalAlignment = Alignment.CenterVertically\n                    ) {\n                        Icon(\n                            Icons.Default.Memory,\n                            contentDescription = null,\n                            modifier = Modifier.size(16.dp),\n                            tint = MaterialTheme.colorScheme.onSurfaceVariant\n                        )\n                        Spacer(modifier = Modifier.width(6.dp))\n                        Text(\n                            text = \"${l(\"ram\")} ${fmtRam(ramUsed)} / ${fmtRam(ramTotal)} · \" +\n                                \"${l(\"ram_free\")}
