 0\n        for (c in text) if (c in '\\u0400'..'\\u04FF') cyrillic++\n        return if (cyrillic.toDouble() / text.length > 0.2) 1.8 else 3.5\n    }\n\n    /**\n     * Truncates [text] so it fits [remainingTokens]. Returns the (possibly\n     * shortened) text plus whether truncation happened.\n     */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/chat/DocumentReader.kt", "cat": "Data · Chat", "order": 51, "start": 56, "end": 61, "kind": "fun", "name": "truncate", "owner": "DocumentReader", "sig": "fun truncate(text: String, remainingTokens: Int): Pair<String, Boolean> {", "tech": [], "sum": {"ru": "Обрезает текст до бюджета токенов.", "en": "Trims text to a token budget.", "de": "Kürzt Text auf ein Token-Budget."}, "code": "    fun truncate(text: String, remainingTokens: Int): Pair<String, Boolean> {\n        if (remainingTokens <= 0) return \"\" to true\n        val maxChars = (remainingTokens * charsPerToken(text)).toInt()\n        if (text.length <= maxChars) return text to false\n        return text.substring(0, maxChars.coerceAtLeast(0)) + \"\\n…\" to true\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/chat/DocumentReader.kt", "cat": "Data · Chat", "order": 51, "start": 63, "end": 96, "kind": "fun", "name": "read", "owner": "DocumentReader", "sig": "fun read(context: Context, uri: Uri, displayName: String? = null): RawDocument {", "tech": ["saf"], "sum": {"ru": "Читает документ по Uri с проверкой размера и типа.", "en": "Reads a document by Uri with size/type checks.", "de": "Liest ein Dokument per Uri mit Größen-/Typ-Prüfung."}, "code": "    fun read(context: Context, uri: Uri, displayName: String? = null): RawDocument {\n        val name = displayName\n            ?: queryName(context, uri)\n            ?: uri.lastPathSegment?.substringAfterLast('/')?.takeIf { it.isNotBlank() }\n            ?: \"document\"\n        val ext = name.substringAfterLast('.', \"\").lowercase()\n        if (ext !in ALLOWED_EXTENSIONS) throw DocumentException(\"doc_unsupported\")\n\n        val bytes = try {\n            context.contentResolver.openInputStream(uri)?.use { input ->\n                val out = ByteArrayOutputStream()\n                val buf = ByteArray(16 * 1024)\n                var total = 0\n                while (total < MAX_READ_BYTES) {\n                    val n = input.read(buf)\n                    if (n < 0) break\n                    val take = minOf(n, MAX_READ_BYTES - total)\n                    if (take > 0) out.write(buf, 0, take)\n                    total += n\n                }\n                out.toByteArray()\n            } ?: throw DocumentException(\"doc_read_error\")\n        } catch (e: DocumentException) {\n            throw e\n        } catch (e: Exception) {\n            throw DocumentException(\"doc_read_error\")\n        }\n\n        val size = querySize(context, uri) ?: bytes.size.toLong()\n        var text = String(bytes, Charsets.UTF_8)\n        if (ext == \"htm\" || ext == \"html\") text = stripHtml(text)\n        text = cleanup(text)\n        return RawDocument(name = name, ext = ext, sizeBytes = size, text = text)\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/chat/DocumentReader.kt", "cat": "Data · Chat", "order": 51, "start": 98, "end": 105, "kind": "fun", "name": "querySize", "owner": "DocumentReader", "sig": "private fun querySize(context: Context, uri: Uri): Long? = try {", "tech": ["saf"], "sum": {"ru": "доступ к файлам (ContentResolver/SAF)", "en": "file access (ContentResolver/SAF)", "de": "Dateizugriff (ContentResolver/SAF)"}, "code": "    private fun querySize(context: Context, uri: Uri): Long? = try {\n        context.contentResolver.query(uri, null, null, null, null)?.use { c ->\n            val idx = c.getColumnIndex(OpenableColumns.SIZE)\n            if (idx >= 0 && c.moveToFirst() && !c.isNull(idx)) c.getLong(idx) else null\n        }\n    } catch (e: Exception) {\n        null\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/chat/DocumentReader.kt", "cat": "Data · Chat", "order": 51, "start": 107, "end": 114, "kind": "fun", "name": "queryName", "owner": "DocumentReader", "sig": "private fun queryName(context: Context, uri: Uri): String? = try {", "tech": ["saf"], "sum": {"ru": "доступ к файлам (ContentResolver/SAF)", "en": "file access (ContentResolver/SAF)", "de": "Dateizugriff (ContentResolver/SAF)"}, "code": "    private fun queryName(context: Context, uri: Uri): String? = try {\n        context.contentResolver.query(uri, null, null, null, null)?.use { c ->\n            val idx = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)\n            if (idx >= 0 && c.moveToFirst() && !c.isNull(idx)) c.getString(idx) else null\n        }\n    } catch (e: Exception) {\n        null\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/chat/DocumentReader.kt", "cat": "Data · Chat", "order": 51, "start": 116, "end": 120, "kind": "fun", "name": "cleanup", "owner": "DocumentReader", "sig": "private fun cleanup(text: String): String =", "tech": ["regex"], "sum": {"ru": "обработка текста", "en": "text processing", "de": "Textverarbeitung"}, "code": "    private fun cleanup(text: String): String =\n        text.replace(\"\\r\\n\", \"\\n\")\n            .replace(\"\\r\", \"\\n\")\n            .replace(Regex(\"\\n{3,}\"), \"\\n\\n\")\n            .trim()"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/chat/DocumentReader.kt", "cat": "Data · Chat", "order": 51, "start": 122, "end": 141, "kind": "fun", "name": "stripHtml", "owner": "DocumentReader", "sig": "private fun stripHtml(html: String): String {", "tech": ["regex"], "sum": {"ru": "Убирает HTML-теги из текста.", "en": "Strips HTML tags from text.", "de": "Entfernt HTML-Tags aus dem Text."}, "code": "    private fun stripHtml(html: String): String {\n        var s = html\n        s = s.replace(Regex(\"(?is)<script[^>]*>.*?<\/script>\"), \" \")\n        s = s.replace(Regex(\"(?is)<style[^>]*>.*?<\/style>\"), \" \")\n        s = s.replace(Regex(\"(?is)<br\\\\s*/?>\"), \"\\n\")\n        s = s.replace(Regex(\"(?is)<\/(p|div|li|tr|h[1-6]|section|article)>\"), \"\\n\")\n        s = s.replace(Regex(\"(?s)<[^>]+>\"), \" \")\n        s = s.replace(\"&nbsp;\", \" \")\n            .replace(\"&amp;\", \"&\")\n            .replace(\"&lt;\", \"<\")\n            .replace(\"&gt;\", \">\")\n            .replace(\"&quot;\", \"\\\"\")\n            .replace(\"&#39;\", \"'\")\n            .replace(\"&mdash;\", \"—\")\n            .replace(\"&ndash;\", \"–\")\n        s = s.replace(Regex(\"[ \\\\t]{2,}\"), \" \")\n        s = s.replace(Regex(\" *\\n *\"), \"\\n\")\n        return s.trim()\n    }\n}"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/chat/SuggestionEngine.kt", "cat": "Data · Chat", "order": 52, "start": 14, "end": 18, "kind": "class", "name": "SuggestionEngine", "owner": "", "sig": "class SuggestionEngine(private val llmEngine: LlmEngine) {", "tech": [], "sum": {"ru": "Чипы-подсказки: дедуп и повтор с разной температурой.", "en": "Suggestion chips: dedup and retries at varying temperature.", "de": "Vorschlags-Chips: Dedup und Retries mit variabler Temperatur."}, "code": "class SuggestionEngine(private val llmEngine: LlmEngine) {\n    private val TAG = \"SuggestionEngine\"\n\n    // All suggestions shown in this session (normalized for dedup)\n    private val shownSuggestions = mutableSetOf<String>()"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/chat/SuggestionEngine.kt", "cat": "Data · Chat", "order": 52, "start": 20, "end": 26, "kind": "fun", "name": "normalize", "owner": "SuggestionEngine", "sig": "fun normalize(text: String): String {", "tech": ["regex"], "sum": {"ru": "Нормализует текст подсказки для дедупа.", "en": "Normalizes suggestion text for dedup.", "de": "Normalisiert Vorschlagstext für Dedup."}, "code": "    fun normalize(text: String): String {\n        return text\n            .lowercase()\n            .replace(Regex(\"[^\\\\p{L}\\\\p{N}\\\\s]\"), \"\") // strip emoji/punctuation\n            .replace(Regex(\"\\\\s+\"), \" \")\n            .trim()\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/chat/SuggestionEngine.kt", "cat": "Data · Chat", "order": 52, "start": 28, "end": 30, "kind": "fun", "name": "markShown", "owner": "SuggestionEngine", "sig": "fun markShown(suggestions: List<String>) {", "tech": [], "sum": {"ru": "Функция markShown", "en": "Function markShown", "de": "Funktion markShown"}, "code": "    fun markShown(suggestions: List<String>) {\n        suggestions.forEach { shownSuggestions.add(normalize(it)) }\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/chat/SuggestionEngine.kt", "cat": "Data · Chat", "order": 52, "start": 32, "end": 34, "kind": "fun", "name": "clearHistory", "owner": "SuggestionEngine", "sig": "fun clearHistory() {", "tech": [], "sum": {"ru": "Функция clearHistory", "en": "Function clearHistory", "de": "Funktion clearHistory"}, "code": "    fun clearHistory() {\n        shownSuggestions.clear()\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/chat/SuggestionEngine.kt", "cat": "Data · Chat", "order": 52, "start": 36, "end": 88, "kind": "fun", "name": "generate", "owner": "SuggestionEngine", "sig": "suspend fun generate(", "tech": ["coroutines"], "sum": {"ru": "Генерирует уникальные подсказки-чипы.", "en": "Generates unique suggestion chips.", "de": "Erzeugt eindeutige Vorschlags-Chips."}, "code": "    suspend fun generate(\n        messages: List<ChatMessage>,\n        count: Int,\n        onlyNew: Boolean = false,\n        docsBlock: String? = null,\n        onPartial: ((List<String>, String?) -> Unit)? = null\n    ): List<String> = withContext(Dispatchers.IO) {\n        if (!llmEngine.isLoaded) return@withContext emptyList()\n\n        val exclude = if (onlyNew) shownSuggestions else emptySet()\n        val excludeList = exclude.toList()\n\n        // Try with increasing temperature until enough suggestions are found.\n        // Base/small models often return fewer than requested in a single pass.\n        val temperatures = listOf(0.7f, 0.85f, 1.0f)\n        var allSuggestions = mutableListOf<String>()\n        Log.d(TAG, \"generate: count=$count onlyNew=$onlyNew temps=$temperatures shown=${shownSuggestions.size}\")\n\n        for (temp in temperatures) {\n            val suggestions = llmEngine.generateSuggestions(\n                messages = messages,\n                count = count,\n                excludeSuggestions = excludeList.toSet(),\n                temperature = temp,\n                docsBlock = docsBlock,\n                onPartial = if (onPartial == null) null else { complete, pending ->\n                    // Merge the already-collected suggestions with the ones that\n                    // just finished streaming, keeping the dedup rules.\n                    val merged = LinkedHashSet<String>()\n                    merged.addAll(allSuggestions)\n                    for (s in complete) {\n                        val norm = normalize(s)\n                        if (norm.isNotEmpty() && !shownSuggestions.contains(norm)) merged.add(s)\n                    }\n                    onPartial.invoke(merged.toList(), pending)\n                }\n            )\n            Log.d(TAG, \"round temp=$temp -> ${suggestions.size} suggestions: $suggestions\")\n\n            for (s in suggestions) {\n                val norm = normalize(s)\n                if (norm.isNotEmpty() && !shownSuggestions.contains(norm) && !allSuggestions.contains(s)) {\n                    allSuggestions.add(s)\n                }\n            }\n\n            if (allSuggestions.size >= count) break\n        }\n        Log.d(TAG, \"generate -> ${allSuggestions.size} / $count\")\n\n        allSuggestions.take(count)\n    }\n}"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 24, "end": 25, "kind": "class", "name": "LlmEngine", "owner": "", "sig": "class LlmEngine(private val context: Context) {", "tech": [], "sum": {"ru": "Движок инференса: модели, mmproj, генерация, настройки.", "en": "Inference engine: models, mmproj, generation, settings.", "de": "Inferenz-Engine: Modelle, mmproj, Generierung, Einstellungen."}, "code": "class LlmEngine(private val context: Context) {\n    private val TAG = \"LlmEngine\""}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 26, "end": 26, "kind": "val", "name": "PREFS_NAME", "owner": "LlmEngine", "sig": "private val PREFS_NAME = \"gguf_chat_prefs\"", "tech": [], "sum": {"ru": "Константа PREFS_NAME", "en": "Constant PREFS_NAME", "de": "Konstante PREFS_NAME"}, "code": "    private val PREFS_NAME = \"gguf_chat_prefs\""}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 27, "end": 27, "kind": "val", "name": "KEY_MODELS", "owner": "LlmEngine", "sig": "private val KEY_MODELS = \"models_json\"", "tech": [], "sum": {"ru": "Константа KEY_MODELS", "en": "Constant KEY_MODELS", "de": "Konstante KEY_MODELS"}, "code": "    private val KEY_MODELS = \"models_json\""}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 28, "end": 28, "kind": "val", "name": "KEY_SETTINGS", "owner": "LlmEngine", "sig": "private val KEY_SETTINGS = \"settings_json\"", "tech": [], "sum": {"ru": "Константа KEY_SETTINGS", "en": "Constant KEY_SETTINGS", "de": "Konstante KEY_SETTINGS"}, "code": "    private val KEY_SETTINGS = \"settings_json\""}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 29, "end": 54, "kind": "val", "name": "MIN_STORAGE_MB", "owner": "LlmEngine", "sig": "private val MIN_STORAGE_MB = 500", "tech": ["flow", "mtmd"], "sum": {"ru": "реактивное состояние (StateFlow)", "en": "reactive state (StateFlow)", "de": "reaktiver Zustand (StateFlow)"}, "code": "    private val MIN_STORAGE_MB = 500\n\n    private val mutex = Mutex()\n    private var handle: Long = -1L\n    private var loadedModelPath: String = \"\"\n    private var loadedArchitecture: String = \"Unknown\"\n    private val _contextSize = MutableStateFlow(0)\n    val contextSize: StateFlow<Int> = _contextSize.asStateFlow()\n\n    private val _state = MutableStateFlow(ModelState.UNLOADED)\n    val state: StateFlow<ModelState> = _state.asStateFlow()\n\n    // True when an mmproj is attached -> image input is available\n    private val _mmprojLoaded = MutableStateFlow(false)\n    val mmprojLoaded: StateFlow<Boolean> = _mmprojLoaded.asStateFlow()\n    val hasVision: Boolean get() = handle > 0 && _mmprojLoaded.value\n\n    /** Context length actually used by the loaded model (falls back to the setting). */\n    val effectiveContextLength: Int\n        get() = if (_contextSize.value > 0) _contextSize.value else _settings.value.contextLength\n\n    // Name of the currently loaded projector (for status display)\n    private val _mmprojName = MutableStateFlow(\"\")\n    val mmprojName: StateFlow<String> = _mmprojName.asStateFlow()\n\n    /** True when [path] is the currently loaded model file. */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 55, "end": 85, "kind": "fun", "name": "isLoadedPath", "owner": "LlmEngine", "sig": "fun isLoadedPath(path: String): Boolean = handle > 0 && loadedModelPath == path", "tech": ["flow", "jni"], "sum": {"ru": "вызов нативной библиотеки (JNI); реактивное состояние (StateFlow)", "en": "native library call (JNI); reactive state (StateFlow)", "de": "Aufruf der nativen Bibliothek (JNI); reaktiver Zustand (StateFlow)"}, "code": "    fun isLoadedPath(path: String): Boolean = handle > 0 && loadedModelPath == path\n\n    private val _modelName = MutableStateFlow(\"\")\n    val modelName: StateFlow<String> = _modelName.asStateFlow()\n\n    private val _progress = MutableStateFlow(0f)\n    val progress: StateFlow<Float> = _progress.asStateFlow()\n\n    private val _progressMessage = MutableStateFlow(\"\")\n    val progressMessage: StateFlow<String> = _progressMessage.asStateFlow()\n\n    private val _isDownloading = MutableStateFlow(false)\n    val isDownloading: StateFlow<Boolean> = _isDownloading.asStateFlow()\n\n    private val _downloadProgress = MutableStateFlow(0f)\n    val downloadProgress: StateFlow<Float> = _downloadProgress.asStateFlow()\n\n    private val _downloadMessage = MutableStateFlow(\"\")\n    val downloadMessage: StateFlow<String> = _downloadMessage.asStateFlow()\n\n    @Volatile\n    private var cancelDownloadFlag = false\n\n    private val _models = MutableStateFlow<List<ModelInfo>>(emptyList())\n    val models: StateFlow<List<ModelInfo>> = _models.asStateFlow()\n\n    private val _settings = MutableStateFlow(LlmSettings())\n    val settings: StateFlow<LlmSettings> = _settings.asStateFlow()\n\n    val isLoaded: Boolean get() = handle > 0 && _state.value == ModelState.LOADED\n    val isAvailable: Boolean get() = try { LocalLlmNative; true } catch (_: Throwable) { false }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 87, "end": 95, "kind": "fun", "name": "l", "owner": "LlmEngine", "sig": "private fun l(key: String): String =", "tech": [], "sum": {"ru": "локализация (en/ru/de)", "en": "localization (en/ru/de)", "de": "Lokalisierung (en/ru/de)"}, "code": "    private fun l(key: String): String =\n        com.devhorizon.online.ggufchat.ui.theme.Localization.getString(key, _settings.value.appLanguage)\n\n    init {\n        loadModelsFromPrefs()\n        loadSettingsFromPrefs()\n    }\n\n    // ==================== Model Management ===================="}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 97, "end": 157, "kind": "fun", "name": "loadModelsFromPrefs", "owner": "LlmEngine", "sig": "private fun loadModelsFromPrefs() {", "tech": ["mtmd", "prefs", "json", "fileio"], "sum": {"ru": "чтение/запись настроек; разбор/сборка JSON; файловый ввод-вывод", "en": "read/write preferences; JSON parse/build; file I/O", "de": "Einstellungen lesen/schreiben; JSON-Parsing/Aufbau; Datei-E/A"}, "code": "    private fun loadModelsFromPrefs() {\n        val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)\n        val json = prefs.getString(KEY_MODELS, null) ?: return\n        try {\n            val arr = JSONArray(json)\n            val list = mutableListOf<ModelInfo>()\n            var changed = false\n            for (i in 0 until arr.length()) {\n                val o = arr.getJSONObject(i)\n                var m = ModelInfo(\n                    name = o.getString(\"name\"),\n                    path = o.getString(\"path\"),\n                    sizeBytes = o.optLong(\"sizeBytes\", 0),\n                    architecture = o.optString(\"architecture\", \"Unknown\"),\n                    contextLength = o.optInt(\"contextLength\", 4096),\n                    tensorCount = o.optLong(\"tensorCount\", 0),\n                    addedAt = o.optLong(\"addedAt\", System.currentTimeMillis()),\n                    mmprojPath = o.optString(\"mmprojPath\", \"\").ifBlank { null }\n                )\n\n                // Drop entries whose file was deleted outside the app.\n                val file = File(m.path)\n                if (!file.exists()) {\n                    Log.w(TAG, \"Model file missing, dropping entry: ${m.name}\")\n                    changed = true\n                    continue\n                }\n\n                // Refresh architecture for entries imported before the GGUF\n                // metadata parser was fixed (they were stored as \"Unknown\").\n                if (m.architecture == \"Unknown\") {\n                    try {\n                        val info = GgufReader.readHeadersFromFile(file)\n                        if (info.isValid && info.modelArchitecture != \"Unknown\") {\n                            m = m.copy(\n                                architecture = info.modelArchitecture,\n                                contextLength = info.contextLength\n                            )\n                            changed = true\n                        }\n                    } catch (_: Exception) { /* keep the entry as-is */ }\n                }\n\n                // A projector only makes sense for a vision-capable architecture.\n                // Drop a stale binding left on a text model by the old auto-attach\n                // behaviour (it wasted ~1.3 GB RAM and mis-reported vision status).\n                if (m.mmprojPath != null &&\n                    !ModelCompatibility.isVisionArch(m.architecture)\n                ) {\n                    m = m.copy(mmprojPath = null)\n                    changed = true\n                }\n\n                list.add(m)\n            }\n            _models.value = list\n            if (changed) saveModelsToPrefs()\n        } catch (e: Exception) {\n            Log.e(TAG, \"Failed to load models from prefs\", e)\n        }\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 159, "end": 175, "kind": "fun", "name": "saveModelsToPrefs", "owner": "LlmEngine", "sig": "private fun saveModelsToPrefs() {", "tech": ["mtmd", "prefs", "json"], "sum": {"ru": "чтение/запись настроек; разбор/сборка JSON", "en": "read/write preferences; JSON parse/build", "de": "Einstellungen lesen/schreiben; JSON-Parsing/Aufbau"}, "code": "    private fun saveModelsToPrefs() {\n        val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)\n        val arr = JSONArray()\n        for (m in _models.value) {\n            val o = JSONObject()\n            o.put(\"name\", m.name)\n            o.put(\"path\", m.path)\n            o.put(\"sizeBytes\", m.sizeBytes)\n            o.put(\"architecture\", m.architecture)\n            o.put(\"contextLength\", m.contextLength)\n            o.put(\"tensorCount\", m.tensorCount)\n            o.put(\"addedAt\", m.addedAt)\n            o.put(\"mmprojPath\", m.mmprojPath ?: \"\")\n            arr.put(o)\n        }\n        prefs.edit().putString(KEY_MODELS, arr.toString()).apply()\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 177, "end": 205, "kind": "fun", "name": "loadSettingsFromPrefs", "owner": "LlmEngine", "sig": "private fun loadSettingsFromPrefs() {", "tech": ["prefs", "json"], "sum": {"ru": "чтение/запись настроек; разбор/сборка JSON", "en": "read/write preferences; JSON parse/build", "de": "Einstellungen lesen/schreiben; JSON-Parsing/Aufbau"}, "code": "    private fun loadSettingsFromPrefs() {\n        val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)\n        val json = prefs.getString(KEY_SETTINGS, null) ?: return\n        try {\n            val o = JSONObject(json)\n            _settings.value = LlmSettings(\n                systemPrompt = o.optString(\"systemPrompt\", \"You are a helpful assistant.\"),\n                temperature = o.optDouble(\"temperature\", 0.7).toFloat(),\n                topP = o.optDouble(\"topP\", 0.9).toFloat(),\n                maxTokens = o.optInt(\"maxTokens\", 1024),\n                contextLength = o.optInt(\"contextLength\", 4096),\n                threads = o.optInt(\"threads\", 4),\n                autoSuggest = o.optBoolean(\"autoSuggest\", true),\n                suggestionCount = o.optInt(\"suggestionCount\", 4),\n                suggestionDocTokens = o.optInt(\"suggestionDocTokens\", 768),\n                ttsEnabled = o.optBoolean(\"ttsEnabled\", true),\n                ttsLanguage = o.optString(\"ttsLanguage\", \"en\"),\n                ttsRate = o.optDouble(\"ttsRate\", 1.0).toFloat(),\n                sttLanguage = o.optString(\"sttLanguage\", \"en\"),\n                appLanguage = o.optString(\"appLanguage\", \"en\"),\n                appTheme = o.optString(\"appTheme\", \"light\"),\n                answerLanguage = o.optString(\"answerLanguage\", \"auto\"),\n                inputPosition = o.optString(\"inputPosition\", \"bottom\"),\n                suggestionsLayout = o.optString(\"suggestionsLayout\", \"wrap\")\n            )\n        } catch (e: Exception) {\n            Log.e(TAG, \"Failed to load settings from prefs\", e)\n        }\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 207, "end": 230, "kind": "fun", "name": "saveSettings", "owner": "LlmEngine", "sig": "fun saveSettings(newSettings: LlmSettings) {", "tech": ["prefs", "json"], "sum": {"ru": "чтение/запись настроек; разбор/сборка JSON", "en": "read/write preferences; JSON parse/build", "de": "Einstellungen lesen/schreiben; JSON-Parsing/Aufbau"}, "code": "    fun saveSettings(newSettings: LlmSettings) {\n        _settings.value = newSettings\n        val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)\n        val o = JSONObject()\n        o.put(\"systemPrompt\", newSettings.systemPrompt)\n        o.put(\"temperature\", newSettings.temperature.toDouble())\n        o.put(\"topP\", newSettings.topP.toDouble())\n        o.put(\"maxTokens\", newSettings.maxTokens)\n        o.put(\"contextLength\", newSettings.contextLength)\n        o.put(\"threads\", newSettings.threads)\n        o.put(\"autoSuggest\", newSettings.autoSuggest)\n        o.put(\"suggestionCount\", newSettings.suggestionCount)\n        o.put(\"suggestionDocTokens\", newSettings.suggestionDocTokens)\n        o.put(\"ttsEnabled\", newSettings.ttsEnabled)\n        o.put(\"ttsLanguage\", newSettings.ttsLanguage)\n        o.put(\"ttsRate\", newSettings.ttsRate.toDouble())\n        o.put(\"sttLanguage\", newSettings.sttLanguage)\n        o.put(\"appLanguage\", newSettings.appLanguage)\n        o.put(\"appTheme\", newSettings.appTheme)\n        o.put(\"answerLanguage\", newSettings.answerLanguage)\n        o.put(\"inputPosition\", newSettings.inputPosition)\n        o.put(\"suggestionsLayout\", newSettings.suggestionsLayout)\n        prefs.edit().putString(KEY_SETTINGS, o.toString()).apply()\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 232, "end": 232, "kind": "fun", "name": "getGgufInfo", "owner": "LlmEngine", "sig": "fun getGgufInfo(uri: Uri): GgufInfo = GgufReader.readHeaders(context, uri)", "tech": [], "sum": {"ru": "Функция getGgufInfo", "en": "Function getGgufInfo", "de": "Funktion getGgufInfo"}, "code": "    fun getGgufInfo(uri: Uri): GgufInfo = GgufReader.readHeaders(context, uri)"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 234, "end": 234, "kind": "fun", "name": "getGgufInfo", "owner": "LlmEngine", "sig": "fun getGgufInfo(file: File): GgufInfo = GgufReader.readHeadersFromFile(file)", "tech": ["fileio"], "sum": {"ru": "файловый ввод-вывод", "en": "file I/O", "de": "Datei-E/A"}, "code": "    fun getGgufInfo(file: File): GgufInfo = GgufReader.readHeadersFromFile(file)"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 236, "end": 302, "kind": "fun", "name": "importModel", "owner": "LlmEngine", "sig": "suspend fun importModel(uri: Uri, displayName: String? = null): Result<ModelInfo> = withContext(Dispatchers.IO) {", "tech": ["coroutines", "saf", "fileio"], "sum": {"ru": "Копирует GGUF из Uri в files/models с прогрессом.", "en": "Copies a GGUF from a Uri into files/models with progress.", "de": "Kopiert ein GGUF aus einem Uri nach files/models mit Fortschritt."}, "code": "    suspend fun importModel(uri: Uri, displayName: String? = null): Result<ModelInfo> = withContext(Dispatchers.IO) {\n        try {\n            val ggufInfo = GgufReader.readHeaders(context, uri)\n            if (!ggufInfo.isValid) {\n                return@withContext Result.failure(Exception(ggufInfo.error ?: l(\"invalid_gguf\")))\n            }\n            if (!ModelCompatibility.isArchSupported(ggufInfo.modelArchitecture)) {\n                return@withContext Result.failure(\n                    Exception(\"${l(\"unsupported_arch\")}: ${ggufInfo.modelArchitecture}\")\n                )\n            }\n\n            val name = displayName ?: uri.lastPathSegment?.substringAfterLast('/') ?: \"model.gguf\"\n            if (!ModelCompatibility.isModelFileName(name)) {\n                return@withContext Result.failure(Exception(l(\"not_a_model\")))\n            }\n            val modelsDir = File(context.filesDir, \"models\")\n            if (!modelsDir.exists()) modelsDir.mkdirs()\n\n            // Check storage\n            val stat = StatFs(modelsDir.path)\n            val availableMB = stat.availableBytes / (1024 * 1024)\n            if (availableMB < MIN_STORAGE_MB) {\n                return@withContext Result.failure(Exception(l(\"no_storage\")))\n            }\n\n            val destFile = File(modelsDir, name)\n            if (destFile.exists()) {\n                return@withContext Result.failure(Exception(l(\"model_exists\")))\n            }\n\n            // Copy with progress\n            _progress.value = 0f\n            _progressMessage.value = l(\"copying_model\")\n            context.contentResolver.openInputStream(uri)?.use { input ->\n                destFile.outputStream().use { output ->\n                    val buffer = ByteArray(8192)\n                    var totalRead = 0L\n                    var read: Int\n                    while (input.read(buffer).also { read = it } != -1) {\n                        output.write(buffer, 0, read)\n                        totalRead += read\n                        // We don't know total size from URI easily, so just show MB copied\n                        _progressMessage.value = \"${l(\"copying_mb\")} ${totalRead / (1024 * 1024)} MB\"\n                    }\n                }\n            } ?: return@withContext Result.failure(Exception(l(\"error_msg\")))\n\n            val modelInfo = ModelInfo(\n                name = name,\n                path = destFile.absolutePath,\n                sizeBytes = destFile.length(),\n                architecture = ggufInfo.modelArchitecture,\n                contextLength = ggufInfo.contextLength,\n                tensorCount = ggufInfo.tensorCount\n            )\n\n            _models.value = _models.value + modelInfo\n            saveModelsToPrefs()\n            _progress.value = 1f\n            _progressMessage.value = l(\"model_imported\")\n            Result.success(modelInfo)\n        } catch (e: Exception) {\n            Log.e(TAG, \"Failed to import model\", e)\n            Result.failure(e)\n        }\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 304, "end": 311, "kind": "fun", "name": "cancelDownload", "owner": "LlmEngine", "sig": "suspend fun cancelDownload() {", "tech": ["coroutines"], "sum": {"ru": "асинхронные корутины", "en": "async coroutines", "de": "asynchrone Coroutinen"}, "code": "    suspend fun cancelDownload() {\n        cancelDownloadFlag = true\n    }\n\n    /**\n     * Downloads a GGUF model from [url] into the app models dir, validates it,\n     * and registers it like a regular import.\n     */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 312, "end": 438, "kind": "fun", "name": "downloadModelFromUrl", "owner": "LlmEngine", "sig": "suspend fun downloadModelFromUrl(url: String, displayName: String? = null): Result<ModelInfo> = withContext(Dispatchers.IO) {", "tech": ["coroutines", "http", "fileio"], "sum": {"ru": "Скачивает модель с проверкой размера и целостности.", "en": "Downloads a model with size/integrity checks.", "de": "Lädt ein Modell mit Größen-/Integritätsprüfung."}, "code": "    suspend fun downloadModelFromUrl(url: String, displayName: String? = null): Result<ModelInfo> = withContext(Dispatchers.IO) {\n        var tempFile: File? = null\n        try {\n            val trimmed = url.trim()\n            if (!trimmed.startsWith(\"http://\") && !trimmed.startsWith(\"https://\")) {\n                return@withContext Result.failure(Exception(l(\"invalid_url\")))\n            }\n\n            val modelsDir = File(context.filesDir, \"models\")\n            if (!modelsDir.exists()) modelsDir.mkdirs()\n\n            val fileName = (displayName?.takeIf { it.isNotBlank() }\n                ?: trimmed.substringAfterLast('/').substringBefore('?').takeIf { it.isNotBlank() }\n                ?: \"model_${System.currentTimeMillis()}.gguf\")\n                .let { if (it.endsWith(\".gguf\")) it else \"$it.gguf\" }\n\n            if (!ModelCompatibility.isModelFileName(fileName)) {\n                return@withContext Result.failure(Exception(l(\"not_a_model\")))\n            }\n\n            val destFile = File(modelsDir, fileName)\n            if (destFile.exists()) {\n                return@withContext Result.failure(Exception(l(\"model_exists\")))\n            }\n\n            cancelDownloadFlag = false\n            _isDownloading.value = true\n            _downloadProgress.value = 0f\n            _downloadMessage.value = l(\"connecting\")\n\n            val conn = URL(trimmed).openConnection() as HttpURLConnection\n            conn.connectTimeout = 30_000\n            conn.readTimeout = 60_000\n            conn.instanceFollowRedirects = true\n            conn.connect()\n\n            if (conn.responseCode != HttpURLConnection.HTTP_OK) {\n                conn.disconnect()\n                return@withContext Result.failure(Exception(\"HTTP ${conn.responseCode}\"))\n            }\n\n            // Storage pre-check when server reports size\n            val totalBytes = conn.contentLengthLong\n            if (totalBytes > 0) {\n                val stat = StatFs(modelsDir.path)\n                if (stat.availableBytes < totalBytes + MIN_STORAGE_MB * 1024L * 1024L) {\n                    conn.disconnect()\n                    return@withContext Result.failure(Exception(l(\"no_storage\")))\n                }\n            }\n\n            val tmp = File(modelsDir, \"$fileName.part\")\n            tempFile = tmp\n\n            var totalRead = 0L\n            conn.inputStream.use { input ->\n                tmp.outputStream().use { output ->\n                    val buffer = ByteArray(65536)\n                    var read: Int\n                    while (input.read(buffer).also { read = it } != -1) {\n                        if (cancelDownloadFlag) {\n                            conn.disconnect()\n                            tmp.delete()\n                            return@withContext Result.failure(Exception(l(\"cancelled\")))\n                        }\n                        output.write(buffer, 0, read)\n                        totalRead += read\n                        if (totalBytes > 0) {\n                            _downloadProgress.value = (totalRead.toFloat() / totalBytes).coerceIn(0f, 1f)\n                            _downloadMessage.value = \"${l(\"downloading_mb\")} ${totalRead / (1024 * 1024)} / ${totalBytes / (1024 * 1024)} MB\"\n                        } else {\n                            _downloadMessage.value = \"${l(\"downloading_mb\")} ${totalRead / (1024 * 1024)} MB\"\n                        }\n                    }\n                }\n            }\n            conn.disconnect()\n\n            // Verify the download is complete — a dropped connection looks like EOF\n            if (totalBytes > 0 && totalRead != totalBytes) {\n                tmp.delete()\n                return@withContext Result.failure(\n                    Exception(\"${l(\"incomplete_download\")}: $totalRead / $totalBytes B\")\n                )\n            }\n\n            // Validate GGUF headers before registering\n            _downloadMessage.value = l(\"validating_file\")\n            val ggufInfo = GgufReader.readHeadersFromFile(tmp)\n            if (!ggufInfo.isValid) {\n                tmp.delete()\n                return@withContext Result.failure(Exception(ggufInfo.error ?: l(\"invalid_gguf\")))\n            }\n            if (!ModelCompatibility.isArchSupported(ggufInfo.modelArchitecture)) {\n                tmp.delete()\n                return@withContext Result.failure(\n                    Exception(\"${l(\"unsupported_arch\")}: ${ggufInfo.modelArchitecture}\")\n                )\n            }\n\n            if (!tmp.renameTo(destFile)) {\n                tmp.copyTo(destFile, overwrite = true)\n                tmp.delete()\n            }\n\n            val modelInfo = ModelInfo(\n                name = fileName,\n                path = destFile.absolutePath,\n                sizeBytes = destFile.length(),\n                architecture = ggufInfo.modelArchitecture,\n                contextLength = ggufInfo.contextLength,\n                tensorCount = ggufInfo.tensorCount\n            )\n\n            _models.value = _models.value + modelInfo\n            saveModelsToPrefs()\n            _downloadProgress.value = 1f\n            _downloadMessage.value = l(\"download_complete\")\n            Result.success(modelInfo)\n        } catch (e: Exception) {\n            tempFile?.delete()\n            Log.e(TAG, \"Failed to download model\", e)\n            Result.failure(e)\n        } finally {\n            _isDownloading.value = false\n        }\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 440, "end": 500, "kind": "fun", "name": "loadModel", "owner": "LlmEngine", "sig": "suspend fun loadModel(modelInfo: ModelInfo, mmprojPath: String? = null): Boolean = withContext(Dispatchers.IO) {", "tech": ["coroutines", "jni", "mtmd", "fileio"], "sum": {"ru": "Загружает модель, RAM-гейт и vision-проектор.", "en": "Loads the model, RAM gate and vision projector.", "de": "Lädt Modell, RAM-Gate und Vision-Projektor."}, "code": "    suspend fun loadModel(modelInfo: ModelInfo, mmprojPath: String? = null): Boolean = withContext(Dispatchers.IO) {\n        mutex.withLock {\n            try {\n                // The file may have been deleted outside the app.\n                val modelFile = File(modelInfo.path)\n                if (!modelFile.exists()) {\n                    _state.value = ModelState.ERROR\n                    _progressMessage.value = \"${l(\"model_file_missing\")}: ${modelInfo.name}\"\n                    // Drop the stale entry from the list\n                    _models.value = _models.value.filterNot { it.path == modelInfo.path }\n                    saveModelsToPrefs()\n                    return@withLock false\n                }\n\n                // Check architecture support — covers models imported before\n                // the validation existed (their stored arch may be \"Unknown\")\n                var arch = modelInfo.architecture\n                if (arch == \"Unknown\" || arch.isBlank()) {\n                    arch = GgufReader.readHeadersFromFile(modelFile).modelArchitecture\n                }\n                if (arch != \"Unknown\" && !ModelCompatibility.isArchSupported(arch)) {\n                    _state.value = ModelState.ERROR\n                    _progressMessage.value = \"${l(\"unsupported_arch\")}: $arch\"\n                    return@withLock false\n                }\n                loadedArchitecture = arch.lowercase()\n\n                // Reject models that clearly cannot fit into device RAM\n                val totalRamBytes = android.app.ActivityManager.MemoryInfo().let { mi ->\n                    (context.getSystemService(Context.ACTIVITY_SERVICE) as android.app.ActivityManager)\n                        .getMemoryInfo(mi)\n                    mi.totalMem\n                }\n                if (totalRamBytes > 0 && modelInfo.sizeBytes > totalRamBytes * 3 / 4) {\n                    _state.value = ModelState.ERROR\n                    _progressMessage.value = \"${l(\"model_too_large\")}: \" +\n                            \"${formatBytes(modelInfo.sizeBytes)} / ${formatBytes(totalRamBytes)} ${l(\"ram\")}\"\n                    return@withLock false\n                }\n\n                // Unload current model first\n                if (handle > 0) {\n                    LocalLlmNative.nativeFreeModel(handle)\n                    handle = -1L\n                }\n\n                _state.value = ModelState.LOADING\n                _progress.value = 0.7f\n                _progressMessage.value = l(\"loading_memory\")\n\n                val s = _settings.value\n                // Apply the requested context size but never exceed what the model was\n                // trained for (its GGUF context length). This lets every model use its\n                // own maximum while keeping the setting global.\n                val modelMaxCtx = modelInfo.contextLength.coerceAtLeast(512)\n                val effectiveCtx = s.contextLength.coerceIn(512, modelMaxCtx)\n                val newHandle = LocalLlmNative.nativeLoadModel(\n                    modelInfo.path,\n                    s.threads,\n                    effectiveCtx,\n                    object : LocalLlmNative.ProgressCallback {"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 501, "end": 553, "kind": "fun", "name": "onProgress", "owner": "LlmEngine", "sig": "override fun onProgress(progress: Float) {", "tech": ["jni", "mtmd", "fileio"], "sum": {"ru": "вызов нативной библиотеки (JNI); файловый ввод-вывод", "en": "native library call (JNI); file I/O", "de": "Aufruf der nativen Bibliothek (JNI); Datei-E/A"}, "code": "                        override fun onProgress(progress: Float) {\n                            _progress.value = 0.7f + progress * 0.3f\n                        }\n                    }\n                )\n\n                if (newHandle < 0) {\n                    _state.value = ModelState.ERROR\n                    _progressMessage.value = l(\"load_model_failed\")\n                    return@withLock false\n                }\n\n                handle = newHandle\n                loadedModelPath = modelInfo.path\n                _contextSize.value = effectiveCtx\n                _mmprojLoaded.value = false\n                val isVision = ModelCompatibility.isVisionArch(arch)\n                val requested = mmprojPath?.takeIf { it.isNotBlank() && File(it).exists() }\n                // Only a vision-capable architecture may carry a projector; an\n                // explicit or stale binding on a text model is ignored and dropped.\n                val effectiveMmproj =\n                    if (isVision) (requested ?: autoFindMmproj(modelInfo.path)) else null\n                if (!isVision && !modelInfo.mmprojPath.isNullOrBlank()) {\n                    // Remove the stale binding so the model list stops showing it.\n                    setModelMmproj(modelInfo.path, null)\n                }\n                if (!effectiveMmproj.isNullOrBlank()) {\n                    _progressMessage.value = l(\"loading_projector\")\n                    val ok = LocalLlmNative.nativeLoadMmproj(newHandle, effectiveMmproj)\n                    _mmprojLoaded.value = ok\n                    _mmprojName.value = if (ok) File(effectiveMmproj).name else \"\"\n                    if (ok) {\n                        Log.i(TAG, \"mmproj loaded: $effectiveMmproj\")\n                        if (effectiveMmproj != modelInfo.mmprojPath) {\n                            setModelMmproj(modelInfo.path, effectiveMmproj)\n                        }\n                    } else {\n                        Log.e(TAG, \"mmproj load failed: $effectiveMmproj\")\n                    }\n                }\n                _modelName.value = modelInfo.name\n                _state.value = ModelState.LOADED\n                _progress.value = 1f\n                _progressMessage.value = l(\"ready\")\n                true\n            } catch (e: Exception) {\n                Log.e(TAG, \"Failed to load model\", e)\n                _state.value = ModelState.ERROR\n                _progressMessage.value = e.message ?: l(\"error_msg\")\n                false\n            }\n        }\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 555, "end": 570, "kind": "fun", "name": "unloadModel", "owner": "LlmEngine", "sig": "fun unloadModel() {", "tech": ["jni", "mtmd"], "sum": {"ru": "вызов нативной библиотеки (JNI)", "en": "native library call (JNI)", "de": "Aufruf der nativen Bibliothek (JNI)"}, "code": "    fun unloadModel() {\n        if (handle > 0) {\n            LocalLlmNative.nativeFreeModel(handle)\n            handle = -1L\n        }\n        _mmprojLoaded.value = false\n        _mmprojName.value = \"\"\n        _state.value = ModelState.UNLOADED\n        _modelName.value = \"\"\n        _progress.value = 0f\n        _progressMessage.value = \"\"\n        loadedArchitecture = \"Unknown\"\n        _contextSize.value = 0\n    }\n\n    /** Attach an mmproj projector to the currently loaded model (enables images). */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 571, "end": 580, "kind": "fun", "name": "loadMmproj", "owner": "LlmEngine", "sig": "fun loadMmproj(path: String): Boolean {", "tech": ["jni", "mtmd", "fileio"], "sum": {"ru": "вызов нативной библиотеки (JNI); файловый ввод-вывод", "en": "native library call (JNI); file I/O", "de": "Aufruf der nativen Bibliothek (JNI); Datei-E/A"}, "code": "    fun loadMmproj(path: String): Boolean {\n        if (handle <= 0) return false\n        val ok = LocalLlmNative.nativeLoadMmproj(handle, path)\n        _mmprojLoaded.value = ok\n        _mmprojName.value = if (ok) File(path).name else \"\"\n        Log.i(TAG, \"loadMmproj($path) -> $ok\")\n        return ok\n    }\n\n    /** Remember which mmproj belongs to a model (persisted in prefs). */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 581, "end": 588, "kind": "fun", "name": "setModelMmproj", "owner": "LlmEngine", "sig": "fun setModelMmproj(modelPath: String, mmprojPath: String?) {", "tech": ["mtmd"], "sum": {"ru": "Функция setModelMmproj", "en": "Function setModelMmproj", "de": "Funktion setModelMmproj"}, "code": "    fun setModelMmproj(modelPath: String, mmprojPath: String?) {\n        _models.value = _models.value.map {\n            if (it.path == modelPath) it.copy(mmprojPath = mmprojPath) else it\n        }\n        saveModelsToPrefs()\n    }\n\n    /** Looks for a sibling mmproj-*.gguf next to the model file. */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 589, "end": 599, "kind": "fun", "name": "autoFindMmproj", "owner": "LlmEngine", "sig": "private fun autoFindMmproj(modelPath: String): String? = try {", "tech": ["mtmd", "fileio"], "sum": {"ru": "файловый ввод-вывод", "en": "file I/O", "de": "Datei-E/A"}, "code": "    private fun autoFindMmproj(modelPath: String): String? = try {\n        val dir = File(modelPath).parentFile ?: return null\n        dir.listFiles()?.firstOrNull {\n            val n = it.name.lowercase()\n            n.endsWith(\".gguf\") && (n.startsWith(\"mmproj\") || n.contains(\".mmproj.\"))\n        }?.absolutePath\n    } catch (e: Exception) {\n        null\n    }\n\n    /** Imports a projector file (mmproj) picked by the user. */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 600, "end": 621, "kind": "fun", "name": "importMmproj", "owner": "LlmEngine", "sig": "suspend fun importMmproj(uri: Uri, displayName: String? = null): Result<String> = withContext(Dispatchers.IO) {", "tech": ["coroutines", "mtmd", "saf", "fileio"], "sum": {"ru": "доступ к файлам (ContentResolver/SAF); файловый ввод-вывод; асинхронные корутины", "en": "file access (ContentResolver/SAF); file I/O; async coroutines", "de": "Dateizugriff (ContentResolver/SAF); Datei-E/A; asynchrone Coroutinen"}, "code": "    suspend fun importMmproj(uri: Uri, displayName: String? = null): Result<String> = withContext(Dispatchers.IO) {\n        try {\n            val name = displayName\n                ?: uri.lastPathSegment?.substringAfterLast('/')?.takeIf { it.isNotBlank() }\n                ?: \"mmproj.gguf\"\n            if (!ModelCompatibility.isProjectorFileName(name)) {\n                return@withContext Result.failure(Exception(l(\"not_a_projector\")))\n            }\n            val modelsDir = File(context.filesDir, \"models\").apply { mkdirs() }\n            val dest = File(modelsDir, name)\n            context.contentResolver.openInputStream(uri)?.use { input ->\n                dest.outputStream().use { input.copyTo(it) }\n            } ?: return@withContext Result.failure(Exception(l(\"error_msg\")))\n            _progressMessage.value = l(\"projector_imported\")\n            Result.success(dest.absolutePath)\n        } catch (e: Exception) {\n            Log.e(TAG, \"Failed to import mmproj\", e)\n            Result.failure(e)\n        }\n    }\n\n    /** Downloads an mmproj projector from a direct URL into the models dir. */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 622, "end": 682, "kind": "fun", "name": "downloadMmprojFromUrl", "owner": "LlmEngine", "sig": "suspend fun downloadMmprojFromUrl(url: String, displayName: String? = null): Result<String> = withContext(Dispatchers.IO) {", "tech": ["coroutines", "mtmd", "http", "fileio"], "sum": {"ru": "HTTP-запрос; файловый ввод-вывод; асинхронные корутины", "en": "HTTP request; file I/O; async coroutines", "de": "HTTP-Anfrage; Datei-E/A; asynchrone Coroutinen"}, "code": "    suspend fun downloadMmprojFromUrl(url: String, displayName: String? = null): Result<String> = withContext(Dispatchers.IO) {\n        var tmp: File? = null\n        try {\n            val trimmed = url.trim()\n            if (!trimmed.startsWith(\"http://\") && !trimmed.startsWith(\"https://\")) {\n                return@withContext Result.failure(Exception(l(\"invalid_url\")))\n            }\n            val rawName = displayName?.takeIf { it.isNotBlank() }\n                ?: trimmed.substringAfterLast('/').substringBefore('?')\n            val name = if (rawName.endsWith(\".gguf\", ignoreCase = true)) rawName else \"$rawName.gguf\"\n            if (!ModelCompatibility.isProjectorFileName(name)) {\n                return@withContext Result.failure(Exception(l(\"not_a_projector\")))\n            }\n            val modelsDir = File(context.filesDir, \"models\").apply { mkdirs() }\n            val dest = File(modelsDir, name)\n            // Download to a \".part\" file and only rename on success, so a cancelled or\n            // failed download never leaves a truncated projector in the models dir.\n            val part = File(modelsDir, \"$name.part\")\n            tmp = part\n\n            _isDownloading.value = true\n            _downloadProgress.value = 0f\n            _downloadMessage.value = name\n            cancelDownloadFlag = false\n            try {\n                val conn = (URL(trimmed).openConnection() as HttpURLConnection)\n                conn.connectTimeout = 15000\n                conn.readTimeout = 30000\n                conn.connect()\n                val total = conn.contentLengthLong\n                conn.inputStream.use { input ->\n                    part.outputStream().use { out ->\n                        val buf = ByteArray(64 * 1024)\n                        var readTotal = 0L\n                        var r: Int\n                        while (input.read(buf).also { r = it } != -1) {\n                            if (cancelDownloadFlag) throw Exception(l(\"cancelled\"))\n                            out.write(buf, 0, r)\n                            readTotal += r\n                            if (total > 0) {\n                                _downloadProgress.value = (readTotal.toFloat() / total).coerceIn(0f, 1f)\n                            }\n                        }\n                    }\n                }\n                conn.disconnect()\n                if (!part.renameTo(dest)) {\n                    part.copyTo(dest, overwrite = true)\n                    part.delete()\n                }\n                tmp = null\n            } finally {\n                _isDownloading.value = false\n            }\n            Result.success(dest.absolutePath)\n        } catch (e: Exception) {\n            tmp?.delete()\n            Log.e(TAG, \"Failed to download mmproj\", e)\n            Result.failure(e)\n        }\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 684, "end": 693, "kind": "fun", "name": "deleteModel", "owner": "LlmEngine", "sig": "fun deleteModel(modelInfo: ModelInfo) {", "tech": ["fileio"], "sum": {"ru": "файловый ввод-вывод", "en": "file I/O", "de": "Datei-E/A"}, "code": "    fun deleteModel(modelInfo: ModelInfo) {\n        if (loadedModelPath == modelInfo.path) {\n            unloadModel()\n        }\n        File(modelInfo.path).delete()\n        _models.value = _models.value.filter { it.path != modelInfo.path }\n        saveModelsToPrefs()\n    }\n\n    // ==================== Chat Generation ===================="}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 695, "end": 704, "kind": "fun", "name": "buildMessagesJson", "owner": "LlmEngine", "sig": "fun buildMessagesJson(messages: List<com.devhorizon.online.ggufchat.data.model.ChatMessage>): String {", "tech": ["json"], "sum": {"ru": "разбор/сборка JSON", "en": "JSON parse/build", "de": "JSON-Parsing/Aufbau"}, "code": "    fun buildMessagesJson(messages: List<com.devhorizon.online.ggufchat.data.model.ChatMessage>): String {\n        val arr = JSONArray()\n        for (m in messages) {\n            val o = JSONObject()\n            o.put(\"role\", m.role)\n            o.put(\"content\", m.content)\n            arr.put(o)\n        }\n        return arr.toString()\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 706, "end": 761, "kind": "fun", "name": "generate", "owner": "LlmEngine", "sig": "suspend fun generate(", "tech": ["coroutines", "jni"], "sum": {"ru": "Генерирует уникальные подсказки-чипы.", "en": "Generates unique suggestion chips.", "de": "Erzeugt eindeutige Vorschlags-Chips."}, "code": "    suspend fun generate(\n        messages: List<com.devhorizon.online.ggufchat.data.model.ChatMessage>,\n        onToken: (String) -> Unit,\n        docsBlock: String? = null\n    ): String = withContext(Dispatchers.IO) {\n        if (!isLoaded) return@withContext \"\"\n\n        val s = _settings.value\n        // Language directive + session documents as a leading system turn.\n        // The user's custom system prompt is applied on the manual-fallback path\n        // only, matching the previous behaviour.\n        val langBlock = languageReminder() + \"\\n\" + languageDirective()\n        val templatedSystem = buildString {\n            append(langBlock)\n            if (!docsBlock.isNullOrBlank()) {\n                append(\"\\n\\n\").append(docsBlock)\n            }\n        }\n        val manualSystem = buildString {\n            if (s.systemPrompt.isNotBlank()) append(s.systemPrompt.trim()).append(\"\\n\\n\")\n            append(langBlock)\n            if (!docsBlock.isNullOrBlank()) {\n                append(\"\\n\\n\").append(docsBlock)\n            }\n        }\n        val reinforced = if (messages.isEmpty()) {\n            messages\n        } else {\n            val idx = messages.indexOfLast { it.role == \"user\" }\n            if (idx >= 0) {\n                messages.toMutableList().also {\n                    val r = languageReminder()\n                    it[idx] = it[idx].copy(\n                        content = r + \"\\n\\n\" + it[idx].content + \"\\n\\n\" + r\n                    )\n                }\n            } else messages\n        }\n        val effective = listOf(\n            com.devhorizon.online.ggufchat.data.model.ChatMessage(role = \"system\", content = templatedSystem)\n        ) + reinforced\n        val roles = effective.map { it.role }.toTypedArray()\n        val contents = effective.map { it.content }.toTypedArray()\n\n        // Apply chat template\n        val templated = LocalLlmNative.nativeApplyChatTemplate(handle, roles, contents, \"\")\n        val prompt = if (templated.startsWith(\"[error:\")) {\n            // Fallback: build prompt manually, folding everything into the system\n            // prompt (buildManualPrompt has no system-role message).\n            buildManualPrompt(reinforced, manualSystem)\n        } else {\n            templated\n        }\n\n        val result = StringBuilder()\n        val callback = object : LocalLlmNative.TokenCallback {"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 762, "end": 765, "kind": "fun", "name": "onToken", "owner": "LlmEngine", "sig": "override fun onToken(token: String) {", "tech": [], "sum": {"ru": "Функция onToken", "en": "Function onToken", "de": "Funktion onToken"}, "code": "            override fun onToken(token: String) {\n                result.append(token)\n                onToken(token)\n            }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 766, "end": 792, "kind": "fun", "name": "onComplete", "owner": "LlmEngine", "sig": "override fun onComplete(fullResponse: String) {", "tech": ["jni", "mtmd"], "sum": {"ru": "вызов нативной библиотеки (JNI); vision-инференс (mtmd)", "en": "native library call (JNI); vision inference (mtmd)", "de": "Aufruf der nativen Bibliothek (JNI); Vision-Inferenz (mtmd)"}, "code": "            override fun onComplete(fullResponse: String) {\n                // Already handled via onToken\n            }\n        }\n\n        LocalLlmNative.nativeGenerateStreaming(\n            handle,\n            prompt,\n            s.maxTokens,\n            s.temperature,\n            s.topP,\n            null,\n            callback\n        )\n\n        result.toString()\n    }\n\n    /** Cached mtmd media marker (e.g. \"<__media__>\"). */\n    private val mediaMarker: String by lazy {\n        try { LocalLlmNative.nativeMediaMarker() } catch (e: Throwable) { \"<__media__>\" }\n    }\n\n    /**\n     * Image-conditioned generation. Decodes the image to raw RGB and routes it\n     * through mtmd (prompt contains the media marker where the image goes).\n     */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 793, "end": 850, "kind": "fun", "name": "generateVision", "owner": "LlmEngine", "sig": "suspend fun generateVision(", "tech": ["coroutines", "jni", "mtmd", "bitmap", "fileio"], "sum": {"ru": "Vision-генерация: RGB → mtmd → поток токенов.", "en": "Vision generation: RGB → mtmd → token stream.", "de": "Vision-Generierung: RGB → mtmd → Token-Stream."}, "code": "    suspend fun generateVision(\n        messages: List<com.devhorizon.online.ggufchat.data.model.ChatMessage>,\n        imagePath: String,\n        docsBlock: String? = null,\n        onToken: (String) -> Unit\n    ): String = withContext(Dispatchers.IO) {\n        if (!isLoaded || !_mmprojLoaded.value) return@withContext \"\"\n\n        val bmp0 = android.graphics.BitmapFactory.decodeFile(imagePath) ?: return@withContext \"\"\n        // Cap the long side to bound the number of image tokens.\n        val maxSide = 1024\n        val scale = minOf(1f, maxSide.toFloat() / maxOf(bmp0.width, bmp0.height))\n        val bmp = if (scale < 1f) {\n            android.graphics.Bitmap.createScaledBitmap(\n                bmp0,\n                (bmp0.width * scale).toInt().coerceAtLeast(1),\n                (bmp0.height * scale).toInt().coerceAtLeast(1),\n                true\n            )\n        } else bmp0\n        if (bmp !== bmp0) bmp0.recycle()\n        val w = bmp.width\n        val h = bmp.height\n        val pixels = IntArray(w * h)\n        bmp.getPixels(pixels, 0, w, 0, 0, w, h)\n        bmp.recycle()\n        val rgb = ByteArray(w * h * 3)\n        var k = 0\n        for (px in pixels) {\n            rgb[k++] = ((px shr 16) and 0xFF).toByte()\n            rgb[k++] = ((px shr 8) and 0xFF).toByte()\n            rgb[k++] = (px and 0xFF).toByte()\n        }\n\n        val s = _settings.value\n        val systemContent = buildString {\n            if (s.systemPrompt.isNotBlank()) append(s.systemPrompt.trim()).append(\"\\n\\n\")\n            append(languageReminder())\n            append(\"\\n\")\n            append(languageDirective())\n            if (!docsBlock.isNullOrBlank()) append(\"\\n\\n\").append(docsBlock)\n        }\n        // Small vision models tend to mirror the question's language and ignore a\n        // system-level instruction, so reinforce the target language on the last\n        // user turn exactly like the text path does.\n        val reinforcedVision = if (messages.isEmpty()) messages else {\n            val idx = messages.indexOfLast { it.role == \"user\" }\n            if (idx >= 0) {\n                messages.toMutableList().also {\n                    val r = languageReminder()\n                    it[idx] = it[idx].copy(content = r + \"\\n\\n\" + it[idx].content + \"\\n\\n\" + r)\n                }\n            } else messages\n        }\n        val prompt = buildVisionPrompt(reinforcedVision, systemContent)\n\n        val result = StringBuilder()\n        val callback = object : LocalLlmNative.TokenCallback {"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 851, "end": 854, "kind": "fun", "name": "onToken", "owner": "LlmEngine", "sig": "override fun onToken(token: String) {", "tech": [], "sum": {"ru": "Функция onToken", "en": "Function onToken", "de": "Funktion onToken"}, "code": "            override fun onToken(token: String) {\n                result.append(token)\n                onToken(token)\n            }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 855, "end": 863, "kind": "fun", "name": "onComplete", "owner": "LlmEngine", "sig": "override fun onComplete(fullResponse: String) {}", "tech": ["jni"], "sum": {"ru": "вызов нативной библиотеки (JNI)", "en": "native library call (JNI)", "de": "Aufruf der nativen Bibliothek (JNI)"}, "code": "            override fun onComplete(fullResponse: String) {}\n        }\n        LocalLlmNative.nativeGenerateStreamingVision(\n            handle, prompt, rgb, w, h, s.maxTokens, s.temperature, s.topP, null, callback\n        )\n        result.toString()\n    }\n\n    /** Vision prompt: model-family aware, with the mtmd media marker. */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 864, "end": 876, "kind": "fun", "name": "buildVisionPrompt", "owner": "LlmEngine", "sig": "private fun buildVisionPrompt(", "tech": [], "sum": {"ru": "Функция buildVisionPrompt", "en": "Function buildVisionPrompt", "de": "Funktion buildVisionPrompt"}, "code": "    private fun buildVisionPrompt(\n        messages: List<com.devhorizon.online.ggufchat.data.model.ChatMessage>,\n        systemContent: String\n    ): String {\n        val arch = loadedArchitecture.lowercase()\n        return if (arch.startsWith(\"gemma\")) {\n            buildGemmaTurnPrompt(messages, systemContent, withMarker = true)\n        } else {\n            buildChatmlPrompt(messages, systemContent, withMarker = true)\n        }\n    }\n\n    /** Qwen2-VL/LLaVA ChatML; the current user turn carries the media marker. */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 877, "end": 895, "kind": "fun", "name": "buildChatmlPrompt", "owner": "LlmEngine", "sig": "private fun buildChatmlPrompt(", "tech": [], "sum": {"ru": "Функция buildChatmlPrompt", "en": "Function buildChatmlPrompt", "de": "Funktion buildChatmlPrompt"}, "code": "    private fun buildChatmlPrompt(\n        messages: List<com.devhorizon.online.ggufchat.data.model.ChatMessage>,\n        systemContent: String,\n        withMarker: Boolean\n    ): String {\n        val sb = StringBuilder()\n        sb.append(\"<|im_start|>system\\n\").append(systemContent).append(\"<|im_end|>\\n\")\n        val lastUserIdx = messages.indexOfLast { it.role == \"user\" }\n        messages.forEachIndexed { i, m ->\n            val role = if (m.role == \"assistant\") \"assistant\" else \"user\"\n            sb.append(\"<|im_start|>\").append(role).append(\"\\n\")\n            if (withMarker && i == lastUserIdx) sb.append(mediaMarker).append(\"\\n\")\n            sb.append(m.content).append(\"<|im_end|>\\n\")\n        }\n        sb.append(\"<|im_start|>assistant\\n\")\n        return sb.toString()\n    }\n\n    /** Gemma 3/4 turns: <|turn>role\\n…<turn|>\\n (assistant role is \"model\"). */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 896, "end": 912, "kind": "fun", "name": "buildGemmaTurnPrompt", "owner": "LlmEngine", "sig": "private fun buildGemmaTurnPrompt(", "tech": [], "sum": {"ru": "Функция buildGemmaTurnPrompt", "en": "Function buildGemmaTurnPrompt", "de": "Funktion buildGemmaTurnPrompt"}, "code": "    private fun buildGemmaTurnPrompt(\n        messages: List<com.devhorizon.online.ggufchat.data.model.ChatMessage>,\n        systemContent: String,\n        withMarker: Boolean\n    ): String {\n        val sb = StringBuilder()\n        sb.append(\"<|turn>system\\n\").append(systemContent).append(\"<turn|>\\n\")\n        val lastUserIdx = messages.indexOfLast { it.role == \"user\" }\n        messages.forEachIndexed { i, m ->\n            val role = if (m.role == \"assistant\") \"model\" else \"user\"\n            sb.append(\"<|turn>\").append(role).append(\"\\n\")\n            if (withMarker && i == lastUserIdx) sb.append(mediaMarker).append(\"\\n\")\n            sb.append(m.content).append(\"<turn|>\\n\")\n        }\n        sb.append(\"<|turn>model\\n\")\n        return sb.toString()\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 914, "end": 920, "kind": "fun", "name": "cancelGeneration", "owner": "LlmEngine", "sig": "fun cancelGeneration() {", "tech": ["jni"], "sum": {"ru": "вызов нативной библиотеки (JNI); локализация (en/ru/de)", "en": "native library call (JNI); localization (en/ru/de)", "de": "Aufruf der nativen Bibliothek (JNI); Lokalisierung (en/ru/de)"}, "code": "    fun cancelGeneration() {\n        if (handle > 0) {\n            LocalLlmNative.nativeCancel(handle)\n        }\n    }\n\n    /** Effective language code for replies/suggestions: explicit choice or app language. */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 921, "end": 925, "kind": "fun", "name": "resolveAnswerLanguageCode", "owner": "LlmEngine", "sig": "private fun resolveAnswerLanguageCode(): String {", "tech": [], "sum": {"ru": "Функция resolveAnswerLanguageCode", "en": "Function resolveAnswerLanguageCode", "de": "Funktion resolveAnswerLanguageCode"}, "code": "    private fun resolveAnswerLanguageCode(): String {\n        val s = _settings.value\n        val code = s.answerLanguage\n        return if (code.isBlank() || code == \"auto\") s.appLanguage else code\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 927, "end": 933, "kind": "fun", "name": "answerLanguageName", "owner": "LlmEngine", "sig": "private fun answerLanguageName(): String = when (resolveAnswerLanguageCode()) {", "tech": [], "sum": {"ru": "локализация (en/ru/de)", "en": "localization (en/ru/de)", "de": "Lokalisierung (en/ru/de)"}, "code": "    private fun answerLanguageName(): String = when (resolveAnswerLanguageCode()) {\n        \"ru\" -> \"Russian\"\n        \"de\" -> \"German\"\n        else -> \"English\"\n    }\n\n    /** Hard instruction so replies and suggestions ignore message/document language. */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 934, "end": 939, "kind": "fun", "name": "languageDirective", "owner": "LlmEngine", "sig": "private fun languageDirective(): String =", "tech": [], "sum": {"ru": "локализация (en/ru/de)", "en": "localization (en/ru/de)", "de": "Lokalisierung (en/ru/de)"}, "code": "    private fun languageDirective(): String =\n        \"Always write your entire reply in ${answerLanguageName()}. \" +\n            \"This language is fixed by the app settings: use it even if the user's message \" +\n            \"or any attached documents are written in a different language.\"\n\n    /** Same instruction in the target language, appended to the last user turn. */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 940, "end": 944, "kind": "fun", "name": "languageReminder", "owner": "LlmEngine", "sig": "private fun languageReminder(): String = when (resolveAnswerLanguageCode()) {", "tech": [], "sum": {"ru": "локализация (en/ru/de)", "en": "localization (en/ru/de)", "de": "Lokalisierung (en/ru/de)"}, "code": "    private fun languageReminder(): String = when (resolveAnswerLanguageCode()) {\n        \"ru\" -> \"Отвечай только на русском языке, независимо от языка вопроса и прикреплённых документов.\"\n        \"de\" -> \"Antworte nur auf Deutsch, unabhängig von der Sprache der Frage oder der angehängten Dokumente.\"\n        else -> \"Reply in English only, regardless of the language of the question or attached documents.\"\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 946, "end": 1030, "kind": "fun", "name": "buildManualPrompt", "owner": "LlmEngine", "sig": "private fun buildManualPrompt(", "tech": [], "sum": {"ru": "Функция buildManualPrompt", "en": "Function buildManualPrompt", "de": "Funktion buildManualPrompt"}, "code": "    private fun buildManualPrompt(\n        messages: List<com.devhorizon.online.ggufchat.data.model.ChatMessage>,\n        systemPrompt: String\n    ): String {\n        val arch = loadedArchitecture.lowercase()\n        val sb = StringBuilder()\n\n        when {\n            // Gemma 3/4 use the <|turn> format (different from gemma1/2).\n            arch.startsWith(\"gemma4\") || arch.startsWith(\"gemma3\") -> {\n                return buildGemmaTurnPrompt(messages, systemPrompt, withMarker = false)\n            }\n            // Gemma / Gemma2: <start_of_turn>user ... <end_of_turn>. No system role.\n            arch.startsWith(\"gemma\") -> {\n                var sys = systemPrompt.trim()\n                for (m in messages) {\n                    val role = if (m.role == \"assistant\") \"model\" else \"user\"\n                    var content = m.content\n                    if (role == \"user\" && sys.isNotEmpty()) {\n                        content = \"$sys\\n\\n$content\"\n                        sys = \"\"\n                    }\n                    sb.append(\"<start_of_turn>\").append(role).append(\"\\n\")\n                        .append(content).append(\"<end_of_turn>\\n\")\n                }\n                sb.append(\"<start_of_turn>model\\n\")\n            }\n\n            // Qwen / Qwen2 / Qwen2.5: ChatML\n            arch.startsWith(\"qwen\") -> {\n                if (systemPrompt.isNotBlank()) {\n                    sb.append(\"<|im_start|>system\\n\").append(systemPrompt).append(\"<|im_end|>\\n\")\n                }\n                for (m in messages) {\n                    val role = if (m.role == \"assistant\") \"assistant\" else \"user\"\n                    sb.append(\"<|im_start|>\").append(role).append(\"\\n\")\n                        .append(m.content).append(\"<|im_end|>\\n\")\n                }\n                sb.append(\"<|im_start|>assistant\\n\")\n            }\n\n            // Llama 3 / 3.1 / 3.2\n            arch == \"llama\" -> {\n                if (systemPrompt.isNotBlank()) {\n                    sb.append(\"<|start_header_id|>system<|end_header_id|>\\n\\n\")\n                        .append(systemPrompt).append(\"<|eot_id|>\")\n                }\n                for (m in messages) {\n                    val role = if (m.role == \"assistant\") \"assistant\" else \"user\"\n                    sb.append(\"<|start_header_id|>\").append(role).append(\"<|end_header_id|>\\n\\n\")\n                        .append(m.content).append(\"<|eot_id|>\")\n                }\n                sb.append(\"<|start_header_id|>assistant<|end_header_id|>\\n\\n\")\n            }\n\n            // Phi-3 / Phi-3.5\n            arch.startsWith(\"phi\") -> {\n                if (systemPrompt.isNotBlank()) {\n                    sb.append(\"<|system|>\\n\").append(systemPrompt).append(\"<|end|>\\n\")\n                }\n                for (m in messages) {\n                    val role = if (m.role == \"assistant\") \"assistant\" else \"user\"\n                    sb.append(\"<|\").append(role).append(\"|>\\n\")\n                        .append(m.content).append(\"<|end|>\\n\")\n                }\n                sb.append(\"<|assistant|>\\n\")\n            }\n\n            // Generic fallback\n            else -> {\n                if (systemPrompt.isNotBlank()) {\n                    sb.append(\"<|system|>\\n\").append(systemPrompt).append(\"\\n<\/s>\\n\")\n                }\n                for (m in messages) {\n                    val role = if (m.role == \"assistant\") \"assistant\" else \"user\"\n                    sb.append(\"<|\").append(role).append(\"|>\\n\")\n                        .append(m.content).append(\"\\n<\/s>\\n\")\n                }\n                sb.append(\"<|assistant|>\\n\")\n            }\n        }\n        return sb.toString()\n    }\n\n    // ==================== Suggestions ===================="}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 1032, "end": 1067, "kind": "fun", "name": "generateSuggestions", "owner": "LlmEngine", "sig": "suspend fun generateSuggestions(", "tech": ["coroutines", "jni"], "sum": {"ru": "JSON-подсказки с фильтром языка.", "en": "JSON suggestions with a language filter.", "de": "JSON-Vorschläge mit Sprachfilter."}, "code": "    suspend fun generateSuggestions(\n        messages: List<com.devhorizon.online.ggufchat.data.model.ChatMessage>,\n        count: Int,\n        excludeSuggestions: Set<String> = emptySet(),\n        temperature: Float = 0.7f,\n        docsBlock: String? = null,\n        onPartial: ((List<String>, String?) -> Unit)? = null\n    ): List<String> = withContext(Dispatchers.IO) {\n        if (!isLoaded) return@withContext emptyList()\n\n        val lastResponse = messages.lastOrNull { it.role == \"assistant\" }?.content\n        val hasDocs = !docsBlock.isNullOrBlank()\n        if (lastResponse.isNullOrBlank() && !hasDocs) return@withContext emptyList()\n\n        val langCode = resolveAnswerLanguageCode()\n        val prompt = buildSuggestionPrompt(count, hasDocs, lastResponse, docsBlock, excludeSuggestions)\n\n        val templated = LocalLlmNative.nativeApplyChatTemplate(\n            handle,\n            arrayOf(\"user\"),\n            arrayOf(prompt),\n            \"\"\n        )\n        val finalPrompt = if (templated.startsWith(\"[error:\")) {\n            buildManualPrompt(\n                listOf(\n                    com.devhorizon.online.ggufchat.data.model.ChatMessage(\n                        role = \"user\", content = prompt\n                    )\n                ),\n                \"\"\n            )\n        } else templated\n\n        val result = StringBuilder()\n        val callback = object : LocalLlmNative.TokenCallback {"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 1068, "end": 1076, "kind": "fun", "name": "onToken", "owner": "LlmEngine", "sig": "override fun onToken(token: String) {", "tech": [], "sum": {"ru": "Функция onToken", "en": "Function onToken", "de": "Funktion onToken"}, "code": "            override fun onToken(token: String) {\n                result.append(token)\n                if (onPartial != null) {\n                    val (complete, pending) = parsePartial(result.toString())\n                    val okComplete = complete.filter { suggestionMatchesLanguage(it, langCode) }\n                    val okPending = pending?.takeIf { suggestionMatchesLanguage(it, langCode) }\n                    onPartial.invoke(okComplete, okPending)\n                }\n            }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 1077, "end": 1092, "kind": "fun", "name": "onComplete", "owner": "LlmEngine", "sig": "override fun onComplete(fullResponse: String) {}", "tech": ["jni"], "sum": {"ru": "вызов нативной библиотеки (JNI); локализация (en/ru/de)", "en": "native library call (JNI); localization (en/ru/de)", "de": "Aufruf der nativen Bibliothek (JNI); Lokalisierung (en/ru/de)"}, "code": "            override fun onComplete(fullResponse: String) {}\n        }\n\n        LocalLlmNative.nativeGenerateStreaming(\n            handle, finalPrompt, 256, temperature, 0.9f, null, callback\n        )\n\n        val parsed = parseSuggestions(result.toString())\n            .filter { suggestionMatchesLanguage(it, langCode) }\n        Log.d(TAG, \"Suggestion raw: <<<$result>>> -> ${parsed.size}: $parsed\")\n        parsed\n    }\n\n    /** Per-language fragments for the suggestion prompt. Writing the whole prompt\n     *  in the target language makes small models mirror it instead of answering in\n     *  the question's language. */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 1093, "end": 1104, "kind": "class", "name": "SuggestionStrings", "owner": "LlmEngine", "sig": "private data class SuggestionStrings(", "tech": [], "sum": {"ru": "Класс SuggestionStrings", "en": "Class SuggestionStrings", "de": "Klasse SuggestionStrings"}, "code": "    private data class SuggestionStrings(\n        val introBoth: String,\n        val introDocs: String,\n        val introResp: String,\n        val shortRule: String,\n        val langRule: String,\n        val jsonRule: String,\n        val noMdRule: String,\n        val excludeRule: String,\n        val docsHeader: String,\n        val
