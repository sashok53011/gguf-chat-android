      contentDescription = l(\"delete_model\"),\n                    tint = MaterialTheme.colorScheme.error\n                )\n            }\n        }\n    }\n}\n\n@Composable"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/screens/ModelPickerScreen.kt", "cat": "UI · Models", "order": 31, "start": 587, "end": 675, "kind": "fun", "name": "DownloadModelDialog", "owner": "", "sig": "private fun DownloadModelDialog(", "tech": ["compose", "hf"], "sum": {"ru": "REST API Hugging Face; UI-компонент Compose; тема и цвета", "en": "Hugging Face REST API; Compose UI component; theme and colors", "de": "Hugging-Face-REST-API; Compose-UI-Komponente; Theme und Farben"}, "code": "private fun DownloadModelDialog(\n    l: (String) -> String,\n    isDownloading: Boolean,\n    progress: Float,\n    message: String,\n    onDownload: (url: String, name: String?) -> Unit,\n    onCancel: () -> Unit,\n    onDismiss: () -> Unit\n) {\n    var url by remember { mutableStateOf(\"\") }\n    var name by remember { mutableStateOf(\"\") }\n    var wasDownloading by remember { mutableStateOf(false) }\n\n    // Close dialog automatically when download finishes\n    LaunchedEffect(isDownloading) {\n        if (wasDownloading && !isDownloading) {\n            onDismiss()\n        }\n        wasDownloading = isDownloading\n    }\n\n    AlertDialog(\n        onDismissRequest = { if (!isDownloading) onDismiss() },\n        title = { Text(l(\"download_model\")) },\n        text = {\n            Column(modifier = Modifier.fillMaxWidth()) {\n                if (isDownloading) {\n                    LinearProgressIndicator(\n                        progress = { progress },\n                        modifier = Modifier.fillMaxWidth()\n                    )\n                    Spacer(modifier = Modifier.height(8.dp))\n                    Text(\n                        text = message,\n                        style = MaterialTheme.typography.bodySmall,\n                        color = MaterialTheme.colorScheme.onSurfaceVariant\n                    )\n                } else {\n                    OutlinedTextField(\n                        value = url,\n                        onValueChange = { url = it },\n                        label = { Text(l(\"model_url\")) },\n                        placeholder = { Text(\"https://huggingface.co/.../model.gguf\") },\n                        singleLine = true,\n                        modifier = Modifier.fillMaxWidth()\n                    )\n                    Spacer(modifier = Modifier.height(8.dp))\n                    OutlinedTextField(\n                        value = name,\n                        onValueChange = { name = it },\n                        label = { Text(l(\"file_name\")) },\n                        placeholder = { Text(\"model.gguf\") },\n                        singleLine = true,\n                        modifier = Modifier.fillMaxWidth()\n                    )\n                    Spacer(modifier = Modifier.height(8.dp))\n                    Text(\n                        text = l(\"download_hint\"),\n                        style = MaterialTheme.typography.bodySmall,\n                        color = MaterialTheme.colorScheme.onSurfaceVariant\n                    )\n                }\n            }\n        },\n        confirmButton = {\n            if (isDownloading) {\n                TextButton(onClick = onCancel) {\n                    Text(l(\"cancel\"))\n                }\n            } else {\n                Button(\n                    onClick = { onDownload(url, name.ifBlank { null }) },\n                    enabled = url.isNotBlank()\n                ) {\n                    Text(l(\"download\"))\n                }\n            }\n        },\n        dismissButton = {\n            if (!isDownloading) {\n                TextButton(onClick = onDismiss) {\n                    Text(l(\"cancel\"))\n                }\n            }\n        }\n    )\n}\n\n@Composable"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/screens/ModelPickerScreen.kt", "cat": "UI · Models", "order": 31, "start": 676, "end": 848, "kind": "fun", "name": "SearchModelsDialog", "owner": "", "sig": "private fun SearchModelsDialog(", "tech": ["compose"], "sum": {"ru": "UI-компонент Compose; тема и цвета", "en": "Compose UI component; theme and colors", "de": "Compose-UI-Komponente; Theme und Farben"}, "code": "private fun SearchModelsDialog(\n    l: (String) -> String,\n    isSearching: Boolean,\n    results: List<GgufSearchResult>,\n    errorKey: String?,\n    isDownloading: Boolean,\n    downloadProgress: Float,\n    downloadMessage: String,\n    onSearch: (query: String, maxFileSizeMB: Long, includeProjectors: Boolean) -> Unit,\n    onDownload: (GgufSearchResult) -> Unit,\n    onDismiss: () -> Unit\n) {\n    var query by remember { mutableStateOf(\"\") }\n    var maxFileSizeMB by remember { mutableStateOf(2048L) }\n    var selected by remember { mutableStateOf<GgufSearchResult?>(null) }\n    var includeProjectors by remember { mutableStateOf(false) }\n\n    val sizePresets = listOf(\n        512L to \"512 MB\",\n        1024L to \"1 GB\",\n        2048L to \"2 GB\",\n        4096L to \"4 GB\",\n        8192L to \"8 GB\",\n        0L to l(\"no_limit\")\n    )\n\n    AlertDialog(\n        onDismissRequest = { if (!isSearching) onDismiss() },\n        title = { Text(l(\"search_models\")) },\n        text = {\n            Column(modifier = Modifier.fillMaxWidth()) {\n                OutlinedTextField(\n                    value = query,\n                    onValueChange = { query = it },\n                    label = { Text(l(\"search_keyword\")) },\n                    placeholder = { Text(\"qwen, phi, llama...\") },\n                    singleLine = true,\n                    enabled = !isSearching,\n                    modifier = Modifier.fillMaxWidth()\n                )\n                Spacer(modifier = Modifier.height(8.dp))\n                Text(\n                    text = l(\"max_size_mb\"),\n                    style = MaterialTheme.typography.labelMedium,\n                    color = MaterialTheme.colorScheme.onSurfaceVariant\n                )\n                Spacer(modifier = Modifier.height(4.dp))\n                // Preset size buttons (rows of 3)\n                Column(verticalArrangement = Arrangement.spacedBy(4.dp)) {\n                    sizePresets.chunked(3).forEach { row ->\n                        Row(horizontalArrangement = Arrangement.spacedBy(4.dp)) {\n                            row.forEach { (value, label) ->\n                                val isSelected = maxFileSizeMB == value\n                                OutlinedButton(\n                                    onClick = { maxFileSizeMB = value },\n                                    enabled = !isSearching,\n                                    modifier = Modifier.weight(1f),\n                                    colors = androidx.compose.material3.ButtonDefaults.outlinedButtonColors(\n                                        containerColor = if (isSelected) MaterialTheme.colorScheme.primaryContainer\n                                        else MaterialTheme.colorScheme.surface\n                                    )\n                                ) {\n                                    Text(\n                                        text = label,\n                                        style = MaterialTheme.typography.labelSmall,\n                                        maxLines = 1\n                                    )\n                                }\n                            }\n                        }\n                    }\n                }\n                Spacer(modifier = Modifier.height(8.dp))\n                Row(verticalAlignment = Alignment.CenterVertically) {\n                    androidx.compose.material3.Checkbox(\n                        checked = includeProjectors,\n                        onCheckedChange = { includeProjectors = it },\n                        enabled = !isSearching\n                    )\n                    Spacer(modifier = Modifier.width(4.dp))\n                    Text(\n                        text = l(\"include_projectors\"),\n                        style = MaterialTheme.typography.bodySmall,\n                        color = MaterialTheme.colorScheme.onSurfaceVariant\n                    )\n                }\n                Spacer(modifier = Modifier.height(8.dp))\n                Button(\n                    onClick = { onSearch(query, maxFileSizeMB, includeProjectors) },\n                    enabled = query.isNotBlank() && !isSearching && !isDownloading,\n                    modifier = Modifier.fillMaxWidth()\n                ) {\n                    if (isSearching) {\n                        CircularProgressIndicator(\n                            modifier = Modifier.size(16.dp),\n                            strokeWidth = 2.dp\n                        )\n                        Spacer(modifier = Modifier.width(8.dp))\n                    }\n                    Text(l(\"search\"))\n                }\n\n                if (isDownloading) {\n                    Spacer(modifier = Modifier.height(12.dp))\n                    LinearProgressIndicator(\n                        progress = { downloadProgress },\n                        modifier = Modifier.fillMaxWidth()\n                    )\n                    Spacer(modifier = Modifier.height(4.dp))\n                    Text(\n                        text = downloadMessage,\n                        style = MaterialTheme.typography.bodySmall,\n                        color = MaterialTheme.colorScheme.onSurfaceVariant\n                    )\n                }\n\n                if (!isSearching && errorKey != null) {\n                    Spacer(modifier = Modifier.height(12.dp))\n                    Text(\n                        text = l(errorKey),\n                        style = MaterialTheme.typography.bodySmall,\n                        color = MaterialTheme.colorScheme.error\n                    )\n                }\n\n                if (results.isNotEmpty()) {\n                    Spacer(modifier = Modifier.height(8.dp))\n                    Text(\n                        text = \"${l(\"search_results\")} (${results.size})\",\n                        style = MaterialTheme.typography.labelMedium,\n                        color = MaterialTheme.colorScheme.onSurfaceVariant\n                    )\n                    LazyColumn(\n                        modifier = Modifier\n                            .fillMaxWidth()\n                            .height(360.dp),\n                        verticalArrangement = Arrangement.spacedBy(4.dp)\n                    ) {\n                        items(results) { result ->\n                            SearchResultRow(\n                                result = result,\n                                isSelected = selected?.url == result.url,\n                                l = l,\n                                onClick = { selected = result }\n                            )\n                        }\n                    }\n                }\n            }\n        },\n        confirmButton = {\n            Button(\n                onClick = { selected?.let(onDownload) },\n                enabled = selected != null && !isSearching && !isDownloading\n            ) {\n                Icon(\n                    Icons.Default.Download,\n                    contentDescription = null,\n                    modifier = Modifier.size(18.dp)\n                )\n                Spacer(modifier = Modifier.width(4.dp))\n                Text(l(\"download\"))\n            }\n        },\n        dismissButton = {\n            TextButton(onClick = onDismiss, enabled = !isSearching) {\n                Text(l(\"cancel\"))\n            }\n        }\n    )\n}\n\n@Composable"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/screens/ModelPickerScreen.kt", "cat": "UI · Models", "order": 31, "start": 849, "end": 903, "kind": "fun", "name": "SearchResultRow", "owner": "", "sig": "private fun SearchResultRow(", "tech": ["compose"], "sum": {"ru": "тема и цвета", "en": "theme and colors", "de": "Theme und Farben"}, "code": "private fun SearchResultRow(\n    result: GgufSearchResult,\n    isSelected: Boolean,\n    l: (String) -> String,\n    onClick: () -> Unit\n) {\n    Card(\n        modifier = Modifier\n            .fillMaxWidth()\n            .clickable { onClick() },\n        colors = CardDefaults.cardColors(\n            containerColor = if (isSelected) MaterialTheme.colorScheme.primaryContainer\n            else MaterialTheme.colorScheme.surfaceVariant\n        ),\n        shape = RoundedCornerShape(8.dp)\n    ) {\n        Row(\n            modifier = Modifier\n                .fillMaxWidth()\n                .padding(8.dp),\n            verticalAlignment = Alignment.CenterVertically\n        ) {\n            RadioButton(selected = isSelected, onClick = onClick)\n            Column(modifier = Modifier.weight(1f)) {\n                Text(\n                    text = result.fileName,\n                    style = MaterialTheme.typography.bodyMedium,\n                    fontWeight = androidx.compose.ui.text.font.FontWeight.Bold,\n                    maxLines = 1,\n                    overflow = TextOverflow.Ellipsis\n                )\n                Spacer(modifier = Modifier.height(2.dp))\n                Text(\n                    text = formatSize(result.sizeBytes),\n                    style = MaterialTheme.typography.titleSmall,\n                    color = MaterialTheme.colorScheme.primary,\n                    fontWeight = androidx.compose.ui.text.font.FontWeight.Bold\n                )\n                Spacer(modifier = Modifier.height(2.dp))\n                Text(\n                    text = result.repoId,\n                    style = MaterialTheme.typography.bodySmall,\n                    color = MaterialTheme.colorScheme.onSurfaceVariant,\n                    maxLines = 1,\n                    overflow = TextOverflow.Ellipsis\n                )\n                Text(\n                    text = \"↓ ${result.downloads}\",\n                    style = MaterialTheme.typography.bodySmall,\n                    color = MaterialTheme.colorScheme.onSurfaceVariant\n                )\n            }\n        }\n    }\n}"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/screens/ModelPickerScreen.kt", "cat": "UI · Models", "order": 31, "start": 905, "end": 914, "kind": "fun", "name": "formatSize", "owner": "", "sig": "private fun formatSize(bytes: Long): String {", "tech": [], "sum": {"ru": "Функция formatSize", "en": "Function formatSize", "de": "Funktion formatSize"}, "code": "private fun formatSize(bytes: Long): String {\n    return when {\n        bytes >= 1_073_741_824 -> \"%.1f GB\".format(bytes / 1_073_741_824.0)\n        bytes >= 1_048_576 -> \"%.1f MB\".format(bytes / 1_048_576.0)\n        bytes >= 1024 -> \"%.1f KB\".format(bytes / 1024.0)\n        else -> \"$bytes B\"\n    }\n}\n\n/** One-tap downloads: the two tested vision models and their Q8 projectors. */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/screens/ModelPickerScreen.kt", "cat": "UI · Models", "order": 31, "start": 915, "end": 920, "kind": "class", "name": "QuickDownload", "owner": "", "sig": "private data class QuickDownload(", "tech": [], "sum": {"ru": "Пресет быстрой загрузки модели.", "en": "Quick-download preset.", "de": "Schnell-Download-Preset."}, "code": "private data class QuickDownload(\n    val label: String,\n    val fileName: String,\n    val url: String,\n    val note: String\n)"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/screens/ModelPickerScreen.kt", "cat": "UI · Models", "order": 31, "start": 922, "end": 949, "kind": "val", "name": "QUICK_DOWNLOADS", "owner": "", "sig": "private val QUICK_DOWNLOADS = listOf(", "tech": ["compose", "mtmd", "hf"], "sum": {"ru": "REST API Hugging Face; UI-компонент Compose", "en": "Hugging Face REST API; Compose UI component", "de": "Hugging-Face-REST-API; Compose-UI-Komponente"}, "code": "private val QUICK_DOWNLOADS = listOf(\n    QuickDownload(\n        label = \"Gemma 4 E2B (Q4_K_M)\",\n        fileName = \"gemma-4-E2B-it-Q4_K_M.gguf\",\n        url = \"https://huggingface.co/unsloth/gemma-4-E2B-it-GGUF/resolve/main/gemma-4-E2B-it-Q4_K_M.gguf\",\n        note = \"~3.0 GB - model\"\n    ),\n    QuickDownload(\n        label = \"Gemma 4 E2B - mmproj Q8\",\n        fileName = \"mmproj-gemma-4-E2B-it-Q8_0.gguf\",\n        url = \"https://huggingface.co/prithivMLmods/gemma-4-E2B-it-F32-GGUF/resolve/main/GGUF/gemma-4-E2B-it.mmproj-q8_0.gguf\",\n        note = \"~0.5 GB - vision projector\"\n    ),\n    QuickDownload(\n        label = \"Qwen2-VL 2B (Q4_K_M)\",\n        fileName = \"Qwen2-VL-2B-Instruct-Q4_K_M.gguf\",\n        url = \"https://huggingface.co/ggml-org/Qwen2-VL-2B-Instruct-GGUF/resolve/main/Qwen2-VL-2B-Instruct-Q4_K_M.gguf\",\n        note = \"~0.9 GB - model\"\n    ),\n    QuickDownload(\n        label = \"Qwen2-VL 2B - mmproj Q8\",\n        fileName = \"mmproj-Qwen2-VL-2B-Instruct-Q8_0.gguf\",\n        url = \"https://huggingface.co/ggml-org/Qwen2-VL-2B-Instruct-GGUF/resolve/main/mmproj-Qwen2-VL-2B-Instruct-Q8_0.gguf\",\n        note = \"~0.7 GB - vision projector\"\n    )\n)\n\n@Composable"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/screens/ModelPickerScreen.kt", "cat": "UI · Models", "order": 31, "start": 950, "end": 1005, "kind": "fun", "name": "QuickDownloadDialog", "owner": "", "sig": "private fun QuickDownloadDialog(", "tech": ["compose"], "sum": {"ru": "тема и цвета", "en": "theme and colors", "de": "Theme und Farben"}, "code": "private fun QuickDownloadDialog(\n    l: (String) -> String,\n    isDownloading: Boolean,\n    progress: Float,\n    message: String,\n    onDownload: (fileName: String, url: String) -> Unit,\n    onCancel: () -> Unit,\n    onDismiss: () -> Unit\n) {\n    AlertDialog(\n        onDismissRequest = { if (!isDownloading) onDismiss() },\n        title = { Text(l(\"quick_downloads\")) },\n        text = {\n            Column {\n                QUICK_DOWNLOADS.forEach { item ->\n                    Row(\n                        modifier = Modifier.fillMaxWidth(),\n                        verticalAlignment = Alignment.CenterVertically\n                    ) {\n                        Column(modifier = Modifier.weight(1f)) {\n                            Text(item.label, style = MaterialTheme.typography.bodyMedium)\n                            Text(\n                                item.note,\n                                style = MaterialTheme.typography.labelSmall,\n                                color = MaterialTheme.colorScheme.onSurfaceVariant\n                            )\n                        }\n                        TextButton(\n                            onClick = { onDownload(item.fileName, item.url) },\n                            enabled = !isDownloading\n                        ) {\n                            Text(l(\"download\"))\n                        }\n                    }\n                }\n                if (isDownloading) {\n                    Spacer(modifier = Modifier.height(8.dp))\n                    LinearProgressIndicator(progress = { progress }, modifier = Modifier.fillMaxWidth())\n                    Spacer(modifier = Modifier.height(4.dp))\n                    Text(\n                        message,\n                        style = MaterialTheme.typography.labelSmall,\n                        color = MaterialTheme.colorScheme.onSurfaceVariant\n                    )\n                }\n            }\n        },\n        confirmButton = {\n            if (isDownloading) {\n                TextButton(onClick = onCancel) { Text(l(\"cancel\")) }\n            } else {\n                TextButton(onClick = onDismiss) { Text(l(\"close\")) }\n            }\n        }\n    )\n}"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/screens/SettingsScreen.kt", "cat": "UI · Settings", "order": 32, "start": 47, "end": 268, "kind": "fun", "name": "SettingsScreen", "owner": "", "sig": "fun SettingsScreen(", "tech": ["compose", "flow"], "sum": {"ru": "Настройки: температура, языки, темы, вёрстка.", "en": "Settings: temperature, languages, themes, layout.", "de": "Einstellungen: Temperatur, Sprachen, Themes, Layout."}, "code": "fun SettingsScreen(\n    viewModel: ChatViewModel,\n    onBack: () -> Unit\n) {\n    val lang by viewModel.appLanguage.collectAsState()\n    val l = { key: String -> Localization.getString(key, lang) }\n    val settings by viewModel.llmEngine.settings.collectAsState()\n\n    var currentSettings by remember(settings) { mutableStateOf(settings) }\n\n    Scaffold(\n        topBar = {\n            TopAppBar(\n                title = { Text(l(\"settings\")) },\n                navigationIcon = {\n                    IconButton(onClick = onBack) {\n                        Icon(Icons.Default.ArrowBack, contentDescription = l(\"back\"))\n                    }\n                }\n            )\n        }\n    ) { paddingValues ->\n        Column(\n            modifier = Modifier\n                .fillMaxSize()\n                .padding(paddingValues)\n                .verticalScroll(rememberScrollState())\n                .padding(16.dp),\n            verticalArrangement = Arrangement.spacedBy(16.dp)\n        ) {\n            // Language\n            SectionTitle(l(\"language\"))\n            DropdownSelector(\n                label = l(\"language\"),\n                options = listOf(\"en\" to l(\"english\"), \"ru\" to l(\"russian\"), \"de\" to l(\"german\")),\n                selected = currentSettings.appLanguage,\n                onSelect = { currentSettings = currentSettings.copy(appLanguage = it) }\n            )\n\n            DropdownSelector(\n                label = l(\"answer_language\"),\n                options = listOf(\n                    \"auto\" to l(\"lang_auto\"),\n                    \"en\" to l(\"english\"),\n                    \"ru\" to l(\"russian\"),\n                    \"de\" to l(\"german\")\n                ),\n                selected = currentSettings.answerLanguage,\n                onSelect = { currentSettings = currentSettings.copy(answerLanguage = it) }\n            )\n\n            // Theme\n            SectionTitle(l(\"appearance\"))\n            DropdownSelector(\n                label = l(\"appearance\"),\n                options = listOf(\n                    \"light\" to \"Light\",\n                    \"dark\" to \"Dark\",\n                    \"green\" to \"Green\",\n                    \"orange\" to \"Orange\",\n                    \"light_blue\" to \"Light Blue\",\n                    \"yellow\" to \"Yellow\"\n                ),\n                selected = currentSettings.appTheme,\n                onSelect = { currentSettings = currentSettings.copy(appTheme = it) }\n            )\n\n            // Interface layout\n            SectionTitle(l(\"interface_section\"))\n\n            DropdownSelector(\n                label = l(\"input_position\"),\n                options = listOf(\n                    \"bottom\" to l(\"position_bottom\"),\n                    \"top\" to l(\"position_top\")\n                ),\n                selected = currentSettings.inputPosition,\n                onSelect = { currentSettings = currentSettings.copy(inputPosition = it) }\n            )\n\n            DropdownSelector(\n                label = l(\"suggestions_layout\"),\n                options = listOf(\n                    \"wrap\" to l(\"layout_wrap\"),\n                    \"single_row\" to l(\"layout_single_row\")\n                ),\n                selected = currentSettings.suggestionsLayout,\n                onSelect = { currentSettings = currentSettings.copy(suggestionsLayout = it) }\n            )\n\n            // Inference settings\n            SectionTitle(l(\"inference_settings\"))\n\n            OutlinedTextField(\n                value = currentSettings.systemPrompt,\n                onValueChange = { currentSettings = currentSettings.copy(systemPrompt = it) },\n                label = { Text(l(\"system_prompt\")) },\n                modifier = Modifier.fillMaxWidth(),\n                maxLines = 3\n            )\n\n            SliderSetting(\n                label = l(\"temperature\"),\n                value = currentSettings.temperature,\n                range = 0f..2f,\n                onValueChange = { currentSettings = currentSettings.copy(temperature = it) }\n            )\n\n            SliderSetting(\n                label = l(\"top_p\"),\n                value = currentSettings.topP,\n                range = 0f..1f,\n                onValueChange = { currentSettings = currentSettings.copy(topP = it) }\n            )\n\n            SliderSetting(\n                label = l(\"max_tokens\"),\n                value = currentSettings.maxTokens.toFloat(),\n                range = 64f..4096f,\n                steps = 63,\n                onValueChange = { currentSettings = currentSettings.copy(maxTokens = it.roundToInt()) }\n            )\n\n            // Context size: any value from 512 to 131072. The effective value is\n            // additionally clamped to the loaded model's maximum (see LlmEngine).\n            var ctxText by remember { mutableStateOf(currentSettings.contextLength.toString()) }\n            OutlinedTextField(\n                value = ctxText,\n                onValueChange = { input ->\n                    val digits = input.filter { it.isDigit() }.take(6)\n                    ctxText = digits\n                    digits.toIntOrNull()?.let { v ->\n                        currentSettings = currentSettings.copy(contextLength = v.coerceIn(512, 131072))\n                    }\n                },\n                label = { Text(l(\"context_size\")) },\n                singleLine = true,\n                keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),\n                modifier = Modifier.fillMaxWidth()\n            )\n\n            SliderSetting(\n                label = l(\"threads\"),\n                value = currentSettings.threads.toFloat(),\n                range = 1f..8f,\n                steps = 6,\n                onValueChange = { currentSettings = currentSettings.copy(threads = it.roundToInt()) }\n            )\n\n            // Voice settings\n            SectionTitle(l(\"voice_settings\"))\n\n            SwitchSetting(\n                label = l(\"tts_enabled\"),\n                checked = currentSettings.ttsEnabled,\n                onCheckedChange = { currentSettings = currentSettings.copy(ttsEnabled = it) }\n            )\n\n            DropdownSelector(\n                label = l(\"tts_language\"),\n                options = listOf(\"en\" to l(\"english\"), \"ru\" to l(\"russian\"), \"de\" to l(\"german\")),\n                selected = currentSettings.ttsLanguage,\n                onSelect = { currentSettings = currentSettings.copy(ttsLanguage = it) }\n            )\n\n            SliderSetting(\n                label = l(\"tts_rate\"),\n                value = currentSettings.ttsRate,\n                range = 0.5f..2f,\n                onValueChange = { currentSettings = currentSettings.copy(ttsRate = it) }\n            )\n\n            DropdownSelector(\n                label = l(\"stt_language\"),\n                options = listOf(\"en\" to l(\"english\"), \"ru\" to l(\"russian\"), \"de\" to l(\"german\")),\n                selected = currentSettings.sttLanguage,\n                onSelect = { currentSettings = currentSettings.copy(sttLanguage = it) }\n            )\n\n            // Suggestion settings\n            SectionTitle(l(\"suggestion_settings\"))\n\n            SwitchSetting(\n                label = l(\"auto_suggest\"),\n                checked = currentSettings.autoSuggest,\n                onCheckedChange = { currentSettings = currentSettings.copy(autoSuggest = it) }\n            )\n\n            SliderSetting(\n                label = l(\"suggestion_count\"),\n                value = currentSettings.suggestionCount.toFloat(),\n                range = 2f..8f,\n                steps = 5,\n                onValueChange = { currentSettings = currentSettings.copy(suggestionCount = it.roundToInt()) }\n            )\n\n            SliderSetting(\n                label = l(\"suggestion_doc_tokens\"),\n                value = currentSettings.suggestionDocTokens.toFloat(),\n                range = 0f..2048f,\n                steps = 7,\n                onValueChange = { currentSettings = currentSettings.copy(suggestionDocTokens = (it / 256f).roundToInt() * 256) }\n            )\n\n            // Save button\n            Spacer(modifier = Modifier.height(16.dp))\n            androidx.compose.material3.Button(\n                onClick = {\n                    viewModel.updateSettings(currentSettings)\n                    onBack()\n                },\n                modifier = Modifier.fillMaxWidth()\n            ) {\n                Text(l(\"save\"))\n            }\n\n            Spacer(modifier = Modifier.height(32.dp))\n        }\n    }\n}\n\n@Composable"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/screens/SettingsScreen.kt", "cat": "UI · Settings", "order": 32, "start": 269, "end": 278, "kind": "fun", "name": "SectionTitle", "owner": "", "sig": "private fun SectionTitle(title: String) {", "tech": ["compose"], "sum": {"ru": "UI-компонент Compose; тема и цвета", "en": "Compose UI component; theme and colors", "de": "Compose-UI-Komponente; Theme und Farben"}, "code": "private fun SectionTitle(title: String) {\n    Text(\n        text = title,\n        style = MaterialTheme.typography.titleMedium,\n        color = MaterialTheme.colorScheme.primary,\n        modifier = Modifier.padding(top = 8.dp)\n    )\n}\n\n@Composable"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/screens/SettingsScreen.kt", "cat": "UI · Settings", "order": 32, "start": 279, "end": 308, "kind": "fun", "name": "SliderSetting", "owner": "", "sig": "private fun SliderSetting(", "tech": ["compose"], "sum": {"ru": "UI-компонент Compose; тема и цвета", "en": "Compose UI component; theme and colors", "de": "Compose-UI-Komponente; Theme und Farben"}, "code": "private fun SliderSetting(\n    label: String,\n    value: Float,\n    range: ClosedFloatingPointRange<Float>,\n    steps: Int = 0,\n    onValueChange: (Float) -> Unit\n) {\n    Column {\n        Row(\n            modifier = Modifier.fillMaxWidth(),\n            horizontalArrangement = Arrangement.SpaceBetween\n        ) {\n            Text(label, style = MaterialTheme.typography.bodyMedium)\n            Text(\n                if (value == value.roundToInt().toFloat()) value.roundToInt().toString()\n                else \"%.2f\".format(value),\n                style = MaterialTheme.typography.bodyMedium,\n                color = MaterialTheme.colorScheme.primary\n            )\n        }\n        Slider(\n            value = value,\n            onValueChange = onValueChange,\n            valueRange = range,\n            steps = steps\n        )\n    }\n}\n\n@Composable"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/screens/SettingsScreen.kt", "cat": "UI · Settings", "order": 32, "start": 309, "end": 325, "kind": "fun", "name": "SwitchSetting", "owner": "", "sig": "private fun SwitchSetting(", "tech": ["compose"], "sum": {"ru": "UI-компонент Compose; тема и цвета", "en": "Compose UI component; theme and colors", "de": "Compose-UI-Komponente; Theme und Farben"}, "code": "private fun SwitchSetting(\n    label: String,\n    checked: Boolean,\n    onCheckedChange: (Boolean) -> Unit\n) {\n    Row(\n        modifier = Modifier.fillMaxWidth(),\n        horizontalArrangement = Arrangement.SpaceBetween,\n        verticalAlignment = Alignment.CenterVertically\n    ) {\n        Text(label, style = MaterialTheme.typography.bodyMedium)\n        Switch(checked = checked, onCheckedChange = onCheckedChange)\n    }\n}\n\n@OptIn(ExperimentalMaterial3Api::class)\n@Composable"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/screens/SettingsScreen.kt", "cat": "UI · Settings", "order": 32, "start": 326, "end": 364, "kind": "fun", "name": "DropdownSelector", "owner": "", "sig": "private fun DropdownSelector(", "tech": ["compose"], "sum": {"ru": "Функция DropdownSelector", "en": "Function DropdownSelector", "de": "Funktion DropdownSelector"}, "code": "private fun DropdownSelector(\n    label: String,\n    options: List<Pair<String, String>>,\n    selected: String,\n    onSelect: (String) -> Unit\n) {\n    var expanded by remember { mutableStateOf(false) }\n    val selectedLabel = options.find { it.first == selected }?.second ?: selected\n\n    ExposedDropdownMenuBox(\n        expanded = expanded,\n        onExpandedChange = { expanded = it }\n    ) {\n        OutlinedTextField(\n            value = selectedLabel,\n            onValueChange = {},\n            readOnly = true,\n            label = { Text(label) },\n            trailingIcon = { ExposedDropdownMenuDefaults.TrailingIcon(expanded = expanded) },\n            modifier = Modifier\n                .fillMaxWidth()\n                .menuAnchor()\n        )\n        ExposedDropdownMenu(\n            expanded = expanded,\n            onDismissRequest = { expanded = false }\n        ) {\n            options.forEach { (value, display) ->\n                DropdownMenuItem(\n                    text = { Text(display) },\n                    onClick = {\n                        onSelect(value)\n                        expanded = false\n                    }\n                )\n            }\n        }\n    }\n}"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/components/MarkdownText.kt", "cat": "UI · Markdown", "order": 33, "start": 33, "end": 46, "kind": "fun", "name": "MarkdownText", "owner": "", "sig": "fun MarkdownText(", "tech": ["compose"], "sum": {"ru": "Лёгкий рендер markdown в AnnotatedString.", "en": "Lightweight markdown rendering to AnnotatedString.", "de": "Leichtes Markdown-Rendering zu AnnotatedString."}, "code": "fun MarkdownText(\n    text: String,\n    modifier: Modifier = Modifier,\n    textColor: Color = MaterialTheme.colorScheme.onSurface\n) {\n    SelectionContainer {\n        val annotated = parseMarkdown(text, textColor)\n        Text(\n            text = annotated,\n            modifier = modifier.fillMaxWidth(),\n            style = MaterialTheme.typography.bodyLarge.copy(color = textColor)\n        )\n    }\n}"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/components/MarkdownText.kt", "cat": "UI · Markdown", "order": 33, "start": 48, "end": 80, "kind": "fun", "name": "parseMarkdown", "owner": "", "sig": "private fun parseMarkdown(text: String, baseColor: Color): AnnotatedString {", "tech": [], "sum": {"ru": "Разбирает markdown в стилизованный текст.", "en": "Parses markdown into styled text.", "de": "Parst Markdown in formatierten Text."}, "code": "private fun parseMarkdown(text: String, baseColor: Color): AnnotatedString {\n    return buildAnnotatedString {\n        val lines = text.split(\"\\n\")\n        var inCodeBlock = false\n        val codeBlockContent = StringBuilder()\n\n        for ((index, line) in lines.withIndex()) {\n            if (line.trimStart().startsWith(\"```\")) {\n                if (inCodeBlock) {\n                    // End code block\n                    withStyle(SpanStyle(fontFamily = FontFamily.Monospace, background = Color(0xFF2D2D2D), color = Color.White)) {\n                        append(codeBlockContent.toString().trimEnd())\n                    }\n                    append(\"\\n\")\n                    codeBlockContent.clear()\n                    inCodeBlock = false\n                } else {\n                    inCodeBlock = true\n                }\n                continue\n            }\n\n            if (inCodeBlock) {\n                codeBlockContent.append(line).append(\"\\n\")\n                continue\n            }\n\n            // Parse inline markdown\n            parseInline(line, baseColor)\n            if (index < lines.size - 1) append(\"\\n\")\n        }\n    }\n}"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/components/MarkdownText.kt", "cat": "UI · Markdown", "order": 33, "start": 82, "end": 134, "kind": "fun", "name": "androidx.compose.ui.text.AnnotatedString.Builder.parseInline", "owner": "", "sig": "private fun androidx.compose.ui.text.AnnotatedString.Builder.parseInline(", "tech": [], "sum": {"ru": "Разбирает инлайн-форматирование (**жирный**, *курсив*, `код`).", "en": "Parses inline formatting (**bold**, *italic*, `code`).", "de": "Parst Inline-Formatierung (**fett**, *kursiv*, `code`)."}, "code": "private fun androidx.compose.ui.text.AnnotatedString.Builder.parseInline(\n    text: String,\n    baseColor: Color\n) {\n    var i = 0\n    while (i < text.length) {\n        when {\n            // Bold **text**\n            i + 1 < text.length && text[i] == '*' && text[i + 1] == '*' -> {\n                val end = text.indexOf(\"**\", i + 2)\n                if (end > 0) {\n                    withStyle(SpanStyle(fontWeight = FontWeight.Bold, color = baseColor)) {\n                        append(text.substring(i + 2, end))\n                    }\n                    i = end + 2\n                } else {\n                    append(text[i])\n                    i++\n                }\n            }\n            // Italic *text*\n            text[i] == '*' && (i + 1 < text.length && text[i + 1] != '*') -> {\n                val end = text.indexOf('*', i + 1)\n                if (end > 0) {\n                    withStyle(SpanStyle(fontStyle = FontStyle.Italic, color = baseColor)) {\n                        append(text.substring(i + 1, end))\n                    }\n                    i = end + 1\n                } else {\n                    append(text[i])\n                    i++\n                }\n            }\n            // Inline code `text`\n            text[i] == '`' -> {\n                val end = text.indexOf('`', i + 1)\n                if (end > 0) {\n                    withStyle(SpanStyle(fontFamily = FontFamily.Monospace, background = Color(0xFFE0E0E0), color = Color.Black)) {\n                        append(text.substring(i + 1, end))\n                    }\n                    i = end + 1\n                } else {\n                    append(text[i])\n                    i++\n                }\n            }\n            else -> {\n                append(text[i])\n                i++\n            }\n        }\n    }\n}"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/components/MarkdownMessage.kt", "cat": "UI · Markdown", "order": 34, "start": 46, "end": 71, "kind": "fun", "name": "MarkdownMessage", "owner": "", "sig": "fun MarkdownMessage(", "tech": [], "sum": {"ru": "Сообщение с блоками кода и подсветкой синтаксиса.", "en": "Message with fenced code blocks and syntax highlighting.", "de": "Nachricht mit Codeblöcken und Syntaxhervorhebung."}, "code": "fun MarkdownMessage(\n    text: String,\n    textColor: Color,\n    l: (String) -> String,\n    modifier: Modifier = Modifier\n) {\n    val segments = remember(text) { splitCodeFences(text) }\n    Column(modifier = modifier) {\n        segments.forEachIndexed { i, seg ->\n            val topPad = if (i == 0) Modifier else Modifier.padding(top = 8.dp)\n            when (seg) {\n                is Segment.Text -> MarkdownText(\n                    text = seg.content,\n                    textColor = textColor,\n                    modifier = topPad\n                )\n                is Segment.Code -> CodeBlock(\n                    code = seg.code,\n                    language = seg.language,\n                    l = l,\n                    modifier = topPad\n                )\n            }\n        }\n    }\n}"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/components/MarkdownMessage.kt", "cat": "UI · Markdown", "order": 34, "start": 73, "end": 73, "kind": "interface", "name": "Segment", "owner": "", "sig": "private sealed interface Segment {", "tech": [], "sum": {"ru": "Сегмент сообщения: текст или код.", "en": "Message segment: text or code.", "de": "Nachrichten-Segment: Text oder Code."}, "code": "private sealed interface Segment {"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/components/MarkdownMessage.kt", "cat": "UI · Markdown", "order": 34, "start": 74, "end": 74, "kind": "class", "name": "Text", "owner": "Segment", "sig": "data class Text(val content: String) : Segment", "tech": [], "sum": {"ru": "Класс Text", "en": "Class Text", "de": "Klasse Text"}, "code": "    data class Text(val content: String) : Segment"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/components/MarkdownMessage.kt", "cat": "UI · Markdown", "order": 34, "start": 75, "end": 78, "kind": "class", "name": "Code", "owner": "Segment", "sig": "data class Code(val language: String, val code: String) : Segment", "tech": [], "sum": {"ru": "Класс: локализация (en/ru/de)", "en": "Class: localization (en/ru/de)", "de": "Klasse: Lokalisierung (en/ru/de)"}, "code": "    data class Code(val language: String, val code: String) : Segment\n}\n\n/** Matches ```lang\\n ... ``` fences. */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/components/MarkdownMessage.kt", "cat": "UI · Markdown", "order": 34, "start": 79, "end": 79, "kind": "val", "name": "FENCE", "owner": "", "sig": "private val FENCE = Regex(\"```[ \\\\t]*([^\\\\n`]*)\\\\r?\\\\n?([\\\\s\\\\S]*?)```\")", "tech": ["regex"], "sum": {"ru": "обработка текста", "en": "text processing", "de": "Textverarbeitung"}, "code": "private val FENCE = Regex(\"```[ \\\\t]*([^\\\\n`]*)\\\\r?\\\\n?([\\\\s\\\\S]*?)```\")"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/components/MarkdownMessage.kt", "cat": "UI · Markdown", "order": 34, "start": 81, "end": 100, "kind": "fun", "name": "splitCodeFences", "owner": "", "sig": "private fun splitCodeFences(text: String): List<Segment> {", "tech": ["compose"], "sum": {"ru": "Делит текст на обычные и кодовые сегменты.", "en": "Splits text into plain and code segments.", "de": "Teilt Text in einfache und Code-Segmente."}, "code": "private fun splitCodeFences(text: String): List<Segment> {\n    val out = mutableListOf<Segment>()\n    var last = 0\n    for (m in FENCE.findAll(text)) {\n        if (m.range.first > last) {\n            val t = text.substring(last, m.range.first).trim('\\n')\n            if (t.isNotBlank()) out.add(Segment.Text(t))\n        }\n        out.add(Segment.Code(language = m.groupValues[1].trim(), code = m.groupValues[2].trimEnd('\\n')))\n        last = m.range.last + 1\n    }\n    if (last < text.length) {\n        val t = text.substring(last).trim('\\n')\n        if (t.isNotBlank()) out.add(Segment.Text(t))\n    }\n    if (out.isEmpty()) out.add(Segment.Text(text))\n    return out\n}\n\n@Composable"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/components/MarkdownMessage.kt", "cat": "UI · Markdown", "order": 34, "start": 101, "end": 175, "kind": "fun", "name": "CodeBlock", "owner": "", "sig": "private fun CodeBlock(", "tech": ["compose", "coroutines"], "sum": {"ru": "Блок кода: язык, подсветка и кнопка копирования.", "en": "Code block: language, highlighting and copy button.", "de": "Codeblock: Sprache, Hervorhebung und Kopierknopf."}, "code": "private fun CodeBlock(\n    code: String,\n    language: String,\n    l: (String) -> String,\n    modifier: Modifier = Modifier\n) {\n    val clipboard = LocalClipboardManager.current\n    val scope = rememberCoroutineScope()\n    var copied by remember { mutableStateOf(false) }\n    val highlighted = remember(code, language) { highlightCode(code, language) }\n\n    Column(\n        modifier = modifier\n            .fillMaxWidth()\n            .clip(RoundedCornerShape(8.dp))\n            .background(CodeBackground)\n    ) {\n        Row(\n            modifier = Modifier\n                .fillMaxWidth()\n                .padding(start = 10.dp, end = 2.dp),\n            verticalAlignment = Alignment.CenterVertically\n        ) {\n            Text(\n                text = language.ifBlank { \"code\" },\n                color = CodeMuted,\n                style = MaterialTheme.typography.labelSmall,\n                modifier = Modifier.weight(1f)\n            )\n            IconButton(\n                onClick = {\n                    clipboard.setText(AnnotatedString(code))\n                    copied = true\n                    scope.launch {\n                        delay(1500)\n                        copied = false\n                    }\n                },\n                modifier = Modifier.size(30.dp)\n            ) {\n                Icon(\n                    imageVector = if (copied) Icons.Default.Check else Icons.Default.ContentCopy,\n                    contentDescription = if (copied) l(\"copied\") else l(\"copy\"),\n                    tint = if (copied) CodeAccent else CodeMuted,\n                    modifier = Modifier.size(15.dp)\n                )\n            }\n        }\n        Box(\n            modifier = Modifier\n                .fillMaxWidth()\n                .horizontalScroll(rememberScrollState())\n        ) {\n            Text(\n                text = highlighted,\n                color = CodeText,\n                style = MaterialTheme.typography.bodySmall.copy(\n                    fontFamily = FontFamily.Monospace,\n                    fontSize = 13.sp\n                ),\n                modifier = Modifier.padding(start = 10.dp, end = 12.dp, top = 2.dp, bottom = 10.dp)\n            )\n        }\n    }\n}\n\nprivate val CodeBackground = Color(0xFF1E1E1E)\nprivate val CodeText = Color(0xFFE6E6E6)\nprivate val CodeMuted = Color(0xFF9AA0A6)\nprivate val CodeAccent = Color(0xFF7FD4C1)\n\nprivate val STYLE_COMMENT = SpanStyle(color = Color(0xFF6A9955))\nprivate val STYLE_STRING = SpanStyle(color = Color(0xFFCE9178))\nprivate val STYLE_NUMBER = SpanStyle(color = Color(0xFFB5CEA8))\nprivate val STYLE_KEYWORD = SpanStyle(color = Color(0xFF569CD6))"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/components/MarkdownMessage.kt", "cat": "UI · Markdown", "order": 34, "start": 177, "end": 191, "kind": "val", "name": "KEYWORDS", "owner": "", "sig": "private val KEYWORDS = setOf(", "tech": [], "sum": {"ru": "Константа KEYWORDS", "en": "Constant KEYWORDS", "de": "Konstante KEYWORDS"}, "code": "private val KEYWORDS = setOf(\n    \"if\", \"else\", \"elif\", \"for\", \"while\", \"do\", \"switch\", \"case\", \"default\", \"break\",\n    \"continue\", \"return\", \"def\", \"function\", \"fn\", \"fun\", \"class\", \"struct\", \"enum\",\n    \"interface\", \"object\", \"new\", \"delete\", \"import\", \"from\", \"package\", \"include\", \"define\",\n    \"public\", \"private\", \"protected\", \"internal\", \"static\", \"final\", \"const\", \"val\", \"var\",\n    \"let\", \"void\", \"int\", \"float\", \"double\", \"char\", \"bool\", \"boolean\", \"long\", \"short\",\n    \"unsigned\", \"signed\", \"string\", \"str\", \"true\", \"false\", \"null\", \"nil\", \"none\", \"None\",\n    \"True\", \"False\", \"and\", \"or\", \"not\", \"in\", \"is\", \"as\", \"try\", \"catch\", \"except\",\n    \"finally\", \"throw\", \"throws\", \"raise\", \"with\", \"yield\", \"async\", \"await\", \"lambda\",\n    \"this\", \"self\", \"super\", \"extends\", \"implements\", \"override\", \"abstract\", \"sealed\", \"data\",\n    \"when\", \"match\", \"type\", \"sizeof\", \"namespace\", \"using\", \"template\", \"typename\", \"auto\",\n    \"extern\", \"inline\", \"register\", \"volatile\", \"goto\", \"echo\", \"print\", \"end\", \"then\",\n    \"begin\", \"module\", \"where\", \"select\", \"insert\", \"update\", \"join\", \"on\", \"group\", \"order\",\n    \"by\", \"having\", \"suspend\", \"companion\", \"trait\", \"impl\"\n)"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/components/MarkdownMessage.kt", "cat": "UI · Markdown", "order": 34, "start": 193, "end": 197, "kind": "val", "name": "HASH_COMMENT_LANGS", "owner": "", "sig": "private val HASH_COMMENT_LANGS = setOf(", "tech": [], "sum": {"ru": "Константа HASH_COMMENT_LANGS", "en": "Constant HASH_COMMENT_LANGS", "de": "Konstante HASH_COMMENT_LANGS"}, "code": "private val HASH_COMMENT_LANGS = setOf(\n    \"py\", \"python\", \"sh\", \"bash\", \"shell\", \"zsh\", \"yml\", \"yaml\", \"rb\", \"ruby\", \"toml\", \"conf\"\n)\n\nprivate val regexCache = mutableMapOf<String, Regex>()"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/components/MarkdownMessage.kt", "cat": "UI · Markdown", "order": 34, "start": 199, "end": 208, "kind": "fun", "name": "tokenRegex", "owner": "", "sig": "private fun tokenRegex(language: String): Regex {", "tech": ["regex"], "sum": {"ru": "обработка текста; локализация (en/ru/de)", "en": "text processing; localization (en/ru/de)", "de": "Textverarbeitung; Lokalisierung (en/ru/de)"}, "code": "private fun tokenRegex(language: String): Regex {\n    val hashPart = if (language.lowercase() in HASH_COMMENT_LANGS) \"#[^\\\\n]*|\" else \"\"\n    return Regex(\n        \"(${hashPart}//[^\\\\n]*|/\\\\*[\\\\s\\\\S]*?\\\\*/)\" + // 1 comment\n            \"|(\\\"(?:\\\\\\\\.|[^\\\"\\\\\\\\])*\\\")\" +           // 2 double-quoted string\n            \"|('(?:\\\\\\\\.|[^'\\\\\\\\])*')\" +              // 3 single-quoted string\n            \"|(\\\\b\\\\d+(?:\\\\.\\\\d+)?\\\\b)\" +             // 4 number\n            \"|([A-Za-z_][A-Za-z0-9_]*)\"               // 5 identifier/keyword\n    )\n}"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/components/MarkdownMessage.kt", "cat": "UI · Markdown", "order": 34, "start": 210, "end": 229, "kind": "fun", "name": "highlightCode", "owner": "", "sig": "private fun highlightCode(code: String, language: String): AnnotatedString {", "tech": ["regex"], "sum": {"ru": "Токенизирует код для цветовой подсветки.", "en": "Tokenizes code for colour highlighting.", "de": "Tokenisiert Code für die Farbehervorhebung."}, "code": "private fun highlightCode(code: String, language: String): AnnotatedString {\n    val regex = regexCache.getOrPut(language.lowercase()) { tokenRegex(language) }\n    return buildAnnotatedString {\n        var index = 0\n        for (m in regex.findAll(code)) {\n            if (m.range.first > index) append(code.substring(index, m.range.first))\n            val text = m.value\n            val style = when {\n                m.groups[1] != null -> STYLE_COMMENT\n                m.groups[2] != null || m.groups[3] != null -> STYLE_STRING\n                m.groups[4] != null -> STYLE_NUMBER\n                m.groups[5] != null && text in KEYWORDS -> STYLE_KEYWORD\n                else -> null\n            }\n            if (style != null) withStyle(style) { append(text) } else append(text)\n            index = m.range.last + 1\n        }\n        if (index < code.length) append(code.substring(index))\n    }\n}"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/components/DrawerContent.kt", "cat": "UI · Drawer", "order": 35, "start": 36, "end": 139, "kind": "fun", "name": "DrawerContent", "owner": "", "sig": "fun DrawerContent(", "tech": ["compose"], "sum": {"ru": "Боковое меню: новый чат, модели, настройки, история.", "en": "Drawer: new chat, models, settings, history.", "de": "Drawer: neuer Chat, Modelle, Einstellungen, Verlauf."}, "code": "fun DrawerContent(\n    sessions: List<ChatSession>,\n    currentSessionId: String?,\n    l: (String) -> String,\n    onNewChat: () -> Unit,\n    onSelectSession: (String) -> Unit,\n    onDeleteSession: (String) -> Unit,\n    onOpenModels: () -> Unit,\n    onOpenSettings: () -> Unit\n) {\n    Column(modifier = Modifier.padding(16.dp)) {\n        Text(\n            text = l(\"app_name\"),\n            style = MaterialTheme.typography.headlineSmall,\n            modifier = Modifier.padding(bottom = 16.dp)\n        )\n\n        // New chat\n        Row(\n            modifier = Modifier\n                .fillMaxWidth()\n                .clickable { onNewChat() }\n                .padding(vertical = 12.dp),\n            verticalAlignment = Alignment.CenterVertically\n        ) {\n            Icon(Icons.Default.Add, contentDescription = null)\n            Spacer(modifier = Modifier.width(12.dp))\n            Text(l(\"new_chat\"), style = MaterialTheme.typography.bodyLarge)\n        }\n\n        // Models\n        Row(\n            modifier = Modifier\n                .fillMaxWidth()\n                .clickable { onOpenModels() }\n                .padding(vertical = 12.dp),\n            verticalAlignment = Alignment.CenterVertically\n        ) {\n            Icon(Icons.Default.Storage, contentDescription = null)\n            Spacer(modifier = Modifier.width(12.dp))\n            Text(l(\"models\"), style = MaterialTheme.typography.bodyLarge)\n        }\n\n        // Settings\n        Row(\n            modifier = Modifier\n                .fillMaxWidth()\n                .clickable { onOpenSettings() }\n                .padding(vertical = 12.dp),\n            verticalAlignment = Alignment.CenterVertically\n        ) {\n            Icon(Icons.Default.Settings, contentDescription = null)\n            Spacer(modifier = Modifier.width(12.dp))\n            Text(l(\"settings\"), style = MaterialTheme.typography.bodyLarge)\n        }\n\n        HorizontalDivider(modifier = Modifier.padding(vertical = 8.dp))\n\n        Text(\n            text = l(\"chat_history\"),\n            style = MaterialTheme.typography.titleSmall,\n            color = MaterialTheme.colorScheme.onSurfaceVariant,\n            modifier = Modifier.padding(bottom = 8.dp)\n        )\n\n        LazyColumn(\n            verticalArrangement = Arrangement.spacedBy(4.dp)\n        ) {\n            items(sessions) { session ->\n                Row(\n                    modifier = Modifier\n                        .fillMaxWidth()\n                        .clickable { onSelectSession(session.id) }\n                        .padding(vertical = 8.dp),\n                    verticalAlignment = Alignment.CenterVertically\n                ) {\n                    Column(modifier = Modifier.weight(1f)) {\n                        Text(\n                            text = session.title,\n                            style = MaterialTheme.typography.bodyMedium,\n                            maxLines = 1,\n                            overflow = TextOverflow.Ellipsis,\n                            color = if (session.id == currentSessionId)\n                                MaterialTheme.colorScheme.primary\n                            else MaterialTheme.colorScheme.onSurface\n                        )\n                        Text(\n                            text = formatDate(session.createdAt),\n                            style = MaterialTheme.typography.bodySmall,\n                            color = MaterialTheme.colorScheme.onSurfaceVariant\n                        )\n                    }\n                    IconButton(onClick = { onDeleteSession(session.id) }) {\n                        Icon(\n                            Icons.Default.Delete,\n                            contentDescription = l(\"delete_chat\"),\n                            tint = MaterialTheme.colorScheme.error\n                        )\n                    }\n                }\n            }\n        }\n    }\n}"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/components/DrawerContent.kt", "cat": "UI · Drawer", "order": 35, "start": 141, "end": 144, "kind": "fun", "name": "formatDate", "owner": "", "sig": "private fun formatDate(timestamp: Long): String {", "tech": [], "sum": {"ru": "Функция formatDate", "en": "Function formatDate", "de": "Funktion formatDate"}, "code": "private fun formatDate(timestamp: Long): String {\n    val sdf = SimpleDateFormat(\"dd MMM, HH:mm\", Locale.getDefault())\n    return sdf.format(Date(timestamp))\n}"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/theme/Theme.kt", "cat": "UI · Theme", "order": 40, "start": 15, "end": 15, "kind": "class", "name": "AppTheme", "owner": "", "sig": "enum class AppTheme { LIGHT, DARK, GREEN, ORANGE, LIGHT_BLUE, YELLOW }", "tech": [], "sum": {"ru": "Перечисление 6 тем приложения.", "en": "Enum of the 6 app themes.", "de": "Enum der 6 App-Themes."}, "code": "enum class AppTheme { LIGHT, DARK, GREEN, ORANGE, LIGHT_BLUE, YELLOW }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/theme/Theme.kt", "cat": "UI · Theme", "order": 40, "start": 17, "end": 21, "kind": "val", "name": "LightColorScheme", "owner": "", "sig": "private val LightColorScheme = lightColorScheme(", "tech": [], "sum": {"ru": "тема и цвета", "en": "theme and colors", "de": "Theme und Farben"}, "code": "private val LightColorScheme = lightColorScheme(\n    primary = Color(0xFF6650a4),\n    secondary = Color(0xFF625b71),\n    tertiary = Color(0xFF7D5260)\n)"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/theme/Theme.kt", "cat": "UI · Theme", "order": 40, "start": 23, "end": 27, "kind": "val", "name": "DarkColorScheme", "owner": "", "sig": "private val DarkColorScheme = darkColorScheme(", "tech": [], "sum": {"ru": "тема и цвета", "en": "theme and colors", "de": "Theme und Farben"}, "code": "private val DarkColorScheme = darkColorScheme(\n    primary = Color(0xFFD0BCFF),\n    secondary = Color(0xFFCCC2DC),\n    tertiary = Color(0xFFEFB8C8)\n)"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/theme/Theme.kt", "cat": "UI · Theme", "order": 40, "start": 29, "end": 33, "kind": "val", "name": "GreenColorScheme", "ow         \"inactively\" to \"Неактивно\",\n            \"energetically\" to \"Энергично\",\n            \"lethargically\" to \"Вяло\",\n            \"vigorously\" to \"Бодро\",\n            \"listlessly\" to \"Вяло\",\n            \"dynamically\" to \"Динамично\",\n            \"statically\" to \"Статично\",\n            \"kinetically\" to \"Кинетично\",\n            \"potentially\" to \"Потенциально\",\n            \"essentially\" to \"По сути\",\n            \"basically\" to \"В основном\",\n            \"fundamentally\" to \"Фундаментально\",\n            \"primarily\" to \"В первую очередь\",\n            \"secondarily\" to \"Во вторую очередь\",\n            \"chiefly\" to \"Главным образом\",\n            \"principally\" to \"В основном\",\n            \"largely\" to \"В значительной степени\",\n            \"partially\" to \"Частично\",\n            \"wholly\" to \"Полностью\",\n            \"entirely\" to \"Полностью\",\n            \"utterly\" to \"Совершенно\",\n            \"thoroughly\" to \"Тщательно\",\n            \"exhaustively\" to \"Исчерпывающе\",\n            \"comprehensively\" to \"Всесторонне\",\n            \"extensively\" to \"Широко\",\n            \"intensively\" to \"Интенсивно\",\n            \"in-depth\" to \"Глубоко\",\n            \"superficially\" to \"Поверхностно\",\n            \"cursorily\" to \"Бегло\",\n            \"lengthily\" to \"Долго\",\n            \"prolongedly\" to \"Долго\",\n            \"endlessly\" to \"Бесконечно\",\n            \"ceaselessly\" to \"Непрестанно\",\n            \"incessantly\" to \"Непрестанно\",\n            \"unceasingly\" to \"Непрестанно\",\n            \"interminably\" to \"Бесконечно\",\n            \"eternally\" to \"Вечно\",\n            \"irrevocably\" to \"Безвозвратно\",\n            \"irreversibly\" to \"Необратимо\",\n            \"irreparably\" to \"Непоправимо\",\n            \"irremediably\" to \"Безнадёжно\",\n            \"irretrievably\" to \"Безвозвратно\",\n            \"irrecoverably\" to \"Безвозвратно\",\n            \"irredeemably\" to \"Безнадёжно\",\n            \"unalterably\" to \"Неизменно\",\n            \"unchangeably\" to \"Неизменно\",\n            \"immutably\" to \"Неизменно\",\n            \"invariably\" to \"Неизменно\",\n            \"lastingly\" to \"Долговечно\",\n            \"enduringly\" to \"Долговечно\",\n            \"perennially\" to \"Ежегодно\",\n            \"everlastingly\" to \"Вечно\",\n            \"infinitely\" to \"Бесконечно\",\n            \"boundlessly\" to \"Безгранично\",\n            \"limitlessly\" to \"Безгранично\",\n            \"inexhaustibly\" to \"Неисчерпаемо\"\n        )\n    )"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/theme/Localization.kt", "cat": "i18n", "order": 43, "start": 1793, "end": 1797, "kind": "fun", "name": "getString", "owner": "Localization", "sig": "fun getString(key: String, lang: String): String {", "tech": [], "sum": {"ru": "Ищет строку по ключу и языку (fallback en).", "en": "Looks up a string by key and language (fallback en).", "de": "Sucht einen String per Schlüssel und Sprache (Fallback en)."}, "code": "    fun getString(key: String, lang: String): String {\n        val selectedLang = if (translations.containsKey(lang)) lang else \"en\"\n        return translations[selectedLang]?.get(key) ?: translations[\"en\"]?.get(key) ?: key\n    }\n}"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/chat/ChatRepository.kt", "cat": "Data · Chat", "order": 50, "start": 18, "end": 32, "kind": "class", "name": "ChatRepository", "owner": "", "sig": "class ChatRepository(private val context: Context) {", "tech": ["flow", "fileio"], "sum": {"ru": "Сессии и документы в files/sessions/*.json.", "en": "Sessions and documents in files/sessions/*.json.", "de": "Sitzungen und Dokumente in files/sessions/*.json."}, "code": "class ChatRepository(private val context: Context) {\n    private val TAG = \"ChatRepository\"\n\n    private val _sessions = MutableStateFlow<List<ChatSession>>(emptyList())\n    val sessions: StateFlow<List<ChatSession>> = _sessions.asStateFlow()\n\n    private val _currentSessionId = MutableStateFlow<String?>(null)\n    val currentSessionId: StateFlow<String?> = _currentSessionId.asStateFlow()\n\n    private val sessionsDir: File\n        get() = File(context.filesDir, \"sessions\").also { if (!it.exists()) it.mkdirs() }\n\n    init {\n        loadSessions()\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/chat/ChatRepository.kt", "cat": "Data · Chat", "order": 50, "start": 34, "end": 49, "kind": "fun", "name": "loadSessions", "owner": "ChatRepository", "sig": "private fun loadSessions() {", "tech": ["fileio"], "sum": {"ru": "Читает все *.json сессий с диска.", "en": "Reads all session *.json files from disk.", "de": "Liest alle Session-*.json-Dateien von der Platte."}, "code": "    private fun loadSessions() {\n        try {\n            val files = sessionsDir.listFiles { f -> f.extension == \"json\" } ?: emptyArray()\n            val list = files.mapNotNull { file ->\n                try {\n                    parseSession(file.readText())\n                } catch (e: Exception) {\n                    Log.e(TAG, \"Failed to parse session: ${file.name}\", e)\n                    null\n                }\n            }.sortedByDescending { it.createdAt }\n            _sessions.value = list\n        } catch (e: Exception) {\n            Log.e(TAG, \"Failed to load sessions\", e)\n        }\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/chat/ChatRepository.kt", "cat": "Data · Chat", "order": 50, "start": 51, "end": 75, "kind": "fun", "name": "parseSession", "owner": "ChatRepository", "sig": "private fun parseSession(json: String): ChatSession {", "tech": ["json"], "sum": {"ru": "разбор/сборка JSON", "en": "JSON parse/build", "de": "JSON-Parsing/Aufbau"}, "code": "    private fun parseSession(json: String): ChatSession {\n        val o = JSONObject(json)\n        val arr = o.getJSONArray(\"messages\")\n        val messages = mutableListOf<ChatMessage>()\n        for (i in 0 until arr.length()) {\n            val m = arr.getJSONObject(i)\n            messages.add(\n                ChatMessage(\n                    role = m.getString(\"role\"),\n                    content = m.getString(\"content\"),\n                    timestamp = m.optLong(\"timestamp\", System.currentTimeMillis()),\n                    imagePath = m.optString(\"imagePath\", \"\").ifBlank { null },\n                    generationMs = m.optLong(\"generationMs\", 0L),\n                    tokenCount = m.optInt(\"tokenCount\", 0)\n                )\n            )\n        }\n        return ChatSession(\n            id = o.getString(\"id\"),\n            title = o.optString(\"title\", \"New Chat\"),\n            createdAt = o.optLong(\"createdAt\", System.currentTimeMillis()),\n            messages = messages,\n            documents = parseDocuments(o)\n        )\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/chat/ChatRepository.kt", "cat": "Data · Chat", "order": 50, "start": 77, "end": 97, "kind": "fun", "name": "parseDocuments", "owner": "ChatRepository", "sig": "private fun parseDocuments(o: JSONObject): List<SessionDocument> {", "tech": ["json"], "sum": {"ru": "разбор/сборка JSON; генерация идентификаторов", "en": "JSON parse/build; ID generation", "de": "JSON-Parsing/Aufbau; ID-Erzeugung"}, "code": "    private fun parseDocuments(o: JSONObject): List<SessionDocument> {\n        val arr = o.optJSONArray(\"documents\") ?: return emptyList()\n        val docs = mutableListOf<SessionDocument>()\n        for (i in 0 until arr.length()) {\n            val d = arr.optJSONObject(i) ?: continue\n            val text = d.optString(\"text\", \"\")\n            if (text.isEmpty() && d.optString(\"name\", \"\").isEmpty()) continue\n            docs.add(\n                SessionDocument(\n                    id = d.optString(\"id\", UUID.randomUUID().toString()),\n                    name = d.optString(\"name\", \"document\"),\n                    ext = d.optString(\"ext\", \"\"),\n                    sizeBytes = d.optLong(\"sizeBytes\", 0L),\n                    text = text,\n                    truncated = d.optBoolean(\"truncated\", false),\n                    addedAt = d.optLong(\"addedAt\", System.currentTimeMillis())\n                )\n            )\n        }\n        return docs\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/chat/ChatRepository.kt", "cat": "Data · Chat", "order": 50, "start": 99, "end": 135, "kind": "fun", "name": "saveSession", "owner": "ChatRepository", "sig": "private fun saveSession(session: ChatSession) {", "tech": ["json", "fileio"], "sum": {"ru": "Сохраняет сессию в JSON-файл.", "en": "Writes a session to its JSON file.", "de": "Schreibt eine Sitzung in ihre JSON-Datei."}, "code": "    private fun saveSession(session: ChatSession) {\n        try {\n            val o = JSONObject()\n            o.put(\"id\", session.id)\n            o.put(\"title\", session.title)\n            o.put(\"createdAt\", session.createdAt)\n            val arr = JSONArray()\n            for (m in session.messages) {\n                val mo = JSONObject()\n                mo.put(\"role\", m.role)\n                mo.put(\"content\", m.content)\n                mo.put(\"timestamp\", m.timestamp)\n                if (!m.imagePath.isNullOrBlank()) mo.put(\"imagePath\", m.imagePath)\n                if (m.generationMs > 0) mo.put(\"generationMs\", m.generationMs)\n                if (m.tokenCount > 0) mo.put(\"tokenCount\", m.tokenCount)\n                arr.put(mo)\n            }\n            o.put(\"messages\", arr)\n\n            val docsArr = JSONArray()\n            for (d in session.documents) {\n                val dobj = JSONObject()\n                dobj.put(\"id\", d.id)\n                dobj.put(\"name\", d.name)\n                dobj.put(\"ext\", d.ext)\n                dobj.put(\"sizeBytes\", d.sizeBytes)\n                dobj.put(\"text\", d.text)\n                dobj.put(\"truncated\", d.truncated)\n                dobj.put(\"addedAt\", d.addedAt)\n                docsArr.put(dobj)\n            }\n            o.put(\"documents\", docsArr)\n            File(sessionsDir, \"${session.id}.json\").writeText(o.toString())\n        } catch (e: Exception) {\n            Log.e(TAG, \"Failed to save session: ${session.id}\", e)\n        }\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/chat/ChatRepository.kt", "cat": "Data · Chat", "order": 50, "start": 137, "end": 147, "kind": "fun", "name": "createSession", "owner": "ChatRepository", "sig": "fun createSession(): ChatSession {", "tech": [], "sum": {"ru": "Создаёт новую сессию и делает её текущей.", "en": "Creates a new session and makes it current.", "de": "Erzeugt eine neue Sitzung und macht sie aktuell."}, "code": "    fun createSession(): ChatSession {\n        val session = ChatSession(\n            id = UUID.randomUUID().toString(),\n            title = \"New Chat\",\n            messages = emptyList()\n        )\n        _sessions.value = listOf(session) + _sessions.value\n        _currentSessionId.value = session.id\n        saveSession(session)\n        return session\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/chat/ChatRepository.kt", "cat": "Data · Chat", "order": 50, "start": 149, "end": 151, "kind": "fun", "name": "selectSession", "owner": "ChatRepository", "sig": "fun selectSession(id: String) {", "tech": [], "sum": {"ru": "Функция selectSession", "en": "Function selectSession", "de": "Funktion selectSession"}, "code": "    fun selectSession(id: String) {\n        _currentSessionId.value = id\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/chat/ChatRepository.kt", "cat": "Data · Chat", "order": 50, "start": 153, "end": 156, "kind": "fun", "name": "getCurrentSession", "owner": "ChatRepository", "sig": "fun getCurrentSession(): ChatSession? {", "tech": [], "sum": {"ru": "Функция getCurrentSession", "en": "Function getCurrentSession", "de": "Funktion getCurrentSession"}, "code": "    fun getCurrentSession(): ChatSession? {\n        val id = _currentSessionId.value ?: return null\n        return _sessions.value.find { it.id == id }\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/chat/ChatRepository.kt", "cat": "Data · Chat", "order": 50, "start": 158, "end": 175, "kind": "fun", "name": "addMessage", "owner": "ChatRepository", "sig": "suspend fun addMessage(sessionId: String, message: ChatMessage) = withContext(Dispatchers.IO) {", "tech": ["coroutines"], "sum": {"ru": "Добавляет сообщение и авто-заголовок сессии.", "en": "Appends a message and auto-titles the session.", "de": "Hängt eine Nachricht an und vergibt einen Auto-Titel."}, "code": "    suspend fun addMessage(sessionId: String, message: ChatMessage) = withContext(Dispatchers.IO) {\n        val session = _sessions.value.find { it.id == sessionId } ?: return@withContext\n        val updatedMessages = session.messages + message\n\n        // Auto-generate title from first user message\n        val updatedTitle = if (session.title == \"New Chat\" && message.role == \"user\") {\n            message.content.take(40).replace(\"\\n\", \" \") + if (message.content.length > 40) \"...\" else \"\"\n        } else {\n            session.title\n        }\n\n        val updated = session.copy(\n            messages = updatedMessages,\n            title = updatedTitle\n        )\n        _sessions.value = _sessions.value.map { if (it.id == sessionId) updated else it }\n        saveSession(updated)\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/chat/ChatRepository.kt", "cat": "Data · Chat", "order": 50, "start": 177, "end": 182, "kind": "fun", "name": "addDocument", "owner": "ChatRepository", "sig": "suspend fun addDocument(sessionId: String, document: SessionDocument) = withContext(Dispatchers.IO) {", "tech": ["coroutines"], "sum": {"ru": "асинхронные корутины", "en": "async coroutines", "de": "asynchrone Coroutinen"}, "code": "    suspend fun addDocument(sessionId: String, document: SessionDocument) = withContext(Dispatchers.IO) {\n        val session = _sessions.value.find { it.id == sessionId } ?: return@withContext\n        val updated = session.copy(documents = session.documents + document)\n        _sessions.value = _sessions.value.map { if (it.id == sessionId) updated else it }\n        saveSession(updated)\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/chat/ChatRepository.kt", "cat": "Data · Chat", "order": 50, "start": 184, "end": 189, "kind": "fun", "name": "removeDocument", "owner": "ChatRepository", "sig": "suspend fun removeDocument(sessionId: String, documentId: String) = withContext(Dispatchers.IO) {", "tech": ["coroutines"], "sum": {"ru": "асинхронные корутины", "en": "async coroutines", "de": "asynchrone Coroutinen"}, "code": "    suspend fun removeDocument(sessionId: String, documentId: String) = withContext(Dispatchers.IO) {\n        val session = _sessions.value.find { it.id == sessionId } ?: return@withContext\n        val updated = session.copy(documents = session.documents.filterNot { it.id == documentId })\n        _sessions.value = _sessions.value.map { if (it.id == sessionId) updated else it }\n        saveSession(updated)\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/chat/ChatRepository.kt", "cat": "Data · Chat", "order": 50, "start": 191, "end": 197, "kind": "fun", "name": "deleteSession", "owner": "ChatRepository", "sig": "fun deleteSession(id: String) {", "tech": ["fileio"], "sum": {"ru": "файловый ввод-вывод", "en": "file I/O", "de": "Datei-E/A"}, "code": "    fun deleteSession(id: String) {\n        File(sessionsDir, \"$id.json\").delete()\n        _sessions.value = _sessions.value.filter { it.id != id }\n        if (_currentSessionId.value == id) {\n            _currentSessionId.value = null\n        }\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/chat/ChatRepository.kt", "cat": "Data · Chat", "order": 50, "start": 199, "end": 204, "kind": "fun", "name": "clearAll", "owner": "ChatRepository", "sig": "fun clearAll() {", "tech": ["fileio"], "sum": {"ru": "файловый ввод-вывод", "en": "file I/O", "de": "Datei-E/A"}, "code": "    fun clearAll() {\n        sessionsDir.listFiles()?.forEach { it.delete() }\n        _sessions.value = emptyList()\n        _currentSessionId.value = null\n    }\n}"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/chat/DocumentReader.kt", "cat": "Data · Chat", "order": 51, "start": 9, "end": 9, "kind": "class", "name": "DocumentException", "owner": "", "sig": "class DocumentException(val messageKey: String) : Exception(messageKey)", "tech": [], "sum": {"ru": "Ошибка чтения документа.", "en": "Document read error.", "de": "Fehler beim Lesen des Dokuments."}, "code": "class DocumentException(val messageKey: String) : Exception(messageKey)"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/chat/DocumentReader.kt", "cat": "Data · Chat", "order": 51, "start": 11, "end": 23, "kind": "class", "name": "RawDocument", "owner": "", "sig": "data class RawDocument(", "tech": [], "sum": {"ru": "Прочитанный документ до обрезки.", "en": "A document read before trimming.", "de": "Ein gelesenes Dokument vor dem Kürzen."}, "code": "data class RawDocument(\n    val name: String,\n    val ext: String,\n    val sizeBytes: Long,\n    val text: String\n)\n\n/**\n * Reads a user-picked document and prepares its text for the chat context.\n *\n * Supports plain-text-like formats only; HTML is reduced to visible text.\n * The document text is truncated elsewhere against the model context budget.\n */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/chat/DocumentReader.kt", "cat": "Data · Chat", "order": 51, "start": 24, "end": 24, "kind": "object", "name": "DocumentReader", "owner": "", "sig": "object DocumentReader {", "tech": [], "sum": {"ru": "Чтение txt/md/json/html/csv и обрезка под контекст.", "en": "Reads txt/md/json/html/csv and trims to the context.", "de": "Liest txt/md/json/html/csv und kürzt auf den Kontext."}, "code": "object DocumentReader {"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/chat/DocumentReader.kt", "cat": "Data · Chat", "order": 51, "start": 25, "end": 27, "kind": "val", "name": "ALLOWED_EXTENSIONS", "owner": "DocumentReader", "sig": "val ALLOWED_EXTENSIONS = setOf(\"txt\", \"md\", \"markdown\", \"json\", \"htm\", \"html\", \"csv\")", "tech": [], "sum": {"ru": "Константа ALLOWED_EXTENSIONS", "en": "Constant ALLOWED_EXTENSIONS", "de": "Konstante ALLOWED_EXTENSIONS"}, "code": "    val ALLOWED_EXTENSIONS = setOf(\"txt\", \"md\", \"markdown\", \"json\", \"htm\", \"html\", \"csv\")\n\n    /** Hard ceiling so a huge/binary file cannot exhaust memory. */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/chat/DocumentReader.kt", "cat": "Data · Chat", "order": 51, "start": 28, "end": 30, "kind": "val", "name": "MAX_READ_BYTES", "owner": "DocumentReader", "sig": "private const val MAX_READ_BYTES = 8 * 1024 * 1024", "tech": [], "sum": {"ru": "Константа MAX_READ_BYTES", "en": "Constant MAX_READ_BYTES", "de": "Konstante MAX_READ_BYTES"}, "code": "    private const val MAX_READ_BYTES = 8 * 1024 * 1024\n\n    /** Fraction of the context window reserved for document text. */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/chat/DocumentReader.kt", "cat": "Data · Chat", "order": 51, "start": 31, "end": 31, "kind": "val", "name": "CONTEXT_FRACTION", "owner": "DocumentReader", "sig": "private const val CONTEXT_FRACTION = 0.5", "tech": [], "sum": {"ru": "Константа CONTEXT_FRACTION", "en": "Constant CONTEXT_FRACTION", "de": "Konstante CONTEXT_FRACTION"}, "code": "    private const val CONTEXT_FRACTION = 0.5"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/chat/DocumentReader.kt", "cat": "Data · Chat", "order": 51, "start": 33, "end": 35, "kind": "fun", "name": "budgetTokens", "owner": "DocumentReader", "sig": "fun budgetTokens(contextLength: Int): Int = (contextLength * CONTEXT_FRACTION).toInt()", "tech": [], "sum": {"ru": "Считает бюджет токенов под документы.", "en": "Computes the token budget for documents.", "de": "Berechnet das Token-Budget für Dokumente."}, "code": "    fun budgetTokens(contextLength: Int): Int = (contextLength * CONTEXT_FRACTION).toInt()\n\n    /** Rough token estimate; Cyrillic tokenizes much worse than Latin. */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/chat/DocumentReader.kt", "cat": "Data · Chat", "order": 51, "start": 36, "end": 43, "kind": "fun", "name": "estimateTokens", "owner": "DocumentReader", "sig": "fun estimateTokens(text: String): Int {", "tech": [], "sum": {"ru": "Эвристика токенов (кириллица тяжелее).", "en": "Token heuristic (Cyrillic is heavier).", "de": "Token-Heuristik (Kyrillisch ist schwerer)."}, "code": "    fun estimateTokens(text: String): Int {\n        if (text.isEmpty()) return 0\n        var cyrillic = 0\n        for (c in text) if (c in '\\u0400'..'\\u04FF') cyrillic++\n        val cyrRatio = cyrillic.toDouble() / text.length\n        val charsPerToken = if (cyrRatio > 0.2) 1.8 else 3.5\n        return (text.length / charsPerToken).toInt() + 1\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/chat/DocumentReader.kt", "cat": "Data · Chat", "order": 51, "start": 45, "end": 55, "kind": "fun", "name": "charsPerToken", "owner": "DocumentReader", "sig": "private fun charsPerToken(text: String): Double {", "tech": [], "sum": {"ru": "Функция charsPerToken", "en": "Function charsPerToken", "de": "Funktion charsPerToken"}, "code": "    private fun charsPerToken(text: String): Double {\n        if (text.isEmpty()) return 3.5\n        var cyrillic =
