                          if (mmprojReady) append(\"👁 ${l(\"vision_ready\")} · $mmprojName\")\n                                        else append(l(\"text_only\"))\n                                        if (ctxSize > 0) append(\" · $ctxSize ctx\")\n                                    },\n                                    style = MaterialTheme.typography.bodySmall,\n                                    color = if (mmprojReady) MaterialTheme.colorScheme.primary\n                                    else MaterialTheme.colorScheme.onSurfaceVariant,\n                                    maxLines = 1,\n                                    overflow = TextOverflow.Ellipsis\n                                )\n                            }\n                        }\n                    },\n                    navigationIcon = {\n                        IconButton(onClick = onOpenDrawer) {\n                            Icon(Icons.Default.Menu, contentDescription = l(\"chat_history\"))\n                        }\n                    },\n                    colors = TopAppBarDefaults.topAppBarColors(\n                        containerColor = MaterialTheme.colorScheme.surface\n                    )\n                )\n            }\n        }\n    ) { paddingValues ->\n        Column(\n            modifier = Modifier\n                .fillMaxSize()\n                .padding(paddingValues)\n        ) {\n            // Loading progress overlay\n            AnimatedVisibility(\n                visible = modelState == ModelState.LOADING,\n                enter = fadeIn(),\n                exit = fadeOut()\n            ) {\n                Column(\n                    modifier = Modifier\n                        .fillMaxWidth()\n                        .padding(16.dp)\n                ) {\n                    LinearProgressIndicator(\n                        progress = { progress },\n                        modifier = Modifier.fillMaxWidth()\n                    )\n                    Spacer(modifier = Modifier.height(8.dp))\n                    Text(\n                        text = progressMessage,\n                        style = MaterialTheme.typography.bodySmall,\n                        color = MaterialTheme.colorScheme.onSurfaceVariant\n                    )\n                }\n            }\n\n            // Input at the top when configured; suggestions always stay at the bottom\n            if (inputAtTop) {\n                inputArea()\n            }\n\n            // Messages\n            Box(modifier = Modifier.weight(1f)) {\n                if (messages.isEmpty() && streamingText.isEmpty()) {\n                    // Empty state\n                    Column(\n                        modifier = Modifier\n                            .fillMaxSize()\n                            .padding(32.dp),\n                        horizontalAlignment = Alignment.CenterHorizontally,\n                        verticalArrangement = Arrangement.Center\n                    ) {\n                        Text(\n                            text = if (modelState == ModelState.LOADED) \"Start a conversation\" else \"Load a model to start chatting\",\n                            style = MaterialTheme.typography.bodyLarge,\n                            color = MaterialTheme.colorScheme.onSurfaceVariant,\n                            textAlign = TextAlign.Center\n                        )\n                    }\n                } else {\n                    LazyColumn(\n                        state = listState,\n                        modifier = Modifier.fillMaxSize(),\n                        contentPadding = PaddingValues(horizontal = 12.dp, vertical = 8.dp),\n                        verticalArrangement = Arrangement.spacedBy(8.dp)\n                    ) {\n                        items(messages) { message ->\n                            MessageBubble(message = message, l = l)\n                        }\n\n                        // Streaming message\n                        if (streamingText.isNotEmpty()) {\n                            item {\n                                MessageBubble(\n                                    message = ChatMessage(role = \"assistant\", content = streamingText),\n                                    l = l,\n                                    isStreaming = true\n                                )\n                            }\n                        }\n                    }\n                }\n            }\n\n            // Vision encoder feedback: encoding can take minutes, let the user cancel\n            AnimatedVisibility(visible = isPreparingVision, enter = fadeIn(), exit = fadeOut()) {\n                Row(\n                    modifier = Modifier\n                        .fillMaxWidth()\n                        .padding(horizontal = 12.dp, vertical = 4.dp),\n                    verticalAlignment = Alignment.CenterVertically\n                ) {\n                    CircularProgressIndicator(modifier = Modifier.size(16.dp), strokeWidth = 2.dp)\n                    Spacer(modifier = Modifier.width(8.dp))\n                    Text(\n                        text = l(\"preparing_image\"),\n                        style = MaterialTheme.typography.bodySmall,\n                        color = MaterialTheme.colorScheme.onSurfaceVariant,\n                        modifier = Modifier.weight(1f)\n                    )\n                    TextButton(onClick = { viewModel.stopGeneration() }) {\n                        Text(l(\"stop\"))\n                    }\n                }\n            }\n\n            // Suggestions always at the bottom (regardless of input position)\n            suggestionsArea()\n\n            // Input area at the bottom (only when not at the top)\n            if (!inputAtTop) {\n                inputArea()\n            }\n        }\n    }\n\n    // Documents panel (\"chat with docs\")\n    if (showDocsSheet) {\n        val docBudget = viewModel.documentBudgetTokens()\n        val docUsed = documents.sumOf { DocumentReader.estimateTokens(it.text) }\n        ModalBottomSheet(onDismissRequest = { showDocsSheet = false }) {\n            Column(\n                modifier = Modifier\n                    .fillMaxWidth()\n                    .padding(start = 16.dp, end = 16.dp, bottom = 24.dp)\n            ) {\n                Text(l(\"documents\"), style = MaterialTheme.typography.titleMedium)\n                Spacer(modifier = Modifier.height(4.dp))\n                Text(\n                    \"${l(\"docs_context_hint\")}: $docUsed / $docBudget\",\n                    style = MaterialTheme.typography.bodySmall,\n                    color = MaterialTheme.colorScheme.onSurfaceVariant\n                )\n                Spacer(modifier = Modifier.height(8.dp))\n\n                if (documents.isEmpty()) {\n                    Text(\n                        l(\"documents_empty\"),\n                        style = MaterialTheme.typography.bodySmall,\n                        color = MaterialTheme.colorScheme.onSurfaceVariant\n                    )\n                } else {\n                    LazyColumn(modifier = Modifier.heightIn(max = 300.dp)) {\n                        items(documents, key = { it.id }) { doc ->\n                            Row(\n                                modifier = Modifier\n                                    .fillMaxWidth()\n                                    .padding(vertical = 6.dp),\n                                verticalAlignment = Alignment.CenterVertically\n                            ) {\n                                Icon(\n                                    Icons.Default.Description,\n                                    contentDescription = null,\n                                    tint = MaterialTheme.colorScheme.primary\n                                )\n                                Spacer(modifier = Modifier.width(10.dp))\n                                Column(modifier = Modifier.weight(1f)) {\n                                    Text(\n                                        doc.name,\n                                        maxLines = 1,\n                                        overflow = TextOverflow.Ellipsis\n                                    )\n                                    Text(\n                                        buildString {\n                                            append(formatDocSize(doc.sizeBytes))\n                                            if (doc.truncated) {\n                                                append(\" · \").append(l(\"doc_truncated\"))\n                                            }\n                                        },\n                                        style = MaterialTheme.typography.bodySmall,\n                                        color = MaterialTheme.colorScheme.onSurfaceVariant\n                                    )\n                                }\n                                IconButton(onClick = { viewModel.removeDocument(doc.id) }) {\n                                    Icon(\n                                        Icons.Default.Delete,\n                                        contentDescription = l(\"remove_document\")\n                                    )\n                                }\n                            }\n                        }\n                    }\n                }\n\n                Spacer(modifier = Modifier.height(12.dp))\n                Button(\n                    onClick = { docPicker.launch(arrayOf(\"text/*\", \"application/json\")) },\n                    modifier = Modifier.fillMaxWidth()\n                ) {\n                    Icon(Icons.Default.AttachFile, contentDescription = null)\n                    Spacer(modifier = Modifier.width(8.dp))\n                    Text(l(\"add_document\"))\n                }\n                Spacer(modifier = Modifier.height(4.dp))\n                TextButton(\n                    onClick = { showDocsSheet = false },\n                    modifier = Modifier.fillMaxWidth()\n                ) {\n                    Text(l(\"close\"))\n                }\n            }\n        }\n    }\n}"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/screens/ChatScreen.kt", "cat": "UI · Chat", "order": 30, "start": 841, "end": 847, "kind": "fun", "name": "formatDocSize", "owner": "", "sig": "private fun formatDocSize(bytes: Long): String {", "tech": ["compose"], "sum": {"ru": "UI-компонент Compose", "en": "Compose UI component", "de": "Compose-UI-Komponente"}, "code": "private fun formatDocSize(bytes: Long): String {\n    val kb = bytes / 1024.0\n    return if (kb < 1024) String.format(\"%.1f KB\", kb)\n    else String.format(\"%.2f MB\", kb / 1024.0)\n}\n\n@Composable"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/screens/ChatScreen.kt", "cat": "UI · Chat", "order": 30, "start": 848, "end": 923, "kind": "fun", "name": "MessageBubble", "owner": "", "sig": "private fun MessageBubble(", "tech": ["compose", "bitmap", "fileio"], "sum": {"ru": "работа с изображением; файловый ввод-вывод; UI-компонент Compose", "en": "image handling; file I/O; Compose UI component", "de": "Bildverarbeitung; Datei-E/A; Compose-UI-Komponente"}, "code": "private fun MessageBubble(\n    message: ChatMessage,\n    l: (String) -> String,\n    isStreaming: Boolean = false\n) {\n    val isUser = message.role == \"user\"\n    val bubbleColor = if (isUser) UserBubble else AssistantBubble\n    val textColor = if (isUser) UserBubbleText else AssistantBubbleText\n\n    Row(\n        modifier = Modifier.fillMaxWidth(),\n        horizontalArrangement = if (isUser) Arrangement.End else Arrangement.Start\n    ) {\n        if (!isUser) {\n            // Avatar\n            Box(\n                modifier = Modifier\n                    .size(36.dp)\n                    .clip(CircleShape)\n                    .background(MaterialTheme.colorScheme.primary),\n                contentAlignment = Alignment.Center\n            ) {\n                Text(\"AI\", color = Color.White, style = MaterialTheme.typography.labelSmall)\n            }\n            Spacer(modifier = Modifier.width(8.dp))\n        }\n\n        Surface(\n            color = bubbleColor,\n            shape = RoundedCornerShape(\n                topStart = 16.dp,\n                topEnd = 16.dp,\n                bottomStart = if (isUser) 16.dp else 4.dp,\n                bottomEnd = if (isUser) 4.dp else 16.dp\n            ),\n            modifier = Modifier.widthIn(max = 300.dp)\n        ) {\n            Column {\n                message.imagePath?.let { path ->\n                    val bmp = remember(path) { BitmapFactory.decodeFile(path) }\n                    if (bmp != null) {\n                        Image(\n                            bitmap = bmp.asImageBitmap(),\n                            contentDescription = null,\n                            contentScale = ContentScale.Crop,\n                            modifier = Modifier\n                                .fillMaxWidth()\n                                .heightIn(max = 260.dp)\n                                .clip(\n                                    RoundedCornerShape(\n                                        topStart = 16.dp,\n                                        topEnd = 16.dp\n                                    )\n                                )\n                        )\n                    }\n                }\n                MarkdownMessage(\n                    text = message.content,\n                    textColor = textColor,\n                    l = l,\n                    modifier = Modifier.padding(horizontal = 12.dp, vertical = 8.dp)\n                )\n                if (!isUser && !isStreaming) {\n                    AnswerFooter(message = message, l = l)\n                }\n            }\n        }\n    }\n}\n\n/**\n * Footer shown at the end of every assistant answer: copy-to-clipboard, full\n * timestamp (date, time, seconds), generation time (mm:ss) and token speed.\n */\n@Composable"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/screens/ChatScreen.kt", "cat": "UI · Chat", "order": 30, "start": 924, "end": 974, "kind": "fun", "name": "AnswerFooter", "owner": "", "sig": "private fun AnswerFooter(message: ChatMessage, l: (String) -> String) {", "tech": ["compose", "coroutines"], "sum": {"ru": "тема и цвета", "en": "theme and colors", "de": "Theme und Farben"}, "code": "private fun AnswerFooter(message: ChatMessage, l: (String) -> String) {\n    val clipboard = LocalClipboardManager.current\n    val scope = rememberCoroutineScope()\n    var copied by remember { mutableStateOf(false) }\n    val fmt = remember { SimpleDateFormat(\"yyyy-MM-dd HH:mm:ss\", Locale.getDefault()) }\n    val timeText = remember(message.timestamp) { fmt.format(Date(message.timestamp)) }\n    val durationText = if (message.generationMs > 0) formatDuration(message.generationMs) else null\n    val speedText = if (message.generationMs > 0 && message.tokenCount > 0) {\n        String.format(Locale.US, \"%.1f t/s\", message.tokenCount * 1000.0 / message.generationMs)\n    } else null\n\n    Row(\n        modifier = Modifier\n            .fillMaxWidth()\n            .padding(start = 6.dp, end = 6.dp, bottom = 4.dp),\n        verticalAlignment = Alignment.CenterVertically\n    ) {\n        IconButton(\n            onClick = {\n                clipboard.setText(AnnotatedString(message.content))\n                copied = true\n                scope.launch {\n                    delay(1500)\n                    copied = false\n                }\n            },\n            modifier = Modifier.size(28.dp)\n        ) {\n            Icon(\n                imageVector = if (copied) Icons.Default.Check else Icons.Default.ContentCopy,\n                contentDescription = if (copied) l(\"copied\") else l(\"copy\"),\n                tint = if (copied) Color(0xFF7FD4C1) else AssistantFooterText,\n                modifier = Modifier.size(14.dp)\n            )\n        }\n        Spacer(modifier = Modifier.width(4.dp))\n        Text(\n            text = buildString {\n                append(timeText)\n                if (durationText != null) append(\" · \").append(durationText)\n                if (speedText != null) append(\" · \").append(speedText)\n            },\n            style = MaterialTheme.typography.labelSmall,\n            color = AssistantFooterText,\n            maxLines = 1,\n            overflow = TextOverflow.Ellipsis\n        )\n    }\n}\n\nprivate val AssistantFooterText = Color(0xFFB8B8B8)"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/screens/ChatScreen.kt", "cat": "UI · Chat", "order": 30, "start": 976, "end": 979, "kind": "fun", "name": "formatDuration", "owner": "", "sig": "private fun formatDuration(ms: Long): String {", "tech": [], "sum": {"ru": "Функция formatDuration", "en": "Function formatDuration", "de": "Funktion formatDuration"}, "code": "private fun formatDuration(ms: Long): String {\n    val totalSec = (ms / 1000).coerceAtLeast(1)\n    return String.format(Locale.US, \"%d:%02d\", totalSec / 60, totalSec % 60)\n}"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/screens/ModelPickerScreen.kt", "cat": "UI · Models", "order": 31, "start": 70, "end": 362, "kind": "fun", "name": "ModelPickerScreen", "owner": "", "sig": "fun ModelPickerScreen(", "tech": ["compose", "flow", "mtmd", "saf"], "sum": {"ru": "Список моделей: импорт, загрузка, поиск в HF, проекторы.", "en": "Model list: import, download, HF search, projectors.", "de": "Modellliste: Import, Download, HF-Suche, Projektoren."}, "code": "fun ModelPickerScreen(\n    viewModel: ChatViewModel,\n    onBack: () -> Unit\n) {\n    val lang by viewModel.appLanguage.collectAsState()\n    val l = { key: String -> Localization.getString(key, lang) }\n\n    val models by viewModel.llmEngine.models.collectAsState()\n    val modelState by viewModel.llmEngine.state.collectAsState()\n    val modelName by viewModel.llmEngine.modelName.collectAsState()\n    val progress by viewModel.llmEngine.progress.collectAsState()\n    val progressMessage by viewModel.llmEngine.progressMessage.collectAsState()\n\n    var modelToDelete by remember { mutableStateOf<ModelInfo?>(null) }\n    var showDownloadDialog by remember { mutableStateOf(false) }\n    var showSearchDialog by remember { mutableStateOf(false) }\n    var showQuickDialog by remember { mutableStateOf(false) }\n\n    val isDownloading by viewModel.llmEngine.isDownloading.collectAsState()\n    val downloadProgress by viewModel.llmEngine.downloadProgress.collectAsState()\n    val downloadMessage by viewModel.llmEngine.downloadMessage.collectAsState()\n\n    val isSearching by viewModel.isSearching.collectAsState()\n    val searchResults by viewModel.searchResults.collectAsState()\n    val searchError by viewModel.searchError.collectAsState()\n    val downloadError by viewModel.downloadError.collectAsState()\n\n    val context = LocalContext.current\n    val filePickerLauncher = rememberLauncherForActivityResult(\n        contract = ActivityResultContracts.OpenDocument()\n    ) { uri ->\n        uri?.let {\n            // Take persistable permission\n            try {\n                context.contentResolver.takePersistableUriPermission(\n                    it,\n                    android.content.Intent.FLAG_GRANT_READ_URI_PERMISSION\n                )\n            } catch (_: Exception) {}\n            viewModel.importModel(it)\n        }\n    }\n\n    // ---- Projector (mmproj) attach / download ----\n    var projectorTarget by remember { mutableStateOf<ModelInfo?>(null) }\n    val projectorPicker = rememberLauncherForActivityResult(\n        contract = ActivityResultContracts.OpenDocument()\n    ) { uri ->\n        val target = projectorTarget\n        if (uri != null && target != null) {\n            try {\n                context.contentResolver.takePersistableUriPermission(\n                    uri,\n                    android.content.Intent.FLAG_GRANT_READ_URI_PERMISSION\n                )\n            } catch (_: Exception) {}\n            viewModel.attachMmprojToModel(target, uri)\n        }\n    }\n    var projectorDownloadTarget by remember { mutableStateOf<ModelInfo?>(null) }\n\n    Scaffold(\n        topBar = {\n            TopAppBar(\n                title = { Text(l(\"models\")) },\n                navigationIcon = {\n                    IconButton(onClick = onBack) {\n                        Icon(Icons.Default.ArrowBack, contentDescription = l(\"back\"))\n                    }\n                },\n                actions = {\n                    IconButton(onClick = { showQuickDialog = true }) {\n                        Icon(Icons.Default.CloudDownload, contentDescription = l(\"quick_downloads\"))\n                    }\n                    IconButton(onClick = { showSearchDialog = true }) {\n                        Icon(Icons.Default.Search, contentDescription = l(\"search_models\"))\n                    }\n                    IconButton(onClick = { showDownloadDialog = true }) {\n                        Icon(Icons.Default.Download, contentDescription = l(\"download_model\"))\n                    }\n                }\n            )\n        },\n        floatingActionButton = {\n            FloatingActionButton(\n                onClick = { filePickerLauncher.launch(arrayOf(\"*/*\")) }\n            ) {\n                Icon(Icons.Default.Add, contentDescription = l(\"load_model\"))\n            }\n        }\n    ) { paddingValues ->\n        Column(\n            modifier = Modifier\n                .fillMaxSize()\n                .padding(paddingValues)\n        ) {\n            // Import / download error banner (the search dialog closes silently,\n            // so a rejected download used to leave the user with no explanation).\n            downloadError?.let { msg ->\n                Card(\n                    modifier = Modifier\n                        .fillMaxWidth()\n                        .padding(16.dp),\n                    colors = CardDefaults.cardColors(\n                        containerColor = MaterialTheme.colorScheme.errorContainer\n                    ),\n                    shape = RoundedCornerShape(8.dp)\n                ) {\n                    Row(\n                        modifier = Modifier\n                            .fillMaxWidth()\n                            .padding(12.dp),\n                        verticalAlignment = Alignment.CenterVertically\n                    ) {\n                        Text(\n                            text = msg,\n                            modifier = Modifier.weight(1f),\n                            style = MaterialTheme.typography.bodySmall,\n                            color = MaterialTheme.colorScheme.onErrorContainer\n                        )\n                        IconButton(onClick = { viewModel.clearDownloadError() }) {\n                            Icon(\n                                Icons.Default.Close,\n                                contentDescription = l(\"cancel\"),\n                                tint = MaterialTheme.colorScheme.onErrorContainer\n                            )\n                        }\n                    }\n                }\n            }\n\n            // Loading progress\n            if (modelState == ModelState.LOADING) {\n                Column(modifier = Modifier.padding(16.dp)) {\n                    LinearProgressIndicator(\n                        progress = { progress },\n                        modifier = Modifier.fillMaxWidth()\n                    )\n                    Spacer(modifier = Modifier.height(8.dp))\n                    Text(\n                        text = progressMessage,\n                        style = MaterialTheme.typography.bodySmall,\n                        color = MaterialTheme.colorScheme.onSurfaceVariant\n                    )\n                }\n            }\n\n            if (models.isEmpty()) {\n                // Empty state\n                Column(\n                    modifier = Modifier\n                        .fillMaxSize()\n                        .padding(32.dp),\n                    horizontalAlignment = Alignment.CenterHorizontally,\n                    verticalArrangement = Arrangement.Center\n                ) {\n                    Icon(\n                        Icons.Default.Memory,\n                        contentDescription = null,\n                        modifier = Modifier.size(64.dp),\n                        tint = MaterialTheme.colorScheme.onSurfaceVariant\n                    )\n                    Spacer(modifier = Modifier.height(16.dp))\n                    Text(\n                        text = l(\"no_model\"),\n                        style = MaterialTheme.typography.bodyLarge,\n                        color = MaterialTheme.colorScheme.onSurfaceVariant\n                    )\n                    Spacer(modifier = Modifier.height(8.dp))\n                    Text(\n                        text = l(\"tap_import_hint\"),\n                        style = MaterialTheme.typography.bodyMedium,\n                        color = MaterialTheme.colorScheme.onSurfaceVariant\n                    )\n                }\n            } else {\n                LazyColumn(\n                    modifier = Modifier.fillMaxSize(),\n                    contentPadding = androidx.compose.foundation.layout.PaddingValues(16.dp),\n                    verticalArrangement = Arrangement.spacedBy(8.dp)\n                ) {\n                    items(models) { model ->\n                        ModelCard(\n                            model = model,\n                            isLoaded = model.name == modelName && modelState == ModelState.LOADED,\n                            isLoading = model.name == modelName && modelState == ModelState.LOADING,\n                            l = l,\n                            onLoad = {\n                                viewModel.loadModel(model)\n                                onBack()\n                            },\n                            onUnload = { viewModel.unloadModel() },\n                            onDelete = { modelToDelete = model },\n                            onAttachProjector = {\n                                projectorTarget = model\n                                projectorPicker.launch(arrayOf(\"*/*\"))\n                            },\n                            onDownloadProjector = { projectorDownloadTarget = model },\n                            onRemoveProjector = { viewModel.removeMmprojFromModel(model) }\n                        )\n                    }\n                }\n            }\n        }\n    }\n\n    // Delete confirmation dialog\n    modelToDelete?.let { model ->\n        AlertDialog(\n            onDismissRequest = { modelToDelete = null },\n            title = { Text(l(\"confirm_delete\")) },\n            text = { Text(\"${l(\"delete_model\")}: ${model.name}?\") },\n            confirmButton = {\n                TextButton(onClick = {\n                    viewModel.deleteModel(model)\n                    modelToDelete = null\n                }) {\n                    Text(l(\"confirm\"))\n                }\n            },\n            dismissButton = {\n                TextButton(onClick = { modelToDelete = null }) {\n                    Text(l(\"cancel\"))\n                }\n            }\n        )\n    }\n\n    // Download from URL dialog\n    if (showDownloadDialog) {\n        DownloadModelDialog(\n            l = l,\n            isDownloading = isDownloading,\n            progress = downloadProgress,\n            message = downloadMessage,\n            onDownload = { url, name ->\n                viewModel.downloadModelFromUrl(url, name)\n            },\n            onCancel = { viewModel.cancelModelDownload() },\n            onDismiss = { if (!isDownloading) showDownloadDialog = false }\n        )\n    }\n\n    // Quick downloads: preset models + their Q8 projectors\n    if (showQuickDialog) {\n        QuickDownloadDialog(\n            l = l,\n            isDownloading = isDownloading,\n            progress = downloadProgress,\n            message = downloadMessage,\n            onDownload = { fileName, url -> viewModel.downloadModelFromUrl(url, fileName) },\n            onCancel = { viewModel.cancelModelDownload() },\n            onDismiss = { if (!isDownloading) showQuickDialog = false }\n        )\n    }\n\n    // Search models online dialog\n    if (showSearchDialog) {\n        SearchModelsDialog(\n            l = l,\n            isSearching = isSearching,\n            results = searchResults,\n            errorKey = searchError,\n            isDownloading = isDownloading,\n            downloadProgress = downloadProgress,\n            downloadMessage = downloadMessage,\n            onSearch = { query, maxMB, includeProj -> viewModel.searchModels(query, maxMB, includeProj) },\n            onDownload = { result ->\n                viewModel.downloadModelFromUrl(result.url, result.fileName)\n                showSearchDialog = false\n            },\n            onDismiss = { if (!isSearching) showSearchDialog = false }\n        )\n    }\n\n    // Download a projector (mmproj) for a specific model\n    projectorDownloadTarget?.let { model ->\n        ProjectorDownloadDialog(\n            l = l,\n            modelName = model.name,\n            isDownloading = isDownloading,\n            progress = downloadProgress,\n            message = downloadMessage,\n            onDownload = { url, name ->\n                viewModel.downloadMmprojForModel(model, url, name)\n                projectorDownloadTarget = null\n            },\n            onDismiss = { if (!isDownloading) projectorDownloadTarget = null }\n        )\n    }\n}\n\n@Composable"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/screens/ModelPickerScreen.kt", "c  value = url,\n                        onValueChange = { url = it },\n                        label = { Text(l(\"projector_url\")) },\n                        placeholder = { Text(\"https://huggingface.co/.../mmproj-...gguf\") },\n                        singleLine = true,\n                        modifier = Modifier.fillMaxWidth()\n                    )\n                    Spacer(modifier = Modifier.height(8.dp))\n                    OutlinedTextField(\n                        value = name,\n                        onValueChange = { name = it },\n                        label = { Text(l(\"file_name\")) },\n                        placeholder = { Text(\"mmproj-model-f16.gguf\") },\n                        singleLine = true,\n                        modifier = Modifier.fillMaxWidth()\n                    )\n                }\n            }\n        },\n        confirmButton = {\n            if (isDownloading) {\n                TextButton(onClick = onDismiss) { Text(l(\"cancel\")) }\n            } else {\n                Button(\n                    onClick = { onDownload(url, name.ifBlank { null }) },\n                    enabled = url.isNotBlank()\n                ) {\n                    Text(l(\"download\"))\n                }\n            }\n        },\n        dismissButton = {\n            if (!isDownloading) {\n                TextButton(onClick = onDismiss) { Text(l(\"cancel\")) }\n            }\n        }\n    )\n}\n\n@Composable"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/ui/screens/ModelPickerScreen.kt", "cat": "UI · Models", "order": 31, "start": 441, "end": 586, "kind": "fun", "name": "ModelCard", "owner": "", "sig": "private fun ModelCard(", "tech": ["compose", "mtmd", "fileio"], "sum": {"ru": "файловый ввод-вывод; UI-компонент Compose; тема и цвета", "en": "file I/O; Compose UI component; theme and colors", "de": "Datei-E/A; Compose-UI-Komponente; Theme und Farben"}, "code": "private fun ModelCard(\n    model: ModelInfo,\n    isLoaded: Boolean,\n    isLoading: Boolean,\n    l: (String) -> String,\n    onLoad: () -> Unit,\n    onUnload: () -> Unit,\n    onDelete: () -> Unit,\n    onAttachProjector: () -> Unit,\n    onDownloadProjector: () -> Unit,\n    onRemoveProjector: () -> Unit\n) {\n    Card(\n        modifier = Modifier\n            .fillMaxWidth()\n            .clickable { onLoad() },\n        colors = CardDefaults.cardColors(\n            containerColor = if (isLoaded) MaterialTheme.colorScheme.primaryContainer\n            else MaterialTheme.colorScheme.surface\n        ),\n        shape = RoundedCornerShape(12.dp)\n    ) {\n        Row(\n            modifier = Modifier\n                .fillMaxWidth()\n                .padding(16.dp),\n            verticalAlignment = Alignment.CenterVertically\n        ) {\n            Icon(\n                Icons.Default.Memory,\n                contentDescription = null,\n                modifier = Modifier.size(40.dp),\n                tint = if (isLoaded) MaterialTheme.colorScheme.primary\n                else MaterialTheme.colorScheme.onSurfaceVariant\n            )\n\n            Spacer(modifier = Modifier.width(12.dp))\n\n            Column(modifier = Modifier.weight(1f)) {\n                Text(\n                    text = model.name,\n                    style = MaterialTheme.typography.titleSmall,\n                    maxLines = 1,\n                    overflow = TextOverflow.Ellipsis\n                )\n                Spacer(modifier = Modifier.height(2.dp))\n                Text(\n                    text = formatSize(model.sizeBytes),\n                    style = MaterialTheme.typography.titleSmall,\n                    color = MaterialTheme.colorScheme.primary,\n                    fontWeight = androidx.compose.ui.text.font.FontWeight.Bold\n                )\n                Spacer(modifier = Modifier.height(2.dp))\n                Text(\n                    text = \"${model.architecture} · ${model.contextLength} ctx\",\n                    style = MaterialTheme.typography.bodySmall,\n                    color = MaterialTheme.colorScheme.onSurfaceVariant\n                )\n                // Projector (mmproj) status + actions\n                val projectorName = model.mmprojPath?.let { java.io.File(it).name }\n                Spacer(modifier = Modifier.height(4.dp))\n                Row(verticalAlignment = Alignment.CenterVertically) {\n                    Icon(\n                        Icons.Default.Image,\n                        contentDescription = null,\n                        modifier = Modifier.size(14.dp),\n                        tint = if (projectorName != null) MaterialTheme.colorScheme.primary\n                        else MaterialTheme.colorScheme.onSurfaceVariant\n                    )\n                    Spacer(modifier = Modifier.width(4.dp))\n                    Text(\n                        text = projectorName ?: l(\"no_projector\"),\n                        style = MaterialTheme.typography.bodySmall,\n                        color = if (projectorName != null) MaterialTheme.colorScheme.primary\n                        else MaterialTheme.colorScheme.onSurfaceVariant,\n                        maxLines = 1,\n                        overflow = TextOverflow.Ellipsis\n                    )\n                }\n                Row(verticalAlignment = Alignment.CenterVertically) {\n                    TextButton(\n                        onClick = onAttachProjector,\n                        contentPadding = androidx.compose.foundation.layout.PaddingValues(0.dp)\n                    ) {\n                        Text(l(\"attach_projector\"), style = MaterialTheme.typography.labelSmall)\n                    }\n                    Spacer(modifier = Modifier.width(4.dp))\n                    TextButton(\n                        onClick = onDownloadProjector,\n                        contentPadding = androidx.compose.foundation.layout.PaddingValues(0.dp)\n                    ) {\n
