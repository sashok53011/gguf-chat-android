aiHeader: String\n    )"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 1106, "end": 1178, "kind": "fun", "name": "buildSuggestionPrompt", "owner": "LlmEngine", "sig": "private fun buildSuggestionPrompt(", "tech": [], "sum": {"ru": "Промпт подсказок на целевом языке (ru/de/en).", "en": "Suggestion prompt in the target language (ru/de/en).", "de": "Vorschlags-Prompt in der Zielsprache (ru/de/en)."}, "code": "    private fun buildSuggestionPrompt(\n        count: Int,\n        hasDocs: Boolean,\n        lastResponse: String?,\n        docsBlock: String?,\n        excludeSuggestions: Set<String>\n    ): String {\n        val code = resolveAnswerLanguageCode()\n        val h = when (code) {\n            \"ru\" -> SuggestionStrings(\n                introBoth = \"На основе следующего ответа ИИ и прикреплённых документов сгенерируй $count разных, уместных и интересных вопросов или подсказок, которые пользователь мог бы задать далее.\",\n                introDocs = \"На основе прикреплённых документов сгенерируй $count разных, уместных и интересных вопросов или подсказок, которые пользователь мог бы задать о них.\",\n                introResp = \"На основе следующего ответа ИИ сгенерируй $count разных, уместных и интересных вопросов или подсказок, которые пользователь мог бы задать далее.\",\n                shortRule = \"Каждая подсказка — короткая (не более 8 слов).\",\n                langRule = \"Пиши каждую подсказку ТОЛЬКО на русском языке, даже если документы или ответ ИИ на другом языке.\",\n                jsonRule = \"Ответь ТОЛЬКО сырым JSON-массивом строк, например: [\\\"Подсказка 1\\\", \\\"Подсказка 2\\\"].\",\n                noMdRule = \"Без markdown и без блоков кода.\",\n                excludeRule = \"НЕ предлагай ничего из следующего (уже показано пользователю): \",\n                docsHeader = \"Прикреплённые документы:\",\n                aiHeader = \"Ответ ИИ:\"\n            )\n            \"de\" -> SuggestionStrings(\n                introBoth = \"Erzeuge auf Basis der folgenden KI-Antwort und der angehängten Dokumente $count verschiedene, passende und interessante Folgefragen oder Vorschläge, die der Nutzer als Nächstes stellen könnte.\",\n                introDocs = \"Erzeuge auf Basis der angehängten Dokumente $count verschiedene, passende und interessante Fragen oder Vorschläge, die der Nutzer dazu stellen könnte.\",\n                introResp = \"Erzeuge auf Basis der folgenden KI-Antwort $count verschiedene, passende und interessante Folgefragen oder Vorschläge, die der Nutzer als Nächstes stellen könnte.\",\n                shortRule = \"Jeder Vorschlag ist kurz (höchstens 8 Wörter).\",\n                langRule = \"Schreibe jeden Vorschlag NUR auf Deutsch, auch wenn Dokumente oder die KI-Antwort in einer anderen Sprache sind.\",\n                jsonRule = \"Antworte NUR mit einem rohen JSON-Array aus Strings, z. B.: [\\\"Vorschlag 1\\\", \\\"Vorschlag 2\\\"].\",\n                noMdRule = \"Ohne Markdown und ohne Codeblöcke.\",\n                excludeRule = \"Schlage nichts von Folgendem vor (dem Nutzer bereits gezeigt): \",\n                docsHeader = \"Angehängte Dokumente:\",\n                aiHeader = \"KI-Antwort:\"\n            )\n            else -> SuggestionStrings(\n                introBoth = \"Based on the following AI response and the attached documents, generate $count distinct, highly relevant, and engaging follow-up questions or prompt suggestions that the user might want to ask next.\",\n                introDocs = \"Based on the attached documents, generate $count distinct, highly relevant, and engaging questions or prompt suggestions the user might want to ask about them.\",\n                introResp = \"Based on the following AI response, generate $count distinct, highly relevant, and engaging follow-up questions or prompt suggestions that the user might want to ask next.\",\n                shortRule = \"Keep each suggestion short (under 8 words).\",\n                langRule = \"Write every suggestion in English only, even if the attached documents or the AI response are in another language.\",\n                jsonRule = \"Respond with ONLY a raw JSON array of strings, like: [\\\"Suggestion 1\\\", \\\"Suggestion 2\\\"].\",\n                noMdRule = \"Do not include markdown formatting or code block tags.\",\n                excludeRule = \"Do NOT suggest any of the following (already shown to the user): \",\n                docsHeader = \"Attached documents:\",\n                aiHeader = \"AI Response:\"\n            )\n        }\n        return buildString {\n            append(languageReminder())\n            append(\"\\n\\n\").append(\n                when {\n                    hasDocs && !lastResponse.isNullOrBlank() -> h.introBoth\n                    hasDocs -> h.introDocs\n                    else -> h.introResp\n                }\n            )\n            append(\"\\n\").append(h.shortRule)\n            append(\"\\n\").append(h.langRule)\n            append(\"\\n\").append(h.jsonRule)\n            append(\"\\n\").append(h.noMdRule)\n            if (excludeSuggestions.isNotEmpty()) {\n                append(\"\\n\").append(h.excludeRule).append(excludeSuggestions.joinToString(\"; \"))\n            }\n            if (hasDocs) append(\"\\n\\n\").append(h.docsHeader).append(\"\\n\").append(docsBlock)\n            if (!lastResponse.isNullOrBlank()) {\n                append(\"\\n\\n\").append(h.aiHeader).append(\"\\n\").append(lastResponse)\n            }\n            // Reinforce at the very end: small models follow the closest instruction.\n            append(\"\\n\\n\").append(languageReminder())\n        }\n    }\n\n    /** Distinctive German function words (ambiguous English homographs like\n     *  \"was\"/\"die\"/\"man\" are deliberately excluded). */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 1179, "end": 1188, "kind": "val", "name": "GERMAN_HINT_WORDS", "owner": "LlmEngine", "sig": "private val GERMAN_HINT_WORDS = setOf(", "tech": [], "sum": {"ru": "локализация (en/ru/de)", "en": "localization (en/ru/de)", "de": "Lokalisierung (en/ru/de)"}, "code": "    private val GERMAN_HINT_WORDS = setOf(\n        \"der\", \"das\", \"und\", \"ist\", \"sind\", \"wie\", \"wer\", \"wo\", \"ein\", \"eine\",\n        \"einen\", \"für\", \"mit\", \"den\", \"dem\", \"sich\", \"nicht\", \"auch\", \"kann\",\n        \"kannst\", \"können\", \"oder\", \"aber\", \"wird\", \"werden\", \"haben\", \"bitte\",\n        \"welche\", \"welcher\", \"welches\", \"warum\", \"wann\", \"mehr\", \"diese\",\n        \"dieser\", \"dieses\", \"dein\", \"deine\", \"du\", \"auf\", \"zur\", \"zum\", \"von\"\n    )\n\n    /** Keeps only suggestions written in the configured answer language, so a\n     *  weak model can never leak wrong-language chips into the UI. */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 1189, "end": 1208, "kind": "fun", "name": "suggestionMatchesLanguage", "owner": "LlmEngine", "sig": "private fun suggestionMatchesLanguage(text: String, code: String): Boolean {", "tech": ["regex"], "sum": {"ru": "обработка текста", "en": "text processing", "de": "Textverarbeitung"}, "code": "    private fun suggestionMatchesLanguage(text: String, code: String): Boolean {\n        val hasCyr = text.any { it.code in 0x0400..0x04FF }\n        val hasLatin = text.any { it in 'a'..'z' || it in 'A'..'Z' }\n        return when (code.lowercase()) {\n            \"ru\" -> hasCyr\n            \"en\" -> hasLatin && !hasCyr\n            \"de\" -> !hasCyr && (\n                text.any { it in \"äöüßÄÖÜ\" } ||\n                    Regex(\"[A-Za-zÄÖÜäöüß]+\").findAll(text)\n                        .any { it.value.lowercase() in GERMAN_HINT_WORDS }\n                )\n            else -> true\n        }\n    }\n\n    /**\n     * Incremental parse used for live streaming: returns the quoted strings that\n     * are already closed, plus the text of the string currently being generated\n     * (null when none). Handles the common one-array / array-per-line output.\n     */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 1209, "end": 1230, "kind": "fun", "name": "parsePartial", "owner": "LlmEngine", "sig": "private fun parsePartial(raw: String): Pair<List<String>, String?> {", "tech": ["regex"], "sum": {"ru": "обработка текста", "en": "text processing", "de": "Textverarbeitung"}, "code": "    private fun parsePartial(raw: String): Pair<List<String>, String?> {\n        val complete = Regex(\"\\\"((?:[^\\\"\\\\\\\\]|\\\\\\\\.)*)\\\"\")\n            .findAll(raw)\n            .map { unescape(it.groupValues[1]) }\n            .filter { it.isNotBlank() }\n            .toList()\n\n        var quoteCount = 0\n        var lastOpen = -1\n        var i = 0\n        while (i < raw.length) {\n            val c = raw[i]\n            if (c == '\\\\') { i += 2; continue }\n            if (c == '\"') { quoteCount++; lastOpen = i }\n            i++\n        }\n        val pending = if (quoteCount % 2 == 1 && lastOpen >= 0) {\n            raw.substring(lastOpen + 1).take(160).ifBlank { null }\n        } else null\n\n        return complete to pending\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 1232, "end": 1245, "kind": "fun", "name": "unescape", "owner": "LlmEngine", "sig": "private fun unescape(s: String): String =", "tech": ["json"], "sum": {"ru": "разбор/сборка JSON; обработка текста", "en": "JSON parse/build; text processing", "de": "JSON-Parsing/Aufbau; Textverarbeitung"}, "code": "    private fun unescape(s: String): String =\n        s.replace(\"\\\\n\", \" \")\n            .replace(\"\\\\t\", \" \")\n            .replace(\"\\\\\\\"\", \"\\\"\")\n            .replace(\"\\\\\\\\\", \"\\\\\")\n\n    /**\n     * Suggestions are parsed leniently: small / base models rarely emit a\n     * perfectly valid JSON array. Notably, some models emit ONE array per line:\n     *   [\"a\"]\n     *   [\"b\"]\n     * Android's JSONArray is lenient and would silently keep only the first one,\n     * so parse every bracket block and aggregate.\n     */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 1246, "end": 1293, "kind": "fun", "name": "parseSuggestions", "owner": "LlmEngine", "sig": "private fun parseSuggestions(raw: String): List<String> {", "tech": ["json", "regex"], "sum": {"ru": "разбор/сборка JSON; обработка текста", "en": "JSON parse/build; text processing", "de": "JSON-Parsing/Aufbau; Textverarbeitung"}, "code": "    private fun parseSuggestions(raw: String): List<String> {\n        val text = raw.trim()\n            .removeSurrounding(\"```json\", \"```\")\n            .removeSurrounding(\"```\")\n            .trim()\n        if (text.isEmpty()) return emptyList()\n\n        val out = LinkedHashSet<String>()\n\n        // 1) every [...] block (handles one array, or one array per line)\n        for (block in Regex(\"\\\\[(.*?)\\\\]\", RegexOption.DOT_MATCHES_ALL).findAll(text)) {\n            try {\n                val arr = JSONArray(block.value)\n                for (i in 0 until arr.length()) {\n                    val s = arr.optString(i, \"\").trim()\n                    if (s.isNotEmpty()) out.add(s)\n                }\n            } catch (_: Exception) { /* not valid JSON, ignore block */ }\n        }\n        if (out.isNotEmpty()) return out.toList().take(20)\n\n        // 2) a bare JSON array in extra prose (no brackets matched above)\n        try {\n            val arr = JSONArray(text)\n            for (i in 0 until arr.length()) {\n                val s = arr.optString(i, \"\").trim()\n                if (s.isNotEmpty()) out.add(s)\n            }\n            if (out.isNotEmpty()) return out.toList().take(20)\n        } catch (_: Exception) { /* fall through */ }\n\n        // 3) any quoted strings\n        Regex(\"\\\"([^\\\"]{2,80})\\\"\").findAll(text)\n            .map { it.groupValues[1].trim() }\n            .filter { it.isNotEmpty() && !it.equals(\"json\", ignoreCase = true) }\n            .forEach { out.add(it) }\n        if (out.isNotEmpty()) return out.toList().take(20)\n\n        // 4) plain lines, stripping bullets and numbering\n        return text.lines()\n            .map { it.trim() }\n            .map { it.replace(Regex(\"^[-*•]\\\\s*\"), \"\") }\n            .map { it.replace(Regex(\"^\\\\d+[.)]\\\\s*\"), \"\") }\n            .map { it.trim('\"', ' ', '\\'', ',', '[', ']') }\n            .filter { it.isNotEmpty() && it.length in 2..80 }\n            .distinct()\n            .take(20)\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LlmEngine.kt", "cat": "Data · LLM", "order": 60, "start": 1295, "end": 1300, "kind": "fun", "name": "formatBytes", "owner": "LlmEngine", "sig": "private fun formatBytes(bytes: Long): String = when {", "tech": [], "sum": {"ru": "Функция formatBytes", "en": "Function formatBytes", "de": "Funktion formatBytes"}, "code": "    private fun formatBytes(bytes: Long): String = when {\n        bytes >= 1_073_741_824 -> \"%.1f GB\".format(bytes / 1_073_741_824.0)\n        bytes >= 1_048_576 -> \"%.1f MB\".format(bytes / 1_048_576.0)\n        else -> \"$bytes B\"\n    }\n}"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/GgufReader.kt", "cat": "Data · LLM", "order": 61, "start": 23, "end": 24, "kind": "object", "name": "GgufReader", "owner": "", "sig": "object GgufReader {", "tech": [], "sum": {"ru": "Разбор заголовка GGUF (магия, версия, KV).", "en": "Parses the GGUF header (magic, version, KV).", "de": "Liest den GGUF-Header (Magic, Version, KV)."}, "code": "object GgufReader {\n    private const val TAG = \"GgufReader\""}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/GgufReader.kt", "cat": "Data · LLM", "order": 61, "start": 25, "end": 25, "kind": "val", "name": "HEADER_SIZE", "owner": "GgufReader", "sig": "private const val HEADER_SIZE = 24 // magic(4) + version(4) + tensorCount(8) + kvCount(8)", "tech": [], "sum": {"ru": "Константа HEADER_SIZE", "en": "Constant HEADER_SIZE", "de": "Konstante HEADER_SIZE"}, "code": "    private const val HEADER_SIZE = 24 // magic(4) + version(4) + tensorCount(8) + kvCount(8)"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/GgufReader.kt", "cat": "Data · LLM", "order": 61, "start": 26, "end": 26, "kind": "val", "name": "MAX_READ_BYTES", "owner": "GgufReader", "sig": "private const val MAX_READ_BYTES = 4 * 1024 * 1024 // 4MB cap for metadata parsing", "tech": [], "sum": {"ru": "Константа MAX_READ_BYTES", "en": "Constant MAX_READ_BYTES", "de": "Konstante MAX_READ_BYTES"}, "code": "    private const val MAX_READ_BYTES = 4 * 1024 * 1024 // 4MB cap for metadata parsing"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/GgufReader.kt", "cat": "Data · LLM", "order": 61, "start": 28, "end": 37, "kind": "fun", "name": "readHeaders", "owner": "GgufReader", "sig": "fun readHeaders(context: Context, uri: Uri): GgufInfo {", "tech": ["saf"], "sum": {"ru": "доступ к файлам (ContentResolver/SAF)", "en": "file access (ContentResolver/SAF)", "de": "Dateizugriff (ContentResolver/SAF)"}, "code": "    fun readHeaders(context: Context, uri: Uri): GgufInfo {\n        return try {\n            context.contentResolver.openInputStream(uri)?.use { inputStream ->\n                readHeadersFromStream(inputStream)\n            } ?: GgufInfo(isValid = false, error = \"Cannot open InputStream\")\n        } catch (e: Exception) {\n            Log.e(TAG, \"Error reading GGUF header\", e)\n            GgufInfo(isValid = false, error = e.localizedMessage ?: \"File read error\")\n        }\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/GgufReader.kt", "cat": "Data · LLM", "order": 61, "start": 39, "end": 48, "kind": "fun", "name": "readHeadersFromFile", "owner": "GgufReader", "sig": "fun readHeadersFromFile(file: java.io.File): GgufInfo {", "tech": ["fileio"], "sum": {"ru": "файловый ввод-вывод", "en": "file I/O", "de": "Datei-E/A"}, "code": "    fun readHeadersFromFile(file: java.io.File): GgufInfo {\n        return try {\n            file.inputStream().use { inputStream ->\n                readHeadersFromStream(inputStream)\n            }\n        } catch (e: Exception) {\n            Log.e(TAG, \"Error reading GGUF header from file\", e)\n            GgufInfo(isValid = false, error = e.localizedMessage ?: \"File read error\")\n        }\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/GgufReader.kt", "cat": "Data · LLM", "order": 61, "start": 50, "end": 144, "kind": "fun", "name": "readHeadersFromStream", "owner": "GgufReader", "sig": "private fun readHeadersFromStream(inputStream: InputStream): GgufInfo {", "tech": [], "sum": {"ru": "Читает магию/версию/tensors/KV из потока.", "en": "Reads magic/version/tensors/KV from a stream.", "de": "Liest Magic/Version/Tensoren/KV aus einem Stream."}, "code": "    private fun readHeadersFromStream(inputStream: InputStream): GgufInfo {\n        val headerBuf = ByteArray(HEADER_SIZE)\n        val bytesRead = inputStream.read(headerBuf)\n        if (bytesRead < HEADER_SIZE) {\n            return GgufInfo(isValid = false, error = \"File too small (need $HEADER_SIZE bytes, got $bytesRead)\")\n        }\n\n        val buffer = ByteBuffer.wrap(headerBuf).order(ByteOrder.LITTLE_ENDIAN)\n\n        // Magic: \"GGUF\" (0x47 0x47 0x55 0x46)\n        val magic = ByteArray(4)\n        buffer.get(magic)\n        if (String(magic) != \"GGUF\") {\n            return GgufInfo(isValid = false, error = \"Invalid magic bytes (not a valid GGUF file)\")\n        }\n\n        val version = buffer.int\n        val tensorCount = buffer.long\n        val kvCount = buffer.long\n\n        Log.d(TAG, \"GGUF header: version=$version, tensors=$tensorCount, kvs=$kvCount\")\n\n        // Parse KV metadata\n        // NOTE: in GGUF the length prefix of every string (keys and string\n        // values) is uint64 — 8 bytes, not 4!\n        val metadata = mutableMapOf<String, Any>()\n        var arch = \"Unknown\"\n        var ctxLen = 2048\n\n        if (kvCount > 0 && kvCount < 10000) {\n            try {\n                // Read up to MAX_READ_BYTES for KV parsing\n                val maxBytes = MAX_READ_BYTES - HEADER_SIZE\n                val kvBuf = ByteArray(maxBytes)\n                var totalRead = 0\n                var read: Int\n\n                while (totalRead < maxBytes) {\n                    read = inputStream.read(kvBuf, totalRead, maxBytes - totalRead)\n                    if (read == -1) break\n                    totalRead += read\n                }\n\n                val kvBuffer = ByteBuffer.wrap(kvBuf, 0, totalRead).order(ByteOrder.LITTLE_ENDIAN)\n\n                for (i in 0 until kvCount) {\n                    if (kvBuffer.remaining() < 8) break\n                    val keyLen = kvBuffer.long\n                    if (keyLen <= 0 || keyLen > 1024) break\n                    if (kvBuffer.remaining() < keyLen + 4) break\n\n                    val keyBytes = ByteArray(keyLen.toInt())\n                    kvBuffer.get(keyBytes)\n                    val key = String(keyBytes, Charsets.UTF_8)\n\n                    val valueType = kvBuffer.int\n                    val value = readGgufValue(kvBuffer, valueType)\n                    if (value != null) metadata[key] = value\n\n                    // Extract architecture\n                    if (key == \"general.architecture\" && value is String) {\n                        arch = value\n                    }\n\n                    // Extract context length: {arch}.context_length\n                    if (key.endsWith(\".context_length\") && (value is Int || value is Long)) {\n                        ctxLen = when (value) {\n                            is Int -> value\n                            is Long -> value.toInt()\n                            else -> 2048\n                        }\n                    }\n                }\n            } catch (e: Exception) {\n                Log.w(TAG, \"Partial KV parse: ${e.message}\")\n            }\n        }\n\n        // Fallback: derive architecture from metadata keys if not found\n        if (arch == \"Unknown\") {\n            arch = deriveArchitecture(metadata)\n        }\n\n        Log.d(TAG, \"Parsed: arch=$arch, ctx=$ctxLen, kvCount=${metadata.size}\")\n\n        return GgufInfo(\n            isValid = true,\n            version = version,\n            tensorCount = tensorCount,\n            kvCount = kvCount,\n            modelArchitecture = arch,\n            contextLength = ctxLen,\n            metadata = metadata\n        )\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/GgufReader.kt", "cat": "Data · LLM", "order": 61, "start": 146, "end": 179, "kind": "fun", "name": "readGgufValue", "owner": "GgufReader", "sig": "private fun readGgufValue(buffer: ByteBuffer, type: Int): Any? {", "tech": [], "sum": {"ru": "Декодирует типы значений GGUF.", "en": "Decodes GGUF value types.", "de": "Dekodiert GGUF-Werttypen."}, "code": "    private fun readGgufValue(buffer: ByteBuffer, type: Int): Any? {\n        return when (type) {\n            0 -> buffer.get().toInt() and 0xFF            // U8\n            1 -> buffer.get().toInt()                      // I8\n            2 -> buffer.short.toInt() and 0xFFFF          // U16\n            3 -> buffer.short.toInt()                      // I16\n            4 -> buffer.int and 0xFFFFFFFF.toInt()         // U32\n            5 -> buffer.int                                // I32\n            6 -> buffer.float                              // F32\n            7 -> buffer.get() != 0.toByte()                // BOOL\n            8 -> { // STRING — length prefix is uint64\n                val len = buffer.long\n                if (len <= 0 || len > 65536) return null\n                val bytes = ByteArray(len.toInt())\n                buffer.get(bytes)\n                String(bytes, Charsets.UTF_8)\n            }\n            9 -> { // ARRAY: [4B elem_type][8B count][elements...]\n                val elemType = buffer.int\n                val count = buffer.long\n                if (count < 0 || count > 100_000_000) return null\n                // Consume/skip all elements so subsequent KVs stay aligned\n                for (k in 0 until count) {\n                    val v = readGgufValue(buffer, elemType)\n                    if (v == null && buffer.remaining() <= 0) return null\n                }\n                null // arrays themselves are not stored in metadata map\n            }\n            10 -> buffer.long                              // U64 (read as signed Long)\n            11 -> buffer.long                              // I64\n            12 -> buffer.double                            // F64\n            else -> null\n        }\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/GgufReader.kt", "cat": "Data · LLM", "order": 61, "start": 181, "end": 199, "kind": "fun", "name": "deriveArchitecture", "owner": "GgufReader", "sig": "private fun deriveArchitecture(metadata: Map<String, Any>): String {", "tech": [], "sum": {"ru": "Определяет архитектуру по ключам metadata.", "en": "Derives the architecture from metadata keys.", "de": "Leitet die Architektur aus Metadaten-Schlüsseln ab."}, "code": "    private fun deriveArchitecture(metadata: Map<String, Any>): String {\n        // Check for known architecture keys in metadata\n        val archKey = metadata.keys.find { it == \"general.architecture\" }\n        if (archKey != null) {\n            val archValue = metadata[archKey]\n            if (archValue is String) return archValue\n        }\n\n        // Check model type keys (llama, qwen, mistral, etc.)\n        val knownArchs = listOf(\"llama\", \"qwen\", \"mistral\", \"phi\", \"gemma\", \"deepseek\", \"command-r\")\n        for (arch in knownArchs) {\n            if (metadata.keys.any { it.startsWith(\"$arch.\") }) {\n                return arch.replaceFirstChar { it.uppercase() }\n            }\n        }\n\n        return \"Unknown\"\n    }\n}"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/ModelCompatibility.kt", "cat": "Data · LLM", "order": 62, "start": 8, "end": 8, "kind": "object", "name": "ModelCompatibility", "owner": "", "sig": "object ModelCompatibility {", "tech": [], "sum": {"ru": "Гейт поддерживаемых архитектур и vision.", "en": "Supported-architecture and vision gate.", "de": "Gate für unterstützte Architekturen und Vision."}, "code": "object ModelCompatibility {"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/ModelCompatibility.kt", "cat": "Data · LLM", "order": 62, "start": 10, "end": 37, "kind": "val", "name": "SUPPORTED_ARCHS", "owner": "ModelCompatibility", "sig": "val SUPPORTED_ARCHS = setOf(", "tech": [], "sum": {"ru": "Константа SUPPORTED_ARCHS", "en": "Constant SUPPORTED_ARCHS", "de": "Konstante SUPPORTED_ARCHS"}, "code": "    val SUPPORTED_ARCHS = setOf(\n        \"afmoe\", \"apertus\", \"arcee\", \"arctic\", \"arwkv7\", \"baichuan\", \"bailingmoe\",\n        \"bailingmoe2\", \"bailingmoe3\", \"bert\", \"bitnet\", \"bloom\", \"chameleon\",\n        \"chatglm\", \"clef\", \"codeshell\", \"cogvlm\", \"cohere2\", \"cohere2moe\",\n        \"command-r\", \"dbrx\", \"deci\", \"deepseek\", \"deepseek2\", \"deepseek2-ocr\",\n        \"deepseek32\", \"deepseek4\", \"dflash\", \"dots1\", \"dots3note\", \"dream\",\n        \"eagle3\", \"eurobert\", \"exaone\", \"exaone4\", \"exaone-moe\", \"falcon\",\n        \"falcon-h1\", \"gemma\", \"gemma2\", \"gemma3\", \"gemma3n\", \"gemma4\",\n        \"gemma4-assistant\", \"gemma-embedding\", \"glm4\", \"glm4moe\", \"glm5-next\",\n        \"glm-dsa\", \"gpt2\", \"gptj\", \"gptneox\", \"gpt-oss\", \"granite\", \"granitehybrid\",\n        \"granitemoe\", \"graniteswitch\", \"grok\", \"grovemoe\", \"hunyuan-dense\",\n        \"hunyuan-moe\", \"internlm2\", \"jais\", \"jais2\", \"jamba\", \"jina-bert-v2\",\n        \"jina-bert-v3\", \"kimi-k3\", \"kimi-linear\", \"laguna\", \"lfm2\", \"lfm2moe\",\n        \"llada\", \"llada-moe\", \"llama\", \"llama4\", \"llama-embed\", \"maincoder\",\n        \"mamba\", \"mamba2\", \"maple\", \"mellum\", \"mimo2\", \"minicpm\", \"minicpm3\",\n        \"minimax-01\", \"minimax-m2\", \"minimax-m3\", \"mistral3\", \"mistral4\",\n        \"modern-bert\", \"mpt\", \"muse-glimmer\", \"nanbeige\", \"nemotron\", \"neo-bert\",\n        \"nomic-bert\", \"nomic-bert-moe\", \"olmo\", \"olmo2\", \"olmoe\", \"openelm\",\n        \"orion\", \"paddleocr\", \"pangu-embedded\", \"phi2\", \"phi3\", \"phimoe\", \"plamo\",\n        \"plamo2\", \"plamo3\", \"plm\", \"pockettts\", \"qwen\", \"qwen2\", \"qwen2moe\",\n        \"qwen2vl\", \"qwen3\", \"qwen35\", \"qwen35moe\", \"qwen3moe\", \"qwen3next\",\n        \"qwen3tts\", \"qwen3vl\", \"qwen3vlmoe\", \"qwen4exp\", \"refact\", \"rnd1\",\n        \"rwkv6\", \"rwkv6qwen2\", \"rwkv7\", \"smallthinker\", \"smollm3\", \"stablelm\",\n        \"starcoder\", \"starcoder2\", \"step35\", \"t5\", \"t5encoder\", \"talkie\",\n        \"wavtokenizer-dec\", \"xverse\"\n    )\n\n    /** Hugging Face tags of architectures this build cannot run (none now). */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/ModelCompatibility.kt", "cat": "Data · LLM", "order": 62, "start": 38, "end": 40, "kind": "val", "name": "UNSUPPORTED_ARCH_TAGS", "owner": "ModelCompatibility", "sig": "private val UNSUPPORTED_ARCH_TAGS = emptySet<String>()", "tech": [], "sum": {"ru": "локализация (en/ru/de)", "en": "localization (en/ru/de)", "de": "Lokalisierung (en/ru/de)"}, "code": "    private val UNSUPPORTED_ARCH_TAGS = emptySet<String>()\n\n    /** File-name markers of files that are NOT standalone language models. */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/ModelCompatibility.kt", "cat": "Data · LLM", "order": 62, "start": 41, "end": 43, "kind": "val", "name": "NON_MODEL_MARKERS", "owner": "ModelCompatibility", "sig": "private val NON_MODEL_MARKERS = listOf(\"mmproj\", \"lora\", \"adapter\", \"vocab\", \"tokenizer\")", "tech": ["mtmd"], "sum": {"ru": "Константа NON_MODEL_MARKERS", "en": "Constant NON_MODEL_MARKERS", "de": "Konstante NON_MODEL_MARKERS"}, "code": "    private val NON_MODEL_MARKERS = listOf(\"mmproj\", \"lora\", \"adapter\", \"vocab\", \"tokenizer\")\n\n    /** Split model parts: name-00001-of-00002.gguf — never usable alone. */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/ModelCompatibility.kt", "cat": "Data · LLM", "order": 62, "start": 44, "end": 44, "kind": "val", "name": "PART_REGEX", "owner": "ModelCompatibility", "sig": "private val PART_REGEX = Regex(\"-\\\\d{5}-of-\\\\d{5}\\\\.gguf$\", RegexOption.IGNORE_CASE)", "tech": ["regex"], "sum": {"ru": "обработка текста", "en": "text processing", "de": "Textverarbeitung"}, "code": "    private val PART_REGEX = Regex(\"-\\\\d{5}-of-\\\\d{5}\\\\.gguf$\", RegexOption.IGNORE_CASE)"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/ModelCompatibility.kt", "cat": "Data · LLM", "order": 62, "start": 46, "end": 49, "kind": "fun", "name": "isArchSupported", "owner": "ModelCompatibility", "sig": "fun isArchSupported(arch: String): Boolean =", "tech": ["mtmd"], "sum": {"ru": "Проверяет, поддерживается ли архитектура.", "en": "Checks whether an architecture is supported.", "de": "Prüft, ob eine Architektur unterstützt wird."}, "code": "    fun isArchSupported(arch: String): Boolean =\n        arch.isNotBlank() && arch.lowercase() in SUPPORTED_ARCHS\n\n    /** False for mmproj/lora/adapter/vocab/tokenizer files and split parts. */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/ModelCompatibility.kt", "cat": "Data · LLM", "order": 62, "start": 50, "end": 57, "kind": "fun", "name": "isModelFileName", "owner": "ModelCompatibility", "sig": "fun isModelFileName(name: String): Boolean {", "tech": ["mtmd"], "sum": {"ru": "Отсеивает mmproj/lora/split-файлы.", "en": "Filters out mmproj/lora/split files.", "de": "Filtert mmproj-/LoRA-/Split-Dateien heraus."}, "code": "    fun isModelFileName(name: String): Boolean {\n        val n = name.lowercase()\n        if (NON_MODEL_MARKERS.any { n.contains(it) }) return false\n        if (PART_REGEX.containsMatchIn(n)) return false\n        return true\n    }\n\n    /** True for a multimodal projector file (mmproj GGUF). */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/ModelCompatibility.kt", "cat": "Data · LLM", "order": 62, "start": 58, "end": 63, "kind": "fun", "name": "isProjectorFileName", "owner": "ModelCompatibility", "sig": "fun isProjectorFileName(name: String): Boolean {", "tech": ["mtmd"], "sum": {"ru": "Распознаёт mmproj-файлы.", "en": "Detects mmproj files.", "de": "Erkennt mmproj-Dateien."}, "code": "    fun isProjectorFileName(name: String): Boolean {\n        val n = name.lowercase()\n        return n.endsWith(\".gguf\") && n.contains(\"mmproj\")\n    }\n\n    /** Architectures that support image input once an mmproj is attached. */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/ModelCompatibility.kt", "cat": "Data · LLM", "order": 62, "start": 64, "end": 67, "kind": "val", "name": "VISION_ARCHS", "owner": "ModelCompatibility", "sig": "private val VISION_ARCHS = setOf(", "tech": [], "sum": {"ru": "Константа VISION_ARCHS", "en": "Constant VISION_ARCHS", "de": "Konstante VISION_ARCHS"}, "code": "    private val VISION_ARCHS = setOf(\n        \"qwen2vl\", \"qwen3vl\", \"qwen3vlmoe\", \"gemma3\", \"gemma3n\", \"gemma4\",\n        \"llama4\", \"minicpm\", \"cogvlm\", \"pixtral\", \"mistral3\", \"internlm2\"\n    )"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/ModelCompatibility.kt", "cat": "Data · LLM", "order": 62, "start": 69, "end": 71, "kind": "fun", "name": "isVisionArch", "owner": "ModelCompatibility", "sig": "fun isVisionArch(arch: String): Boolean = arch.lowercase() in VISION_ARCHS", "tech": [], "sum": {"ru": "Проверяет, vision ли архитектура.", "en": "Checks whether an architecture is a vision one.", "de": "Prüft, ob eine Architektur Vision-fähig ist."}, "code": "    fun isVisionArch(arch: String): Boolean = arch.lowercase() in VISION_ARCHS\n\n    /** Skip whole repositories whose tags declare an unsupported architecture. */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/ModelCompatibility.kt", "cat": "Data · LLM", "order": 62, "start": 72, "end": 77, "kind": "fun", "name": "repoHasUnsupportedArchTag", "owner": "ModelCompatibility", "sig": "fun repoHasUnsupportedArchTag(tags: List<String>?): Boolean {", "tech": [], "sum": {"ru": "Функция repoHasUnsupportedArchTag", "en": "Function repoHasUnsupportedArchTag", "de": "Funktion repoHasUnsupportedArchTag"}, "code": "    fun repoHasUnsupportedArchTag(tags: List<String>?): Boolean {\n        tags ?: return false\n        val lower = tags.map { it.lowercase() }\n        return UNSUPPORTED_ARCH_TAGS.any { it in lower }\n    }\n}"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/HuggingFaceClient.kt", "cat": "Data · LLM", "order": 63, "start": 18, "end": 28, "kind": "class", "name": "GgufSearchResult", "owner": "", "sig": "data class GgufSearchResult(", "tech": [], "sum": {"ru": "Результат поиска модели на Hugging Face.", "en": "Hugging Face model search result.", "de": "Hugging-Face-Suchergebnis."}, "code": "data class GgufSearchResult(\n    val repoId: String,\n    val fileName: String,\n    val sizeBytes: Long,\n    val downloads: Int,\n    val url: String\n)\n\n/**\n * Searches Hugging Face for GGUF models by keyword.\n */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/HuggingFaceClient.kt", "cat": "Data · LLM", "order": 63, "start": 29, "end": 29, "kind": "object", "name": "HuggingFaceClient", "owner": "", "sig": "object HuggingFaceClient {", "tech": [], "sum": {"ru": "Поиск .gguf в репозиториях Hugging Face.", "en": "Searches .gguf files in Hugging Face repos.", "de": "Sucht .gguf-Dateien in Hugging-Face-Repos."}, "code": "object HuggingFaceClient {"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/HuggingFaceClient.kt", "cat": "Data · LLM", "order": 63, "start": 30, "end": 30, "kind": "val", "name": "BASE", "owner": "HuggingFaceClient", "sig": "private const val BASE = \"https://huggingface.co\"", "tech": ["hf"], "sum": {"ru": "REST API Hugging Face", "en": "Hugging Face REST API", "de": "Hugging-Face-REST-API"}, "code": "    private const val BASE = \"https://huggingface.co\""}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/HuggingFaceClient.kt", "cat": "Data · LLM", "order": 63, "start": 31, "end": 31, "kind": "val", "name": "USER_AGENT", "owner": "HuggingFaceClient", "sig": "private const val USER_AGENT = \"GGUF-Chat-Android\"", "tech": [], "sum": {"ru": "Константа USER_AGENT", "en": "Constant USER_AGENT", "de": "Konstante USER_AGENT"}, "code": "    private const val USER_AGENT = \"GGUF-Chat-Android\""}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/HuggingFaceClient.kt", "cat": "Data · LLM", "order": 63, "start": 32, "end": 32, "kind": "val", "name": "REPO_LIMIT", "owner": "HuggingFaceClient", "sig": "private const val REPO_LIMIT = 60", "tech": [], "sum": {"ru": "Константа REPO_LIMIT", "en": "Constant REPO_LIMIT", "de": "Konstante REPO_LIMIT"}, "code": "    private const val REPO_LIMIT = 60"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/HuggingFaceClient.kt", "cat": "Data · LLM", "order": 63, "start": 33, "end": 44, "kind": "val", "name": "MAX_CONCURRENT_REQUESTS", "owner": "HuggingFaceClient", "sig": "private const val MAX_CONCURRENT_REQUESTS = 6", "tech": [], "sum": {"ru": "Константа MAX_CONCURRENT_REQUESTS", "en": "Constant MAX_CONCURRENT_REQUESTS", "de": "Konstante MAX_CONCURRENT_REQUESTS"}, "code": "    private const val MAX_CONCURRENT_REQUESTS = 6\n\n    /**\n     * Suspends while searching. Repositories are scanned in parallel.\n     *\n     * Results are grouped by repository popularity (most downloaded first) and\n     * within each repository listed by size ascending. A plain global\n     * size-ascending sort used to hide the useful quants (Q4/Q5) behind\n     * hundreds of tiny files once the result list was truncated.\n     *\n     * @param maxFileSizeBytes 0 or less = no size limit\n     */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/HuggingFaceClient.kt", "cat": "Data · LLM", "order": 63, "start": 45, "end": 73, "kind": "fun", "name": "searchGgufModels", "owner": "HuggingFaceClient", "sig": "suspend fun searchGgufModels(", "tech": ["coroutines", "json", "hf"], "sum": {"ru": "Параллельный поиск моделей в HF.", "en": "Parallel model search on HF.", "de": "Parallele Modellsuche auf HF."}, "code": "    suspend fun searchGgufModels(\n        query: String,\n        maxFileSizeBytes: Long,\n        maxResults: Int = 500,\n        includeProjectors: Boolean = false\n    ): List<GgufSearchResult> = coroutineScope {\n        val q = query.trim()\n        if (q.isEmpty()) return@coroutineScope emptyList()\n\n        val searchUrl = \"$BASE/api/models?search=${URLEncoder.encode(q, \"UTF-8\")}\" +\n                \"&filter=gguf&sort=downloads&direction=-1&limit=$REPO_LIMIT\"\n        val reposJson = httpGetJsonArray(searchUrl) ?: return@coroutineScope emptyList()\n\n        val semaphore = Semaphore(MAX_CONCURRENT_REQUESTS)\n        val deferreds = (0 until reposJson.length()).map { i ->\n            async(Dispatchers.IO) {\n                semaphore.withPermit {\n                    collectRepoFiles(reposJson.optJSONObject(i), maxFileSizeBytes, includeProjectors)\n                }\n            }\n        }\n        deferreds.awaitAll()\n            .flatten()\n            .sortedWith(\n                compareByDescending<GgufSearchResult> { it.downloads }\n                    .thenBy { it.sizeBytes }\n            )\n            .take(maxResults)\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/HuggingFaceClient.kt", "cat": "Data · LLM", "order": 63, "start": 75, "end": 123, "kind": "fun", "name": "collectRepoFiles", "owner": "HuggingFaceClient", "sig": "private fun collectRepoFiles(repo: JSONObject?, maxFileSizeBytes: Long, includeProjectors: Boolean): List<GgufSearchResult> {", "tech": ["mtmd", "json", "hf"], "sum": {"ru": "REST API Hugging Face; разбор/сборка JSON", "en": "Hugging Face REST API; JSON parse/build", "de": "Hugging-Face-REST-API; JSON-Parsing/Aufbau"}, "code": "    private fun collectRepoFiles(repo: JSONObject?, maxFileSizeBytes: Long, includeProjectors: Boolean): List<GgufSearchResult> {\n        repo ?: return emptyList()\n        val repoId = repo.optString(\"id\")\n        if (repoId.isEmpty()) return emptyList()\n        val downloads = repo.optInt(\"downloads\", 0)\n\n        // Skip repos declaring architectures this llama.cpp build cannot run\n        val tags = buildList {\n            val tagsArr = repo.optJSONArray(\"tags\")\n            if (tagsArr != null) for (k in 0 until tagsArr.length()) add(tagsArr.optString(k))\n        }\n        if (ModelCompatibility.repoHasUnsupportedArchTag(tags)) return emptyList()\n\n        val treeUrl = \"$BASE/api/models/${encodePath(repoId)}/tree/main?recursive=true\"\n        val tree = httpGetJsonArray(treeUrl) ?: return emptyList()\n\n        val found = mutableListOf<GgufSearchResult>()\n        for (j in 0 until tree.length()) {\n            val entry = tree.optJSONObject(j) ?: continue\n            val path = entry.optString(\"path\")\n            if (!path.endsWith(\".gguf\", ignoreCase = true)) continue\n\n            // Skip mmproj/lora/adapter/vocab files and split model parts.\n            // Projectors are kept only in projector-search mode.\n            val baseName = path.substringAfterLast('/')\n            val isProj = ModelCompatibility.isProjectorFileName(baseName)\n            if (isProj) {\n                if (!includeProjectors) continue\n            } else if (!ModelCompatibility.isModelFileName(baseName)) {\n                continue\n            }\n\n            var size = entry.optLong(\"size\", -1L)\n            if (size <= 0) size = entry.optJSONObject(\"lfs\")?.optLong(\"size\", -1L) ?: -1L\n            if (size <= 0) continue\n            if (maxFileSizeBytes > 0 && size > maxFileSizeBytes) continue\n\n            found.add(\n                GgufSearchResult(\n                    repoId = repoId,\n                    fileName = path.substringAfterLast('/'),\n                    sizeBytes = size,\n                    downloads = downloads,\n                    url = \"$BASE/${encodePath(repoId)}/resolve/main/${encodePath(path)}\"\n                )\n            )\n        }\n        return found\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/HuggingFaceClient.kt", "cat": "Data · LLM", "order": 63, "start": 125, "end": 126, "kind": "fun", "name": "encodePath", "owner": "HuggingFaceClient", "sig": "private fun encodePath(path: String): String =", "tech": [], "sum": {"ru": "обработка текста", "en": "text processing", "de": "Textverarbeitung"}, "code": "    private fun encodePath(path: String): String =\n        path.split('/').joinToString(\"/\") { URLEncoder.encode(it, \"UTF-8\").replace(\"+\", \"%20\") }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/HuggingFaceClient.kt", "cat": "Data · LLM", "order": 63, "start": 128, "end": 146, "kind": "fun", "name": "httpGetJsonArray", "owner": "HuggingFaceClient", "sig": "private fun httpGetJsonArray(urlString: String): JSONArray? {", "tech": ["json", "http", "fileio"], "sum": {"ru": "HTTP-запрос; разбор/сборка JSON; файловый ввод-вывод", "en": "HTTP request; JSON parse/build; file I/O", "de": "HTTP-Anfrage; JSON-Parsing/Aufbau; Datei-E/A"}, "code": "    private fun httpGetJsonArray(urlString: String): JSONArray? {\n        return try {\n            val conn = URL(urlString).openConnection() as HttpURLConnection\n            conn.connectTimeout = 15_000\n            conn.readTimeout = 30_000\n            conn.setRequestProperty(\"User-Agent\", USER_AGENT)\n            conn.connect()\n            if (conn.responseCode != HttpURLConnection.HTTP_OK) {\n                conn.disconnect()\n                return null\n            }\n            val text = conn.inputStream.bufferedReader().use { it.readText() }\n            conn.disconnect()\n            JSONArray(text)\n        } catch (_: Exception) {\n            null\n        }\n    }\n}"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LocalLlmNative.kt", "cat": "Data · LLM", "order": 64, "start": 5, "end": 14, "kind": "object", "name": "LocalLlmNative", "owner": "", "sig": "object LocalLlmNative {", "tech": ["jni"], "sum": {"ru": "Объявления JNI-функций нативной библиотеки.", "en": "JNI declarations of the native library.", "de": "JNI-Deklarationen der nativen Bibliothek."}, "code": "object LocalLlmNative {\n    private const val TAG = \"LocalLlmNative\"\n\n    init {\n        try {\n            System.loadLibrary(\"llama_jni\")\n        } catch (e: UnsatisfiedLinkError) {\n            Log.e(TAG, \"Failed to load llama_jni: ${e.message}\")\n        }\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LocalLlmNative.kt", "cat": "Data · LLM", "order": 64, "start": 16, "end": 16, "kind": "interface", "name": "TokenCallback", "owner": "LocalLlmNative", "sig": "interface TokenCallback {", "tech": [], "sum": {"ru": "Колбэк потоковой генерации (токен/завершение).", "en": "Streaming generation callback (token/done).", "de": "Callback der Streaming-Generierung (Token/Fertig)."}, "code": "    interface TokenCallback {"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LocalLlmNative.kt", "cat": "Data · LLM", "order": 64, "start": 17, "end": 17, "kind": "fun", "name": "onToken", "owner": "TokenCallback", "sig": "fun onToken(token: String)", "tech": [], "sum": {"ru": "Функция onToken", "en": "Function onToken", "de": "Funktion onToken"}, "code": "        fun onToken(token: String)"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LocalLlmNative.kt", "cat": "Data · LLM", "order": 64, "start": 18, "end": 19, "kind": "fun", "name": "onComplete", "owner": "TokenCallback", "sig": "fun onComplete(fullResponse: String)", "tech": [], "sum": {"ru": "Функция onComplete", "en": "Function onComplete", "de": "Funktion onComplete"}, "code": "        fun onComplete(fullResponse: String)\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LocalLlmNative.kt", "cat": "Data · LLM", "order": 64, "start": 21, "end": 21, "kind": "interface", "name": "ProgressCallback", "owner": "LocalLlmNative", "sig": "interface ProgressCallback {", "tech": [], "sum": {"ru": "Колбэк прогресса загрузки.", "en": "Load-progress callback.", "de": "Ladefortschritt-Callback."}, "code": "    interface ProgressCallback {"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LocalLlmNative.kt", "cat": "Data · LLM", "order": 64, "start": 22, "end": 23, "kind": "fun", "name": "onProgress", "owner": "ProgressCallback", "sig": "fun onProgress(progress: Float)", "tech": [], "sum": {"ru": "Функция onProgress", "en": "Function onProgress", "de": "Funktion onProgress"}, "code": "        fun onProgress(progress: Float)\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LocalLlmNative.kt", "cat": "Data · LLM", "order": 64, "start": 25, "end": 30, "kind": "fun", "name": "nativeLoadModel", "owner": "LocalLlmNative", "sig": "external fun nativeLoadModel(", "tech": ["jni"], "sum": {"ru": "Загружает модель и контекст llama.cpp + сэмплер.", "en": "Loads the llama.cpp model and context + sampler.", "de": "Lädt llama.cpp-Modell und -Kontext + Sampler."}, "code": "    external fun nativeLoadModel(\n        modelPath: String,\n        nThreads: Int,\n        nCtx: Int,\n        progressCallback: ProgressCallback\n    ): Long"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LocalLlmNative.kt", "cat": "Data · LLM", "order": 64, "start": 32, "end": 37, "kind": "fun", "name": "nativeApplyChatTemplate", "owner": "LocalLlmNative", "sig": "external fun nativeApplyChatTemplate(", "tech": ["jni"], "sum": {"ru": "Применяет chat-template модели к сообщениям.", "en": "Applies the model chat template to messages.", "de": "Wendet das Chat-Template des Modells auf Nachrichten an."}, "code": "    external fun nativeApplyChatTemplate(\n        handle: Long,\n        roles: Array<String>,\n        contents: Array<String>,\n        templateName: String\n    ): String"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LocalLlmNative.kt", "cat": "Data · LLM", "order": 64, "start": 39, "end": 39, "kind": "fun", "name": "nativeCancel", "owner": "LocalLlmNative", "sig": "external fun nativeCancel(handle: Long)", "tech": ["jni"], "sum": {"ru": "Ставит флаг отмены генерации.", "en": "Sets the generation cancel flag.", "de": "Setzt das Abbruch-Flag der Generierung."}, "code": "    external fun nativeCancel(handle: Long)"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LocalLlmNative.kt", "cat": "Data · LLM", "order": 64, "start": 41, "end": 41, "kind": "fun", "name": "nativeLoadMmproj", "owner": "LocalLlmNative", "sig": "external fun nativeLoadMmproj(handle: Long, mmprojPath: String): Boolean", "tech": ["jni", "mtmd"], "sum": {"ru": "Загружает mmproj-проектор (mtmd).", "en": "Loads the mmproj projector (mtmd).", "de": "Lädt den mmproj-Projektor (mtmd)."}, "code": "    external fun nativeLoadMmproj(handle: Long, mmprojPath: String): Boolean"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LocalLlmNative.kt", "cat": "Data · LLM", "order": 64, "start": 43, "end": 45, "kind": "fun", "name": "nativeHasMmproj", "owner": "LocalLlmNative", "sig": "external fun nativeHasMmproj(handle: Long): Boolean", "tech": ["jni"], "sum": {"ru": "Проверяет наличие проектора.", "en": "Checks whether a projector is present.", "de": "Prüft, ob ein Projektor vorhanden ist."}, "code": "    external fun nativeHasMmproj(handle: Long): Boolean\n\n    /** Placeholder token the prompt must contain where the image goes (mtmd). */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LocalLlmNative.kt", "cat": "Data · LLM", "order": 64, "start": 46, "end": 46, "kind": "fun", "name": "nativeMediaMarker", "owner": "LocalLlmNative", "sig": "external fun nativeMediaMarker(): String", "tech": ["jni", "mtmd"], "sum": {"ru": "Возвращает маркер вставки изображения.", "en": "Returns the image insertion marker.", "de": "Liefert den Bild-Einfügemarke."}, "code": "    external fun nativeMediaMarker(): String"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LocalLlmNative.kt", "cat": "Data · LLM", "order": 64, "start": 48, "end": 59, "kind": "fun", "name": "nativeGenerateStreamingVision", "owner": "LocalLlmNative", "sig": "external fun nativeGenerateStreamingVision(", "tech": ["jni"], "sum": {"ru": "Vision-инференс изображения через mtmd.", "en": "Vision inference of an image via mtmd.", "de": "Vision-Inferenz eines Bildes über mtmd."}, "code": "    external fun nativeGenerateStreamingVision(\n        handle: Long,\n        prompt: String,\n        rgbBytes: ByteArray,\n        width: Int,\n        height: Int,\n        maxTokens: Int,\n        temperature: Float,\n        topP: Float,\n        stopToken: String?,\n        callback: TokenCallback\n    ): String"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LocalLlmNative.kt", "cat": "Data · LLM", "order": 64, "start": 61, "end": 69, "kind": "fun", "name": "nativeGenerateStreaming", "owner": "LocalLlmNative", "sig": "external fun nativeGenerateStreaming(", "tech": ["jni"], "sum": {"ru": "Потоковая генерация текста (tokenize→decode→sample).", "en": "Streaming text generation (tokenize→decode→sample).", "de": "Streaming-Textgenerierung (tokenize→decode→sample)."}, "code": "    external fun nativeGenerateStreaming(\n        handle: Long,\n        prompt: String,\n        maxTokens: Int,\n        temperature: Float,\n        topP: Float,\n        stopToken: String?,\n        callback: TokenCallback\n    ): String"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LocalLlmNative.kt", "cat": "Data · LLM", "order": 64, "start": 71, "end": 73, "kind": "fun", "name": "nativeFreeModel", "owner": "LocalLlmNative", "sig": "external fun nativeFreeModel(handle: Long)", "tech": ["jni"], "sum": {"ru": "Освобождает модель и проектор.", "en": "Frees the model and projector.", "de": "Gibt Modell und Projektor frei."}, "code": "    external fun nativeFreeModel(handle: Long)\n\n    /** Return free native (llama) arena memory to the OS. */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LocalLlmNative.kt", "cat": "Data · LLM", "order": 64, "start": 74, "end": 74, "kind": "fun", "name": "nativeFreeMemory", "owner": "LocalLlmNative", "sig": "external fun nativeFreeMemory()", "tech": ["jni"], "sum": {"ru": "Возвращает память ОС (mallopt M_PURGE).", "en": "Returns memory to the OS (mallopt M_PURGE).", "de": "Gibt Speicher an das OS zurück (mallopt M_PURGE)."}, "code": "    external fun nativeFreeMemory()"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/llm/LocalLlmNative.kt", "cat": "Data · LLM", "order": 64, "start": 76, "end": 77, "kind": "fun", "name": "nativeIsModelLoaded", "owner": "LocalLlmNative", "sig": "external fun nativeIsModelLoaded(handle: Long): Boolean", "tech": ["jni"], "sum": {"ru": "Проверяет готовность модели.", "en": "Checks whether the model is ready.", "de": "Prüft, ob das Modell bereit ist."}, "code": "    external fun nativeIsModelLoaded(handle: Long): Boolean\n}"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/model/Entities.kt", "cat": "Data · Model", "order": 70, "start": 6, "end": 17, "kind": "class", "name": "ChatMessage", "owner": "", "sig": "data class ChatMessage(", "tech": ["serialization"], "sum": {"ru": "Сообщение чата (+изображение и статистика генерации).", "en": "Chat message (+image and generation stats).", "de": "Chat-Nachricht (+Bild und Generierungsstatistik)."}, "code": "data class ChatMessage(\n    val role: String, // \"user\" | \"assistant\"\n    val content: String,\n    val timestamp: Long = System.currentTimeMillis(),\n    // Optional image shown with this message (local file path)\n    val imagePath: String? = null,\n    // Generation stats for assistant replies (0 for user messages / unknown)\n    val generationMs: Long = 0L,\n    val tokenCount: Int = 0\n)\n\n@Serializable"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/model/Entities.kt", "cat": "Data · Model", "order": 70, "start": 18, "end": 28, "kind": "class", "name": "SessionDocument", "owner": "", "sig": "data class SessionDocument(", "tech": ["serialization"], "sum": {"ru": "Документ, прикреплённый к сессии.", "en": "Document attached to a session.", "de": "An eine Sitzung angehängtes Dokument."}, "code": "data class SessionDocument(\n    val id: String,\n    val name: String,\n    val ext: String,\n    val sizeBytes: Long,\n    val text: String,\n    val truncated: Boolean = false,\n    val addedAt: Long = System.currentTimeMillis()\n)\n\n@Serializable"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/model/Entities.kt", "cat": "Data · Model", "order": 70, "start": 29, "end": 38, "kind": "class", "name": "ChatSession", "owner": "", "sig": "data class ChatSession(", "tech": ["serialization"], "sum": {"ru": "Сессия чата: заголовок и сообщения.", "en": "Chat session: title and messages.", "de": "Chat-Sitzung: Titel und Nachrichten."}, "code": "data class ChatSession(\n    val id: String,\n    val title: String,\n    val createdAt: Long = System.currentTimeMillis(),\n    val messages: List<ChatMessage> = emptyList(),\n    // Documents attached to this chat, injected as context on every generation.\n    val documents: List<SessionDocument> = emptyList()\n)\n\n@Serializable"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/model/Entities.kt", "cat": "Data · Model", "order": 70, "start": 39, "end": 49, "kind": "class", "name": "ModelInfo", "owner": "", "sig": "data class ModelInfo(", "tech": ["mtmd"], "sum": {"ru": "Метаданные модели (путь, архитектура, контекст).", "en": "Model metadata (path, architecture, context).", "de": "Modell-Metadaten (Pfad, Architektur, Kontext)."}, "code": "data class ModelInfo(\n    val name: String,\n    val path: String,\n    val sizeBytes: Long,\n    val architecture: String = \"Unknown\",\n    val contextLength: Int = 4096,\n    val tensorCount: Long = 0,\n    val addedAt: Long = System.currentTimeMillis(),\n    // Optional multimodal projector (mmproj) enabling image input\n    val mmprojPath: String? = null\n)"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/model/Entities.kt", "cat": "Data · Model", "order": 70, "start": 51, "end": 60, "kind": "class", "name": "GgufInfo", "owner": "", "sig": "data class GgufInfo(", "tech": [], "sum": {"ru": "Разобранная информация GGUF + metadata.", "en": "Parsed GGUF info + metadata.", "de": "Geparste GGUF-Infos + Metadaten."}, "code": "data class GgufInfo(\n    val isValid: Boolean,\n    val version: Int = 0,\n    val tensorCount: Long = 0,\n    val kvCount: Long = 0,\n    val error: String? = null,\n    val modelArchitecture: String = \"Unknown\",\n    val contextLength: Int = 2048,\n    val metadata: Map<String, Any> = emptyMap()\n)"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/model/Entities.kt", "cat": "Data · Model", "order": 70, "start": 62, "end": 62, "kind": "class", "name": "ModelState", "owner": "", "sig": "enum class ModelState { UNLOADED, LOADING, LOADED, ERROR }", "tech": [], "sum": {"ru": "Состояние загрузки модели.", "en": "Model load state.", "de": "Modell-Ladezustand."}, "code": "enum class ModelState { UNLOADED, LOADING, LOADED, ERROR }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/model/Entities.kt", "cat": "Data · Model", "order": 70, "start": 64, "end": 88, "kind": "class", "name": "LlmSettings", "owner": "", "sig": "data class LlmSettings(", "tech": [], "sum": {"ru": "Все настройки генерации/UI/голоса.", "en": "All generation/UI/voice settings.", "de": "Alle Generierungs-/UI-/Sprach-Einstellungen."}, "code": "data class LlmSettings(\n    val systemPrompt: String = \"You are a helpful assistant.\",\n    val temperature: Float = 0.7f,\n    val topP: Float = 0.9f,\n    val maxTokens: Int = 1024,\n    val contextLength: Int = 4096,\n    val threads: Int = 4,\n    val autoSuggest: Boolean = true,\n    val suggestionCount: Int = 4,\n    // Max tokens of attached documents fed into the suggestion prompt (0 = ignore docs)\n    val suggestionDocTokens: Int = 768,\n    val ttsEnabled: Boolean = true,\n    val ttsLanguage: String = \"en\",\n    val ttsRate: Float = 1.0f,\n    val sttLanguage: String = \"en\",\n    val appLanguage: String = \"en\",\n    val appTheme: String = \"light\",\n    // Language for assistant replies AND suggestions: \"auto\" (follow appLanguage),\n    // or \"en\" / \"ru\" / \"de\". Enforced regardless of message/document language.\n    val answerLanguage: String = \"auto\",\n    // \"bottom\" (default) or \"top\"\n    val inputPosition: String = \"bottom\",\n    // \"wrap\" (chips flow onto new lines) or \"single_row\" (one scrollable row)\n    val suggestionsLayout: String = \"wrap\"\n)"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/voice/SttManager.kt", "cat": "Data · Voice", "order": 80, "start": 15, "end": 28, "kind": "class", "name": "SttManager", "owner": "", "sig": "class SttManager(private val context: Context) {", "tech": ["flow", "stt"], "sum": {"ru": "Обёртка Android SpeechRecognizer (STT).", "en": "Wrapper around Android SpeechRecognizer (STT).", "de": "Wrapper um Android SpeechRecognizer (STT)."}, "code": "class SttManager(private val context: Context) {\n    private val TAG = \"SttManager\"\n\n    private var speechRecognizer: SpeechRecognizer? = null\n    private var _isListeningInternal = false\n\n    private val _isListening = MutableStateFlow(false)\n    val isListening: StateFlow<Boolean> = _isListening.asStateFlow()\n\n    private val _partialResult = MutableStateFlow(\"\")\n    val partialResult: StateFlow<String> = _partialResult.asStateFlow()\n\n    private val _error = MutableStateFlow<String?>(null)\n    val error: StateFlow<String?> = _error.asStateFlow()"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/voice/SttManager.kt", "cat": "Data · Voice", "order": 80, "start": 30, "end": 32, "kind": "fun", "name": "isAvailable", "owner": "SttManager", "sig": "fun isAvailable(): Boolean {", "tech": ["stt"], "sum": {"ru": "распознавание речи (STT)", "en": "speech recognition (STT)", "de": "Spracherkennung (STT)"}, "code": "    fun isAvailable(): Boolean {\n        return SpeechRecognizer.isRecognitionAvailable(context)\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/voice/SttManager.kt", "cat": "Data · Voice", "order": 80, "start": 34, "end": 107, "kind": "fun", "name": "startListening", "owner": "SttManager", "sig": "fun startListening(language: String, onResult: (String) -> Unit) {", "tech": ["stt"], "sum": {"ru": "Запускает распознавание речи.", "en": "Starts speech recognition.", "de": "Startet die Spracherkennung."}, "code": "    fun startListening(language: String, onResult: (String) -> Unit) {\n        if (_isListeningInternal) return\n\n        if (!SpeechRecognizer.isRecognitionAvailable(context)) {\n            _error.value = \"Speech recognition not available on this device\"\n            return\n        }\n\n        try {\n            speechRecognizer = SpeechRecognizer.createSpeechRecognizer(context).apply {\n                setRecognitionListener(object : RecognitionListener {\n                    override fun onReadyForSpeech(params: Bundle?) {\n                        _isListening.value = true\n                        _partialResult.value = \"\"\n                        _error.value = null\n                    }\n\n                    override fun onBeginningOfSpeech() {}\n                    override fun onRmsChanged(rmsdB: Float) {}\n                    override fun onBufferReceived(buffer: ByteArray?) {}\n\n                    override fun onEndOfSpeech() {\n                        _isListening.value = false\n                    }\n\n                    override fun onError(errorCode: Int) {\n                        _isListening.value = false\n                        _error.value = when (errorCode) {\n                            SpeechRecognizer.ERROR_AUDIO -> \"Audio recording error\"\n                            SpeechRecognizer.ERROR_CLIENT -> \"Client side error\"\n                            SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS -> \"Insufficient permissions\"\n                            SpeechRecognizer.ERROR_NETWORK -> \"Network error\"\n                            SpeechRecognizer.ERROR_NETWORK_TIMEOUT -> \"Network timeout\"\n                            SpeechRecognizer.ERROR_NO_MATCH -> \"No speech recognized\"\n                            SpeechRecognizer.ERROR_RECOGNIZER_BUSY -> \"Recognizer busy\"\n                            SpeechRecognizer.ERROR_SERVER -> \"Server error\"\n                            SpeechRecognizer.ERROR_SPEECH_TIMEOUT -> \"No speech input\"\n                            else -> \"Unknown error ($errorCode)\"\n                        }\n                    }\n\n                    override fun onResults(results: Bundle?) {\n                        _isListening.value = false\n                        val matches = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)\n                        val text = matches?.firstOrNull() ?: \"\"\n                        if (text.isNotEmpty()) {\n                            onResult(text)\n                        }\n                        _partialResult.value = \"\"\n                    }\n\n                    override fun onPartialResults(partialResults: Bundle?) {\n                        val matches = partialResults?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)\n                        _partialResult.value = matches?.firstOrNull() ?: \"\"\n                    }\n\n                    override fun onEvent(eventType: Int, params: Bundle?) {}\n                })\n            }\n\n            val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {\n                putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)\n                putExtra(RecognizerIntent.EXTRA_LANGUAGE, language)\n                putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)\n                putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 1)\n            }\n\n            speechRecognizer?.startListening(intent)\n            _isListeningInternal = true\n        } catch (e: Exception) {\n            Log.e(TAG, \"Failed to start listening\", e)\n            _error.value = e.message ?: \"Failed to start speech recognition\"\n        }\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/voice/SttManager.kt", "cat": "Data · Voice", "order": 80, "start": 109, "end": 117, "kind": "fun", "name": "stopListening", "owner": "SttManager", "sig": "fun stopListening() {", "tech": [], "sum": {"ru": "Функция stopListening", "en": "Function stopListening", "de": "Funktion stopListening"}, "code": "    fun stopListening() {\n        try {\n            speechRecognizer?.stopListening()\n        } catch (e: Exception) {\n            Log.e(TAG, \"Failed to stop listening\", e)\n        }\n        _isListeningInternal = false\n        _isListening.value = false\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/voice/SttManager.kt", "cat": "Data · Voice", "order": 80, "start": 119, "end": 129, "kind": "fun", "name": "destroy", "owner": "SttManager", "sig": "fun destroy() {", "tech": [], "sum": {"ru": "Функция destroy", "en": "Function destroy", "de": "Funktion destroy"}, "code": "    fun destroy() {\n        try {\n            speechRecognizer?.destroy()\n        } catch (e: Exception) {\n            Log.e(TAG, \"Failed to destroy recognizer\", e)\n        }\n        speechRecognizer = null\n        _isListeningInternal = false\n        _isListening.value = false\n    }\n}"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/voice/TtsManager.kt", "cat": "Data · Voice", "order": 81, "start": 12, "end": 24, "kind": "class", "name": "TtsManager", "owner": "", "sig": "class TtsManager(private val context: Context) {", "tech": ["flow", "tts"], "sum": {"ru": "Обёртка Android TextToSpeech (TTS).", "en": "Wrapper around Android TextToSpeech (TTS).", "de": "Wrapper um Android TextToSpeech (TTS)."}, "code": "class TtsManager(private val context: Context) {\n    private val TAG = \"TtsManager\"\n\n    private var tts: TextToSpeech? = null\n    private var isInitialized = false\n\n    private val _isSpeaking = MutableStateFlow(false)\n    val isSpeaking: StateFlow<Boolean> = _isSpeaking.asStateFlow()\n\n    private val _isReady = MutableStateFlow(false)\n    val isReady: StateFlow<Boolean> = _isReady.asStateFlow()\n\n    private var pendingText: String? = null"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/voice/TtsManager.kt", "cat": "Data · Voice", "order": 81, "start": 26, "end": 54, "kind": "fun", "name": "initialize", "owner": "TtsManager", "sig": "fun initialize(onReady: (() -> Unit)? = null) {", "tech": ["tts"], "sum": {"ru": "Инициализирует движок TTS.", "en": "Initialises the TTS engine.", "de": "Initialisiert die TTS-Engine."}, "code": "    fun initialize(onReady: (() -> Unit)? = null) {\n        if (isInitialized) {\n            onReady?.invoke()\n            return\n        }\n        tts = TextToSpeech(context) { status ->\n            if (status == TextToSpeech.SUCCESS) {\n                isInitialized = true\n                _isReady.value = true\n                tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {\n                    override fun onStart(utteranceId: String?) {\n                        _isSpeaking.value = true\n                    }\n\n                    override fun onDone(utteranceId: String?) {\n                        _isSpeaking.value = false\n                    }\n\n                    override fun onError(utteranceId: String?) {\n                        _isSpeaking.value = false\n                    }\n                })\n                onReady?.invoke()\n            } else {\n                Log.e(TAG, \"TTS initialization failed with status: $status\")\n                _isReady.value = false\n            }\n        }\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/voice/TtsManager.kt", "cat": "Data · Voice", "order": 81, "start": 56, "end": 64, "kind": "fun", "name": "setLanguage", "owner": "TtsManager", "sig": "fun setLanguage(language: String) {", "tech": [], "sum": {"ru": "локализация (en/ru/de)", "en": "localization (en/ru/de)", "de": "Lokalisierung (en/ru/de)"}, "code": "    fun setLanguage(language: String) {\n        if (!isInitialized) return\n        val locale = when (language) {\n            \"ru\" -> Locale(\"ru\", \"RU\")\n            \"de\" -> Locale(\"de\", \"DE\")\n            else -> Locale(\"en\", \"US\")\n        }\n        tts?.language = locale\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/voice/TtsManager.kt", "cat": "Data · Voice", "order": 81, "start": 66, "end": 71, "kind": "fun", "name": "setRate", "owner": "TtsManager", "sig": "fun setRate(rate: Float) {", "tech": [], "sum": {"ru": "Функция setRate", "en": "Function setRate", "de": "Funktion setRate"}, "code": "    fun setRate(rate: Float) {\n        if (!isInitialized) return\n        tts?.setSpeechRate(rate)\n    }\n\n    private var utteranceSeq = 0"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/voice/TtsManager.kt", "cat": "Data · Voice", "order": 81, "start": 73, "end": 78, "kind": "fun", "name": "speak", "owner": "TtsManager", "sig": "fun speak(text: String) = speakChunk(text, flush = true)", "tech": [], "sum": {"ru": "Функция speak", "en": "Function speak", "de": "Funktion speak"}, "code": "    fun speak(text: String) = speakChunk(text, flush = true)\n\n    /**\n     * Speaks [text]. With [flush] = true the queue is cleared first (start of a new\n     * answer); otherwise the chunk is appended so streaming speech plays continuously.\n     */"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/voice/TtsManager.kt", "cat": "Data · Voice", "order": 81, "start": 79, "end": 94, "kind": "fun", "name": "speakChunk", "owner": "TtsManager", "sig": "fun speakChunk(text: String, flush: Boolean) {", "tech": ["tts", "regex"], "sum": {"ru": "Потоковая речь: добавляет фрагмент или очищает очередь.", "en": "Streaming speech: appends a chunk or flushes the queue.", "de": "Streaming-Sprache: hängt ein Fragment an oder leert die Warteschlange."}, "code": "    fun speakChunk(text: String, flush: Boolean) {\n        if (!isInitialized) {\n            pendingText = text\n            return\n        }\n        // Clean markdown for speech\n        val cleaned = text\n            .replace(Regex(\"\"\"[*_`#\\[\\]()]\"\"\"), \"\")\n            .replace(Regex(\"\"\"\\n+\"\"\"), \". \")\n            .trim()\n\n        if (cleaned.isEmpty()) return\n\n        val mode = if (flush) TextToSpeech.QUEUE_FLUSH else TextToSpeech.QUEUE_ADD\n        tts?.speak(cleaned, mode, null, \"gguf_tts_${System.currentTimeMillis()}_${utteranceSeq++}\")\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/voice/TtsManager.kt", "cat": "Data · Voice", "order": 81, "start": 96, "end": 99, "kind": "fun", "name": "stop", "owner": "TtsManager", "sig": "fun stop() {", "tech": [], "sum": {"ru": "Функция stop", "en": "Function stop", "de": "Funktion stop"}, "code": "    fun stop() {\n        tts?.stop()\n        _isSpeaking.value = false\n    }"}, {"file": "app/src/main/java/com/devhorizon/online/ggufchat/data/voice/TtsManager.kt", "cat": "Data · Voice", "order": 81, "start": 101, "end": 109, "kind": "fun", "name": "shutdown", "owner": "TtsManager", "sig": "fun shutdown() {", "tech": [], "sum": {"ru": "Функция shutdown", "en": "Function shutdown", "de": "Funktion shutdown"}, "code": "    fun shutdown() {\n        tts?.stop()\n        tts?.shutdown()\n        tts = null\n        isInitialized = false\n        _isReady.value = false\n        _isSpeaking.value = false\n    }\n}"}, {"file": "app/src/main/cpp/llama_jni.cpp", "cat": "Native · JNI", "order": 90, "start": 49, "end": 55, "kind": "c++", "name": "jstring_to_std", "owner": "", "sig": "static std::string jstring_to_std(JNIEnv *env, jstring js) {", "tech": ["jni"], "sum": {"ru": "Конвертирует jstring в std::string.", "en": "Converts a jstring to std::string.", "de": "Wandelt jstring in std::string um."}, "code": "static std::string jstring_to_std(JNIEnv *env, jstring js) {\n    if (!js) return \"\";\n    const char *c = env->GetStringUTFChars(js, nullptr);\n    std::string s(c);\n    env->ReleaseStringUTFChars(js, c);\n    return s;\n}"}, {"file": "app/src/main/cpp/llama_jni.cpp", "cat": "Native · JNI", "order": 90, "start": 58, "end": 67, "kind": "c++", "name": "load_progress_callback", "owner": "", "sig": "static bool load_progress_callback(float progress, void *user_data) {", "tech": ["jni"], "sum": {"ru": "Колбэк прогресса загрузки llama.cpp.", "en": "llama.cpp load-progress callback.", "de": "llama.cpp-Ladefortschritt-Callback."}, "code": "static bool load_progress_callback(float progress, void *user_data) {\n    JNIEnv *e = *static_cast<JNIEnv **>(user_data);\n    if (e && g_progress_cb && g_progress_mid) {\n        e->CallVoidMethod(g_progress_cb, g_progress_mid, progress);\n        if (e->ExceptionCheck()) {\n            e->ExceptionClear();\n        }\n    }\n    return true; // continue loading\n}"}, {"file": "app/src/main/cpp/llama_jni.cpp", "cat": "Native · JNI", "order": 90, "start": 70, "end": 80, "kind": "c++", "name": "make_sampler", "owner": "", "sig": "static llama_sampler * make_sampler(const LlmSession *s, float temp, float topP) {", "tech": ["llama"], "sum": {"ru": "Собирает сэмплер: penalties→temp→top_p→dist.", "en": "Builds the sampler: penalties→temp→top_p→dist.", "de": "Baut den Sampler: penalties→temp→top_p→dist."}, "code": "static llama_sampler * make_sampler(const LlmSession *s, float temp, float topP) {\n    auto sparams = llama_sampler_chain_default_params();\n    llama_sampler *sampler = llama_sampler_chain_init(sparams);\n    // Order matters: penalties act on raw logits, before temp/top-p.\n    llama_sampler_chain_add(sampler, llama_sampler_init_penalties(\n        llama_vocab_n_tokens(s->vocab), -1, 1.1f, 0.3f, 0.3f));\n    llama_sampler_chain_add(sampler, llama_sampler_init_temp(temp));\n    llama_sampler_chain_add(sampler, llama_sampler_init_top_p(topP, 1));\n    llama_sampler_chain_add(sampler, llama_sampler_init_dist(LLAMA_DEFAULT_SEED));\n    return sampler;\n}"}, {"file": "app/src/main/cpp/llama_jni.cpp", "cat": "Native · JNI", "order": 90, "start": 83, "end": 87, "kind": "c++", "name": "decode_one", "owner": "", "sig": "static bool decode_one(LlmSession *s, llama_token tok, llama_pos pos) {", "tech": ["llama"], "sum": {"ru": "Декодирует один batch токенов.", "en": "Decodes a single batch of tokens.", "de": "Dekodiert einen einzelnen Token-Batch."}, "code": "static bool decode_one(LlmSession *s, llama_token tok, llama_pos pos) {\n    llama_batch b = llama_batch_get_one(&tok, 1);\n    b.pos = &pos;\n    return llama_decode(s->ctx, b) == 0;\n}"}, {"file": "app/src/main/cpp/llama_jni.cpp", "cat": "Native · JNI", "order": 90, "start": 90, "end": 153, "kind": "c++", "name": "data_llm_LocalLlmNative_nativeLoadModel", "owner": "", "sig": "JNIEXPORT jlong JNICALL", "tech": ["jni", "llama"], "sum": {"ru": "вызов нативной библиотеки (JNI)", "en": "native library call (JNI)", "de": "Aufruf der nativen Bibliothek (JNI)"}, "code": "JNIEXPORT jlong JNICALL\nJava_com_devhorizon_online_ggufchat_data_llm_LocalLlmNative_nativeLoadModel(\n        JNIEnv *env, jobject /* this */,\n        jstring modelPath, jint nThreads, jint nCtx,\n        jobject progressCallback) {\n\n    std::string path = jstring_to_std(env, modelPath);\n    LOGI(\"Loading model: %s (threads=%d, nCtx=%d)\", path.c_str(), nThreads, nCtx);\n\n    static bool backend_inited = false;\n    if (!backend_inited) {\n        llama_backend_init();\n        backend_inited = true;\n    }\n\n    auto session = std::make_shared<LlmSession>();\n    session->n_threads = nThreads;\n    session->n_ctx = nCtx;\n\n    JNIEnv *jniEnv = env;\n    g_progress_cb = progressCallback ? env->NewGlobalRef(progressCallback) : nullptr;\n    jclass cbClass = progressCallback ? env->GetObjectClass(progressCallback) : nullptr;\n    g_progress_mid = cbClass ? env->GetMethodID(cbClass, \"onProgress\", \"(F)V\") : nullptr;\n\n    struct llama_model_params mparams = llama_model_default_params();\n    mparams.progress_callback = load_progress_callback;\n    mparams.progress_callback_user_data = &jniEnv;\n\n    session->model = llama_model_load_from_file(path.c_str(), mparams);\n\n    if (g_progress_cb) {\n        env->DeleteGlobalRef(g_progress_cb);\n        g_progress_cb = nullptr;\n    }\n    g_progress_mid = nullptr;\n\n    if (!session->model) {\n        LOGE(\"Failed to load model: %s\", path.c_str());\n        return -1;\n    }\n\n    session->vocab = llama_model_get_vocab(session->model);\n\n    struct llama_context_params cparams = llama_context_default_params();\n    cparams.n_ctx   = nCtx;\n    cparams.n_batch = 512;\n    cparams.n_threads = nThreads;\n    cparams.n_threads_batch = nThreads;\n    session->ctx = llama_init_from_model(session->model, cparams);\n    if (!session->ctx) {\n        LOGE(\"Failed to create context\");\n        llama_model_free(session->model);\n        session->model = nullptr;\n        return -1;\n    }\n\n    session->ready = true;\n\n    std::lock_guard<std::mutex> lock(g_mutex);\n    int64_t id = g_next_id.fetch_add(1);\n    g_sessions[id] = session;\n    LOGI(\"Model loaded, handle=%ld\", (long)id);\n    return static_cast<jlong>(id);\n}"}, {"file": "app/src/main/cpp/llama_jni.cpp", "cat": "Native · JNI", "order": 90, "start": 156, "end": 215, "kind": "c++", "name": "data_llm_LocalLlmNative_nativeApplyChatTemplate", "owner": "", "sig": "JNIEXPORT jstring JNICALL", "tech": ["jni", "llama"], "sum": {"ru": "вызов нативной библиотеки (JNI); инференс llama.cpp", "en": "native library call (JNI); llama.cpp inference", "de": "Aufruf der nativen Bibliothek (JNI); llama.cpp-Inferenz"}, "code": "JNIEXPORT jstring JNICALL\nJava_com_devhorizon_online_ggufchat_data_llm_LocalLlmNative_nativeApplyChatTemplate(\n        JNIEnv *env, jobject /* this */,\n        jlong handle, jobjectArray roles, jobjectArray contents, jstring templateName) {\n\n    std::lock_guard<std::mutex> lock(g_mutex);\n    auto it = g_sessions.find(handle);\n    if (it == g_sessions.end() || !it->second->ready) {\n        return env->NewStringUTF(\"[error: invalid model handle]\");\n    }\n    auto &s = it->second;\n\n    const char *tmpl = nullptr;\n    std::string tmplName = jstring_to_std(env, templateName);\n    if (!tmplName.empty()) {\n        tmpl = llama_model_chat_template(s->model, tmplName.c_str());\n    } else {\n        tmpl = llama_model_chat_template(s->model, nullptr);\n    }\n\n    if (!tmpl) {\n        LOGE(\"No chat template found in model metadata\");\n        return env->NewStringUTF(\"[error: no chat template]\");\n    }\n\n    jsize n_msgs = env->GetArrayLength(roles);\n    if (n_msgs <= 0 || env->GetArrayLength(contents) != n_msgs) {\n        return env->NewStringUTF(\"[error: no messages parsed]\");\n    }\n\n    std::vector<std::string> roleStore(n_msgs);\n    std::vector<std::string> contentStore(n_msgs);\n    std::vector<llama_chat_message> messages(n_msgs);\n\n    for (jsize i = 0; i < n_msgs; i++) {\n        auto jr = static_cast<jstring>(env->GetObjectArrayElement(roles, i));\n        auto jc = static_cast<jstring>(env->GetObjectArrayElement(contents, i));\n        roleStore[i] = jstring_to_std(env, jr);\n        contentStore[i] = jstring_to_std(env, jc);\n        env->DeleteLocalRef(jr);\n        env->DeleteLocalRef(jc);\n        messages[i].role = roleStore[i].c_str();\n        messages[i].content = contentStore[i].c_str();\n    }\n\n    int32_t n = llama_chat_apply_template(tmpl, messages.data(), messages.size(), true, nullptr, 0);\n    if (n < 0) {\n        LOGE(\"Failed to apply chat template: %d\", n);\n        return env->NewStringUTF(\"[error: apply template failed]\");\n    }\n\n    std::vector<char> buf(n);\n    n = llama_chat_apply_template(tmpl, messages.data(), messages.size(), true, buf.data(), buf.size());\n    if (n < 0) {\n        LOGE(\"Failed to apply chat template (2nd pass): %d\", n);\n        return env->NewStringUTF(\"[error: apply template failed]\");\n    }\n\n    return env->NewStringUTF(std::string(buf.data(), n).c_str());\n}"}, {"file": "app/src/main/cpp/llama_jni.cpp", "cat": "Native · JNI
