  document.getElementById("search").placeholder = t.search[L];
  document.getElementById("expandAll").textContent = t.expandAll[L];
  document.getElementById("collapseAll").textContent = t.collapseAll[L];
  document.getElementById("foot").textContent = "GGUF Chat · " + DB.rows.length + " " + t.records[L];
  renderLangs();
}

function renderLangs(){
  const box = document.getElementById("langs");
  box.innerHTML = "";
  [["ru","RU"],["en","EN"],["de","DE"]].forEach(([code,label])=>{
    const b = document.createElement("button");
    b.textContent = label;
    if(code===LANG) b.className = "on";
    b.onclick = ()=>{ LANG = code; renderChrome(); render(); };
    box.appendChild(b);
  });
}

function techChips(keys){
  return keys.map(k => {
    const lbl = (DB.tech[k]||{})[LANG] || k;
    return '<span class="chip">'+esc(lbl)+'</span>';
  }).join("");
}

function renderCode(code, start){
  const lines = code.split("\n");
  let h = "";
  for(let i=0;i<lines.length;i++){
    h += '<div class="cl"><span class="ln">'+(start+i)+'</span><span class="lc">'+esc(lines[i])+"</span></div>";
  }
  return h;
}

function rowHTML(r, idx){
  const k = (DB.kind[r.kind]||{})[LANG] || r.kind;
  const owner = r.owner ? '<div class="owner">'+STR.owner[LANG]+': <b>'+esc(r.owner)+'</b></div>' : "";
  const loc = esc(r.file)+":"+r.start+"–"+r.end;
  const sum = (r.sum && r.sum[LANG]) ? r.sum[LANG] : "";
  return '<tr class="row" data-idx="'+idx+'">'
    + '<td><span class="badge">'+esc(k)+'</span><span class="name">'+esc(r.name)+"</span>"+owner+"</td>"
    + '<td><div class="clamp techcell">'+techChips(r.tech)+"</div></td>"
    + '<td>'
      + '<div class="sumcell"><span class="loc">'+loc+"</span>"
      + ' <span style="color:#5b6880">· '+lineCount(r)+" "+STR.lines[LANG]+'</span>'
      + '<div class="sumtxt clamp">'+esc(sum)+"</div></div>"
      + '<div class="codecell"><span class="loc">'+loc+"</span>"
      + ' <span style="color:#5b6880">· '+lineCount(r)+" "+STR.lines[LANG]+' · '+esc(k)+'</span>'
      + '<div class="code">'+renderCode(r.code, r.start)+"</div></div>"
    + "</td></tr>";
}

let DATA = [];

function buildData(query){
  const q = (query||"").trim().toLowerCase();
  DATA = DB.rows.filter(r=>{
    if(!q) return true;
    const hay = [r.name, r.owner, r.file, r.sig, (r.tech||[]).join(" "),
      (r.sum&&r.sum[LANG])||"", r.code].join(" ").toLowerCase();
    return hay.indexOf(q) >= 0;
  });
  // renumber idx
  DATA.forEach((r,i)=>r._i=i);
}

function render(){
  const tb = document.getElementById("tbody");
  tb.innerHTML = "";
  let lastFile = null;
  DATA.forEach((r, i)=>{
    if(r.file !== lastFile){
      lastFile = r.file;
      const tr = document.createElement("tr");
      tr.className = "grp";
      tr.innerHTML = '<td colspan="3"><span class="car">▾</span>'+esc(r.cat)+" · "+esc(r.file)
        +' <span class="gcount">('+DATA.filter(x=>x.file===r.file).length+")</span></td>";
      const f = r.file;
      tr.onclick = ()=>{ document.querySelectorAll('tr.row[data-file="'+CSS.escape(f)+'"]')
        .forEach(x=>x.classList.toggle("open")); };
      tb.appendChild(tr);
    }
    const tpl = document.createElement("template");
    tpl.innerHTML = rowHTML(r, i).trim();
    const rowEl = tpl.content.firstChild;
    rowEl.setAttribute("data-file", r.file);
    rowEl.onclick = ()=> rowEl.classList.toggle("open");
    tb.appendChild(rowEl);
  });
  document.getElementById("cnt").textContent = DATA.length + " " + STR.records[LANG];
  clampAll();
}

function clampAll(){
  document.querySelectorAll(".clamp").forEach(el=>{
    el.classList.remove("wrap");
    if(el.scrollWidth > el.clientWidth + 1) el.classList.add("wrap");
  });
}

function draw(){
  const q = document.getElementById("search").value;
  buildData(q);
  render();
}

document.getElementById("search").addEventListener("input", ()=>{ buildData(document.getElementById("search").value); render(); });
document.getElementById("expandAll").onclick = ()=> document.querySelectorAll("tr.row").forEach(x=>x.classList.add("open"));
document.getElementById("collapseAll").onclick = ()=> document.querySelectorAll("tr.row").forEach(x=>x.classList.remove("open"));
window.addEventListener("resize", ()=>clampAll());
renderChrome();
draw();
</script>
</body>
</html>
